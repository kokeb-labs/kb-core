---
# The port SDK of a release (docs/port-sdk.md), built and verified on a pushed v* tag with read-only permissions and
# uploaded as the artifact `kb-port-sdk`. The privileged Release workflow (release.yml) downloads that artifact for
# this run and publishes it; it never checks out or runs the tagged tree. Pull requests and branches build the SDK
# in the ctest `kb_port_sdk`.
name: Port SDK

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sdk:
    name: Build and verify the port SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build and verify
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -I tools/release/port_sdk.py build --tag "$TAG" --out "$RUNNER_TEMP/sdk"
          python3 -I tools/release/port_sdk.py verify "$RUNNER_TEMP/sdk/kb-port-sdk-${TAG#v}.tar.gz" \
            --manifest "$RUNNER_TEMP/sdk/kb-port-sdk-${TAG#v}.manifest.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: kb-port-sdk
          path: ${{ runner.temp }}/sdk/
          if-no-files-found: error
          retention-days: 14
