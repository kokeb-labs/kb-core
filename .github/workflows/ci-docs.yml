---
# Documentation: strict MkDocs build, figure and generated-region checks, Doxygen per part under /api/, link check,
# publish on main and tags. Calls kokeb-labs/ci-tools ru-mkdocs-publish. The vulnerability data is rendered into the
# build (collect.py, with the build date, so the page can say it is stale); the weekly run rescans first.
name: Docs

on:
  workflow_call:
    inputs:
      refresh_vulnerabilities:
        description: >-
          Rescan the pinned components (tools/vuln/scan.py, network) before the build, so the site embeds today's
          data; set by the weekly ci-vulnerabilities.yml, never committed.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docs:
    uses: kokeb-labs/ci-tools/.github/workflows/ru-mkdocs-publish.yml@v1
    permissions:
      contents: write  # the publish job pushes gh-pages; pull requests never publish
    with:
      mkdocs_config: _config/mkdocs.yml
      deploy: true  # publishes to gh-pages on main and tags; pull requests never publish
      check_commands: |
        ${{ inputs.refresh_vulnerabilities && 'python3 tools/vuln/scan.py' || 'true' }}
        python3 tools/vuln/collect.py --site configurator/data --docs docs/assurance/vulnerabilities.md
        kokeb-docs check
        python3 tools/docs/check_figures.py
      doxygen_config: _config/Doxyfile  # paths inside are relative to the root, where Doxygen runs
