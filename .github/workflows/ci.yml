---
# kb-core CI (ADR-0004): every check, then the one gate the ruleset requires ("CI gate / gate"). Each check is its
# own caller file of kokeb-labs/ci-tools reusable workflows at @v1 (v1.19 or later).
# Level high (ADR-0011). Not run here on purpose: the drivers' own tests, fuzzing, mutation, coverage and MISRA
# scans. Each pinned driver passed them in its own CI at the pinned tag; ci-pins.yml proves that.
name: CI

on:
  # Pushes run only on main and tags. A branch with a pull request is covered by the pull_request event, so one push
  # starts one run, not two. merge_group is for a merge queue: it runs the full set on the queued merge.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main, 'release/*']
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # MISRA and mutation are the long, billed jobs (mutation shards 48-86 minutes, the MISRA scan about 30). A pull
  # request runs them only when it changes something they read (heavy, below) or carries the label `full-ci`; pushes
  # to main, tags and the merge queue always run everything. The configurator exports run only when the configurator,
  # the kb tool, the libraries or the build files change. The gate below counts a job skipped by these filters as
  # passed (allow_skipped), and fails on a failed or cancelled filter job, because the gate also needs `changes`.
  # docs/testing.md ("Which change runs which jobs") has the table of which path starts which job.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
      exports: ${{ steps.diff.outputs.exports }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          heavy=true
          exports=true
          if [ "$EVENT" = "pull_request" ]; then
            heavy=false
            exports=false
            if printf '%s' "$LABELS" | grep -q '"full-ci"'; then
              heavy=true
              exports=true
            fi
            # A failed diff must not hide a needed job: fail this job (the gate then fails).
            files="$(git diff --name-only "$BASE...$HEAD")"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              # Mutation and MISRA read the libraries (headers, sources, their tests and CMake files), the test
              # support code, the build files, the mutant catalogue, the equivalent-mutant and deviation records,
              # and their own workflows. Anything else (docs, configurator, catalogue data, kb tool and release
              # scripts, drivers, the ESP32 port, Markdown) cannot change their result.
              case "$f" in
                components/lib/*|components/ports/host/*|cmake/*|CMakeLists.txt|CMakePresets.json|kb.yml|\
                third_party/*|deviations/*|tools/mutants/*|tools/layout/paths.yml|tools/lint/*|\
                docs/assurance/equivalent-mutants.yml|\
                tests/fakes/*|tests/harness/*|tests/integration/*|tests/poison/*|tests/layering/*|tests/standalone/*|\
                .github/workflows/ci.yml|.github/workflows/ci-mutation.yml|.github/workflows/ci-misra.yml) heavy=true ;;
              esac
              # The configurator exports build what the generator writes against these libraries and build files.
              case "$f" in
                configurator/*|tools/kb/*|components/*|cmake/*|CMakeLists.txt|kb.yml|catalog/schemas/*|\
                .github/workflows/ci-exports.yml) exports=true ;;
              esac
            done <<< "$files"
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "exports=$exports" >> "$GITHUB_OUTPUT"

  host:
    name: Host build and tests
    uses: ./.github/workflows/ci-host.yml

  quality:
    name: Host quality
    uses: ./.github/workflows/ci-quality.yml

  misra:
    name: MISRA
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    uses: ./.github/workflows/ci-misra.yml

  cross:
    name: Cross-compile
    uses: ./.github/workflows/ci-cross-build.yml

  esp32:
    name: ESP32 port
    uses: ./.github/workflows/ci-esp32.yml
    permissions:
      contents: read
      pull-requests: write

  docs:
    name: Docs
    uses: ./.github/workflows/ci-docs.yml
    permissions:
      contents: write  # the publish job pushes gh-pages on main and tags; pull requests never publish

  configurator:
    name: Configurator
    uses: ./.github/workflows/ci-configurator.yml
    permissions:
      contents: read

  exports:
    name: Configurator exports
    needs: changes
    if: needs.changes.outputs.exports == 'true'
    uses: ./.github/workflows/ci-exports.yml
    permissions:
      contents: read

  checks:
    name: Repository checks
    uses: ./.github/workflows/ci-repo-checks.yml
    permissions:
      contents: read
      pull-requests: read

  # Callers of the ci-tools v1.19 workflows ru-cmake-matrix, ru-mutation, ru-pin-hygiene, ru-layering, ru-catalog.
  standalone:
    name: Standalone parts
    uses: ./.github/workflows/ci-standalone.yml

  integration:
    name: Integration
    uses: ./.github/workflows/ci-integration.yml

  mutation:
    name: Mutation
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    uses: ./.github/workflows/ci-mutation.yml

  pins:
    name: Pin hygiene
    uses: ./.github/workflows/ci-pins.yml

  layering:
    name: Layering
    uses: ./.github/workflows/ci-layering.yml

  catalog:
    name: Catalogue
    uses: ./.github/workflows/ci-catalog.yml

  layout:
    name: Layout and examples
    uses: ./.github/workflows/ci-layout.yml

  vulnerabilities:
    name: Vulnerability data
    uses: ./.github/workflows/ci-vulnerabilities-check.yml

  port-sdk:
    name: Port SDK
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci-port-sdk.yml
    permissions:
      contents: read

  ci-gate:
    name: CI gate
    needs:
      [changes, host, quality, misra, cross, esp32, docs, configurator, exports, checks, standalone, integration,
       mutation, pins, layering, catalog, layout, vulnerabilities, port-sdk]
    if: always()
    uses: kokeb-labs/ci-tools/.github/workflows/ru-ci-gate.yml@v1
    permissions:
      contents: read
    with:
      needs_json: ${{ toJSON(needs) }}
      allow_skipped: misra, mutation, exports, port-sdk
