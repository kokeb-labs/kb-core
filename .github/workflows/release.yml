---
# Release of a pushed v* tag after its CI passed: the source archive, the port SDK (kb-port-sdk-<version>.tar.gz and
# its manifest, docs/port-sdk.md), the SPDX SBOM and SHA256SUMS, then signed build provenance for every file in
# SHA256SUMS (kokeb-labs/ci-tools ru-attest-release). The release job is this file's own, not ru-release, only because
# ru-release cannot attach extra files yet.
# The per-part package artifacts come from a packaging job that arrives with the first part's source.
# PENDING (ADR-0012, ADR-0013; needs ci-tools ru-release-evidence): a job before `release` that writes
# kb-core-<version>.lock.yml (this tag's own commit SHA, every pin with tag and commit, toolchain and SOUP versions),
# the SBOM (SPDX 2.3 and CycloneDX 1.6), the known-CVE scan and the licence report, and adds them to SHA256SUMS and
# the attestation. A scheduled caller re-scans published releases for new CVEs.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  release:
    name: Create release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag points to the released commit
        run: |
          set -euo pipefail
          tagged="$(git rev-parse "refs/tags/${TAG}^{commit}" 2>/dev/null || true)"
          if [ "$tagged" != "$COMMIT" ]; then
            echo "::error::tag ${TAG} points to ${tagged:-nothing}, not to the released commit ${COMMIT}"
            exit 1
          fi

      # The port SDK (docs/port-sdk.md): built from the tagged commit, checked, then handed to the asset script as an
      # extra release file, so it is in SHA256SUMS and in the SPDX SBOM like the source archive.
      - name: Build the port SDK
        run: |
          set -euo pipefail
          python3 -I tools/release/port_sdk.py build --tag "$TAG" --out "$RUNNER_TEMP/sdk"
          python3 -I tools/release/port_sdk.py verify "$RUNNER_TEMP/sdk/kb-port-sdk-${TAG#v}.tar.gz" \
            --manifest "$RUNNER_TEMP/sdk/kb-port-sdk-${TAG#v}.manifest.json"

      # The same asset script ru-release runs, pinned to a ci-tools commit (commit 2643196, 2026-11-07) because
      # ru-release has no input for extra files. Move back to ru-release@v1 when it gains one.
      - name: Checkout the release asset script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: kokeb-labs/ci-tools
          ref: 264319677ca5431e1650c47234a16b0b6938489d
          path: .release-assets
          sparse-checkout: tools/release_assets
          persist-credentials: false

      - name: Build source archive, SBOM and checksums
        run: |
          set -euo pipefail
          python3 -I .release-assets/tools/release_assets/release_assets.py --tag "$TAG" --out "$RUNNER_TEMP/dist" \
            --files "$RUNNER_TEMP/sdk/*"
          {
            echo '### Release files'
            echo '```text'
            cat "$RUNNER_TEMP/dist/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          prerelease: ${{ contains(github.event.workflow_run.head_branch, '-') }}
          files: ${{ runner.temp }}/dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  attest:
    name: Attest release files
    needs: release
    if: github.event.repository.visibility == 'public'
    uses: kokeb-labs/ci-tools/.github/workflows/ru-attest-release.yml@v1
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      tag_name: ${{ github.event.workflow_run.head_branch }}
