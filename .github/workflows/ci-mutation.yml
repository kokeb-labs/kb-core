---
# Calls ci-tools ru-mutation (v1.19).
# Mutation testing of kb-core's own parts with a kill-rate gate; every surviving mutant is either killed by a new
# test or recorded as equivalent with a reason. Drivers are not mutated here (their pipeline did it).
name: Mutation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing
    uses: kokeb-labs/ci-tools/.github/workflows/ru-mutation.yml@v1
    permissions:
      contents: read
    with:
      level: high
      # The leading space keeps the value from being read as an option by the mutation tool's argument parser.
      cmake_args: " -DKB_BUILD_TESTS=ON"
      mutate_paths: "components/lib/utils/inc components/lib/rtos/inc components/lib/rtos/backends/none
        components/lib/rtos/backends/freertos components/lib/rtos/backends/threadx components/lib/interfaces/inc components/lib/dma/inc"
      # The handler core is mutated from its catalogue (one mutant per rule of ADR-0009 and ADR-0010), on top of
      # the generated mutants of the other parts.
      catalogue: "tools/mutants/*.txt"
      mode: both
      # Level high: 100 % of the scored mutants killed; equivalent mutants are listed with their reasons in
      # docs/assurance/equivalent-mutants.yml.
      enforce: true
      equivalents_file: docs/assurance/equivalent-mutants.yml
      # About 1,100 mutants: one shard overran the 120-minute job limit once the dma part joined, so they are split in four.
      shards: "4"
