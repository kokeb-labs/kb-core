---
# Layer dependency rules: which layer may depend on which, and the check that catches each forbidden edge.
kind: matrix
id: dependency-rules
title: Which layer may depend on which
kicker: Layering
subtitle: Every forbidden edge is caught by a named check before it can merge.
alt: >-
  Table of nineteen dependency rules between layers, twelve allowed from the application down to kb::utils and seven
  forbidden, each forbidden one with the check that catches it.
reads: >-
  The twelve allowed dependencies come first: the application uses the board HAL, kb::rtos and kb::utils; the board
  HAL uses kb::handlers, kb::interfaces and one MCU port; the MCU port uses the installed kb::interfaces headers only
  and the vendor SDK headers in boundary files only; kb::handlers uses the drivers and kb::interfaces;
  kb::interfaces uses kb::rtos; kb::rtos uses kb::utils. The seven forbidden dependencies follow, each with the
  check that catches it: the application using kb::interfaces or the SDK directly (the include checker and the
  symbol lint), kb::handlers using the SDK (the poison build and the include checker) or an MCU port (the CMake DAG
  check), kb::interfaces using an MCU port (the include checker, LAY-010), a driver using kb::utils (the driver CI
  and the include checker), and kb::utils using kb::rtos (the CMake target graph). Each cell carries a word and a
  mark, so the meaning does not rest on colour alone.
print: portrait
width: 640
cell_width: 300
