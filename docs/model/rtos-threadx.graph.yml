# The ThreadX backend.
kind: graph
id: rtos-threadx
title: The ThreadX backend
kicker: RTOS
subtitle: One boundary file between the kb::rtos seam and the kernel, two ways to get the kernel.
alt: >-
  The kb::rtos API and seam lead to two ThreadX backend files, and the boundary file reaches the ThreadX kernel,
  from a product's copy or the pinned submodule, which tests run on a fake kernel and on the Linux port.
reads: >-
  The kb::rtos API (Mutex, RecursiveMutex, Semaphore, Queue, EventFlags, Timer, Thread, CriticalSection) reaches the
  seam, kb::rtos::backend in backend.hpp. The ThreadX backend is two files: threadx_isr.cpp, where every FromIsr call
  is the same call with TX_NO_WAIT, and threadx_boundary.cpp, the only boundary file, which creates ThreadX objects
  (tx_*_create) on kb-owned control blocks and stacks. The kernel is SOUP and never edited; it comes from a product's
  copy (KB_THREADX_INCLUDE_DIRS, for STM32Cube or a vendor SDK) or from the pinned submodule third_party/threadx at a
  release tag, with KB_THREADX_PORT choosing cortex_m0, cortex_m4, cortex_m7 or linux. Tests run the boundary on a
  fake kernel in tests/fakes/threadx (contract and seam, exact ticks, kb_rtos_tests_threadx) and, on the pinned
  kernel's Linux port, as a threaded suite with priority inheritance (kb_rtos_tests_threadx_linux).
direction: TB
