<text x="122" y="186.3" font-size="15" font-weight="700" class="fk-f-brown-text">Task X</text>
<text x="122" y="203.5" font-size="12" class="fk-f-brown-text">guarded bus</text>
<text x="122" y="227.4" font-size="13" class="fk-f-ink2">Guarded::Hold(timeout)</text>
<text x="122" y="334.3" font-size="15" font-weight="700" class="fk-f-violet-text">1: handler mutex</text>
<text x="122" y="359.1" font-size="13" class="fk-f-ink2">bounded wait</text>
<text x="122" y="463.3" font-size="15" font-weight="700" class="fk-f-teal-text">2: BusDomain::Hold</text>
<text x="122" y="488.2" font-size="13" class="fk-f-ink2">bus mutex</text>
<text x="122" y="507" font-size="13" class="fk-f-ink2">bounded</text>
<text x="122" y="602.3" font-size="15" font-weight="700" class="fk-f-violet-text">GuardedHeld</text>
<text x="122" y="627.2" font-size="13" class="fk-f-ink2">many calls</text>
<text x="122" y="646" font-size="13" class="fk-f-ink2">nothing between</text>
<text x="122" y="741.3" font-size="15" font-weight="700" class="fk-f-rose-text">Task Y: Request</text>
<text x="122" y="766.2" font-size="13" class="fk-f-ink2">waits or Timeout</text>
<text x="368" y="186.3" font-size="15" font-weight="700" class="fk-f-brown-text">Owner task</text>
<text x="368" y="203.5" font-size="12" class="fk-f-brown-text">owner bus</text>
<text x="368" y="227.4" font-size="13" class="fk-f-ink2">Hold() between passes</text>
<text x="368" y="324.3" font-size="15" font-weight="700" class="fk-f-teal-text">Pass flag</text>
<text x="368" y="349.1" font-size="13" class="fk-f-ink2">set while held</text>
<text x="368" y="368" font-size="13" class="fk-f-ink2">never waits</text>
<text x="368" y="463.3" font-size="15" font-weight="700" class="fk-f-violet-text">OwnerAccess::Held</text>
<text x="368" y="488.2" font-size="13" class="fk-f-ink2">inline calls</text>
<text x="368" y="507" font-size="13" class="fk-f-ink2">several handlers</text>
<text x="368" y="602.3" font-size="15" font-weight="700" class="fk-f-rose-text">Service(now, ...)</text>
<text x="368" y="627.2" font-size="13" class="fk-f-ink2">Busy</text>
<text x="368" y="646" font-size="13" class="fk-f-ink2">violation counted</text>
