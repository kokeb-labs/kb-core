<rect x="0.5" y="0.5" width="639" height="844" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">HANDLERS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" class="fk-f-ink">Held transactions</text>
<text x="32" y="103.8" font-size="15" class="fk-f-muted">The order of the locks, and what each hold excludes. Left, a guarded bus;</text>
<text x="32" y="125.5" font-size="15" class="fk-f-muted">right, an owner bus.</text>
