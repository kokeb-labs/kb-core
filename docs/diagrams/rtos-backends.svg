<rect x="899" y="375.8" width="269" height="107" rx="10" fill="#F8F1EA" stroke="#7C4A1E" stroke-width="1.4"/>
<rect x="899" y="383.8" width="4" height="91" rx="2" fill="#7C4A1E"/>
<rect x="321" y="542.8" width="269" height="107" rx="10" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="610" y="542.8" width="269" height="107" rx="10" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="32" y="548.8" width="265" height="98.2" rx="10" fill="#F8F1EA" stroke="#DCC3A8" stroke-width="1"/>
<text x="52" y="164.6" font-size="15" font-weight="700" fill="#8A3C0B">kb::rtos API</text>
<text x="52" y="189.4" font-size="13" fill="#2B3442">Mutex, RecursiveMutex, Semaphore, Queue, EventFlags, Timer, Thread, CriticalSection (components/lib/rtos/inc)</text>
<text x="52" y="273.6" font-size="15" font-weight="700" fill="#8A3C0B">kb::rtos::backend</text>
<text x="52" y="298.4" font-size="13" fill="#2B3442">backend.hpp: the seam. Each native object lives in opaque storage sized there; every backend static_asserts it fits.</text>
<text x="52" y="402.6" font-size="15" font-weight="700" fill="#8A3C0B">none</text>
<text x="52" y="427.4" font-size="13" fill="#2B3442">Host tests, bare-metal bring-up.</text>
<text x="52" y="446.3" font-size="13" fill="#2B3442">One context, a deterministic fake</text>
<text x="52" y="465.1" font-size="13" fill="#2B3442">clock.</text>
<text x="341" y="402.6" font-size="15" font-weight="700" fill="#8A3C0B">freertos</text>
<text x="341" y="427.4" font-size="13" fill="#2B3442">ESP32 default, any FreeRTOS</text>
<text x="341" y="446.3" font-size="13" fill="#2B3442">target. Boundary files, static API</text>
<text x="341" y="465.1" font-size="13" fill="#2B3442">only.</text>
<text x="630" y="402.6" font-size="15" font-weight="700" fill="#8A3C0B">threadx</text>
<text x="630" y="427.4" font-size="13" fill="#2B3442">Eclipse ThreadX targets. One</text>
<text x="630" y="446.3" font-size="13" fill="#2B3442">boundary file.</text>
<text x="919" y="402.6" font-size="15" font-weight="700" fill="#6B3F17">host</text>
<text x="919" y="427.4" font-size="13" fill="#2B3442">PC tests with real threads</text>
<text x="919" y="446.3" font-size="13" fill="#2B3442">(std::thread), never built for a</text>
<text x="919" y="465.1" font-size="13" fill="#2B3442">target.</text>
<text x="341" y="569.5" font-size="15" font-weight="700" fill="#0E1726">FreeRTOS kernel</text>
<text x="341" y="594.4" font-size="13" fill="#2B3442">SOUP: ESP-IDF, or</text>
<text x="341" y="613.2" font-size="13" fill="#2B3442">KB_FREERTOS_INCLUDE_DIRS</text>
<text x="630" y="569.5" font-size="15" font-weight="700" fill="#0E1726">ThreadX kernel</text>
<text x="630" y="594.4" font-size="13" fill="#2B3442">SOUP:</text>
<text x="630" y="613.2" font-size="13" fill="#2B3442">KB_THREADX_INCLUDE_DIRS, or</text>
<text x="630" y="632.1" font-size="13" fill="#2B3442">third_party/threadx</text>
<rect x="405.9" y="502.8" width="99.1" height="20" rx="10" fill="#FFFFFF"/>
<text x="455.5" y="517.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">boundary files</text>
<rect x="698.4" y="502.8" width="92.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="744.5" y="517.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">boundary file</text>
<text x="46" y="575.5" font-size="15" font-weight="700" fill="#6B3F17">Tests</text>
<text x="46" y="593.4" font-size="13" fill="#6B3F17">FreeRTOS and ThreadX also run</text>
<text x="46" y="612.2" font-size="13" fill="#6B3F17">their tests on fake kernels</text>
<text x="46" y="631.1" font-size="13" fill="#6B3F17">(tests/fakes) with exact ticks.</text>
<rect x="32" y="665.2" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="54" y="676.8" font-size="12.5" fill="#566070">kb::rtos</text>
<rect x="125.3" y="665.2" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="147.3" y="676.8" font-size="12.5" fill="#566070">SOUP and planned</text>
<rect x="289.3" y="665.2" width="14" height="14" rx="4" fill="#F8F1EA" stroke="#7C4A1E" stroke-width="1.4"/>
<text x="311.3" y="676.8" font-size="12.5" fill="#566070">tests only</text>
</svg>
