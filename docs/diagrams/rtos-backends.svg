<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="711" viewBox="0 0 1200 711" role="img" aria-labelledby="rtos-backends-title rtos-backends-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="rtos-backends-title">kb::rtos backends</title>
<desc id="rtos-backends-desc">The kb::rtos API reaches one backend through a single seam: none, FreeRTOS, host (tests only) or ThreadX; FreeRTOS and ThreadX reach their kernel, which is SOUP, through boundary files and are tested on fake kernels.</desc>
<defs><marker id="fk-arrow-amber-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C26A05"/></marker><marker id="fk-arrow-slate-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="710" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">RTOS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">kb::rtos backends</text>
<text x="32" y="103.8" font-size="15" fill="#566070">One API and one seam. Each backend owns its objects in opaque storage.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#E2E7EE"/>
<path d="M600 209.8 L600 243.8" fill="none" stroke="#C26A05" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-amber-strong)"/>
