<path d="M197 883.5 L197 945.5" fill="none" stroke="#15803D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dma-stream-arrow-green-strong)"/>
<rect x="225" y="159.6" width="190" height="69" rx="10" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="225" y="167.6" width="4" height="53" rx="2" fill="#0B7A72"/>
