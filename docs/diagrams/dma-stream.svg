<text x="245" y="186.3" font-size="15" font-weight="700" fill="#0B5F59">DMA ring</text>
<text x="245" y="211.2" font-size="13" fill="#2B3442">2 halves or N frames</text>
<text x="245" y="325.3" font-size="15" font-weight="700" fill="#5B21B6">Interrupt</text>
<text x="245" y="350.1" font-size="13" fill="#2B3442">PublishFromDevice</text>
<text x="245" y="369" font-size="13" fill="#2B3442">copy out, seq, time,</text>
<text x="245" y="387.9" font-size="13" fill="#2B3442">torn</text>
<text x="122" y="512.3" font-size="15" font-weight="700" fill="#1E429F">Ring of slots</text>
<text x="122" y="537.2" font-size="13" fill="#2B3442">at least 2 slots</text>
<text x="368" y="502.3" font-size="15" font-weight="700" fill="#9F1239">Next frame: Gap()</text>
<text x="368" y="527.2" font-size="13" fill="#2B3442">all slots held</text>
<text x="368" y="546" font-size="13" fill="#2B3442">frame dropped as Full</text>
<text x="122" y="660.3" font-size="15" font-weight="700" fill="#1E429F">FrameView</text>
<text x="122" y="685.2" font-size="13" fill="#2B3442">move-only</text>
<text x="122" y="704" font-size="13" fill="#2B3442">releases on end</text>
<text x="122" y="818.3" font-size="15" font-weight="700" fill="#5B21B6">Supervise</text>
<text x="122" y="843.2" font-size="13" fill="#2B3442">None, Restart, BackOff,</text>
<text x="122" y="862" font-size="13" fill="#2B3442">UseFallback</text>
<text x="122" y="976.3" font-size="15" font-weight="700" fill="#14532D">Fallback producer</text>
<text x="122" y="1001.2" font-size="13" fill="#2B3442">frames carry Fallback()</text>
<rect x="328" y="253.6" width="111" height="20" rx="10" fill="#FFFFFF"/>
<text x="383.5" y="267.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">half or complete</text>
<rect x="246.9" y="415.7" width="62.1" height="20" rx="10" fill="#FFFFFF"/>
<text x="278" y="430" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">slot free</text>
<rect x="394.4" y="445.4" width="55.2" height="20" rx="10" fill="#FFFFFF"/>
<text x="422" y="459.7" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">all held</text>
<rect x="205.2" y="588.5" width="62.6" height="20" rx="10" fill="#FFFFFF"/>
<text x="236.5" y="602.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">TryTake</text>
<rect x="204.9" y="746.5" width="50.2" height="20" rx="10" fill="#FFFFFF"/>
<text x="230" y="760.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Judge</text>
<rect x="205.1" y="904.5" width="94.7" height="20" rx="10" fill="#FFFFFF"/>
<text x="252.5" y="918.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">EnterFallback</text>
<rect x="32" y="1033.9" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="54" y="1045.5" font-size="12.5" fill="#566070">hardware</text>
<rect x="137.4" y="1033.9" width="14" height="14" rx="4" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="159.4" y="1045.5" font-size="12.5" fill="#566070">interrupt</text>
<rect x="236.7" y="1033.9" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="258.7" y="1045.5" font-size="12.5" fill="#566070">task</text>
<rect x="308.8" y="1033.9" width="14" height="14" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="330.8" y="1045.5" font-size="12.5" fill="#566070">gap</text>
<rect x="378.4" y="1033.9" width="14" height="14" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<text x="400.4" y="1045.5" font-size="12.5" fill="#566070">fallback</text>
</svg>
