<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080" role="img" aria-labelledby="dma-stream-title dma-stream-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="dma-stream-title">The DMA copy-out stream</title>
<desc id="dma-stream-desc">Flow in which the DMA ring raises an interrupt that copies each finished frame into a slot, the task takes a slot as a FrameView, a content check feeds the supervisor, and a full ring drops the frame and flags the next with Gap.</desc>
<defs><marker id="dma-stream-arrow-green-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="dma-stream-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8798"/></marker><marker id="dma-stream-arrow-rose-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DB2752"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="1079" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">DMA</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">The DMA copy-out stream</text>
<text x="32" y="103.8" font-size="15" fill="#566070">The interrupt copies each finished frame into a slot. The task never holds</text>
<text x="32" y="125.5" font-size="15" fill="#566070">the ring itself.</text>
<rect x="32" y="141.6" width="576" height="1" fill="#E2E7EE"/>
<path d="M320 232.6 L320 294.6" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dma-stream-arrow-rail)"/>
