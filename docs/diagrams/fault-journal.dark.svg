<rect x="711.3" y="524.8" width="456.7" height="69" rx="10" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<rect x="711.3" y="532.8" width="4" height="53" rx="2" fill="#2BB3A3"/>
<rect x="32" y="641.8" width="1136" height="60.5" rx="10" fill="#1B232E" stroke="#3A4656" stroke-width="1"/>
<text x="52" y="164.6" font-size="15" font-weight="700" fill="#DDD6FE">Handlers</text>
<text x="52" y="189.4" font-size="13" fill="#D2DAE4">Health(): lock-free</text>
<text x="640" y="164.6" font-size="15" font-weight="700" fill="#FDE68A">LivenessMonitor</text>
<text x="640" y="189.4" font-size="13" fill="#D2DAE4">Verdict(now)</text>
<text x="336" y="293.6" font-size="15" font-weight="700" fill="#DDD6FE">HealthJournal</text>
<text x="336" y="318.4" font-size="13" fill="#D2DAE4">edges only</text>
<text x="279.2" y="422.6" font-size="15" font-weight="700" fill="#F8D27A">FaultJournal ring</text>
<text x="279.2" y="447.4" font-size="13" fill="#D2DAE4">32-byte records, CRC-32, sequence</text>
<rect x="492.1" y="355.8" width="215.7" height="20" rx="10" fill="#0E131A"/>
<text x="600" y="370.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Append: one bounded store write</text>
<text x="52" y="551.5" font-size="15" font-weight="700" fill="#A7F3E6">Store</text>
<text x="52" y="576.4" font-size="13" fill="#D2DAE4">RTC / no-init RAM, NVS, FRAM, flash</text>
<text x="731.3" y="551.5" font-size="15" font-weight="700" fill="#A7F3E6">Boot</text>
<text x="731.3" y="576.4" font-size="13" fill="#D2DAE4">port reset reason</text>
<rect x="426.3" y="484.8" width="59" height="20" rx="10" fill="#0E131A"/>
<text x="455.8" y="499.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">records</text>
<rect x="744.9" y="484.8" width="89.9" height="20" rx="10" fill="#0E131A"/>
<text x="789.8" y="499.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">RecordReset</text>
<text x="46" y="668.5" font-size="15" font-weight="700" fill="#E2E8F0">Reading it back</text>
<text x="46" y="686.3" font-size="13" fill="#E2E8F0">After a reset Open() finds the newest record and skips a torn slot. The watchdog owner is kicked only when nothing is stale.</text>
<rect x="32" y="717.7" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="54" y="729.3" font-size="12.5" fill="#9AA6B5">handler and journal</text>
<rect x="198.4" y="717.7" width="14" height="14" rx="4" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="220.4" y="729.3" font-size="12.5" fill="#9AA6B5">liveness</text>
<rect x="295.6" y="717.7" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="317.6" y="729.3" font-size="12.5" fill="#9AA6B5">port</text>
<rect x="366.9" y="717.7" width="14" height="14" rx="4" fill="#2A2113" stroke="#F4B942" stroke-width="1.4"/>
<text x="388.9" y="729.3" font-size="12.5" fill="#9AA6B5">stored record</text>
