<text x="52" y="234.6" font-size="15" font-weight="700" fill="#E2E8F0">Unknown</text>
<text x="52" y="259.4" font-size="13" fill="#D2DAE4">constructed, no I/O</text>
<text x="368" y="234.6" font-size="15" font-weight="700" fill="#FDE68A">Starting</text>
<text x="368" y="259.4" font-size="13" fill="#D2DAE4">walks the declared</text>
<text x="368" y="278.2" font-size="13" fill="#D2DAE4">stages</text>
<text x="684" y="234.6" font-size="15" font-weight="700" fill="#BBF7D0">Ready</text>
<text x="684" y="259.4" font-size="13" fill="#D2DAE4">all calls allowed</text>
<text x="998" y="234.6" font-size="15" font-weight="700" fill="#FDE68A">Degraded</text>
<text x="998" y="259.4" font-size="13" fill="#D2DAE4">a call failed, below</text>
<text x="998" y="278.2" font-size="13" fill="#D2DAE4">fault_after</text>
<text x="368" y="494.6" font-size="15" font-weight="700" fill="#FECDD3">Faulted</text>
<text x="368" y="519.4" font-size="13" fill="#D2DAE4">chip lost or fault_after</text>
<text x="368" y="538.2" font-size="13" fill="#D2DAE4">reached</text>
<text x="684" y="494.6" font-size="15" font-weight="700" fill="#DDD6FE">Recovering</text>
<text x="684" y="519.4" font-size="13" fill="#D2DAE4">Recover() running, with</text>
<text x="684" y="538.2" font-size="13" fill="#D2DAE4">backoff</text>
<rect x="265.2" y="249.8" width="39.7" height="20" rx="10" fill="#0E131A"/>
<text x="285" y="264.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">start</text>
<rect x="405.2" y="161.8" width="75.7" height="20" rx="10" fill="#0E131A"/>
<text x="443" y="176.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">next stage</text>
<rect x="556.5" y="249.8" width="88.9" height="20" rx="10" fill="#0E131A"/>
<text x="601" y="264.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">last stage ok</text>
<rect x="885.2" y="227.8" width="61.7" height="20" rx="10" fill="#0E131A"/>
<text x="916" y="242.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">call fails</text>
<rect x="890.4" y="271.8" width="51.2" height="20" rx="10" fill="#0E131A"/>
<text x="916" y="286.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">call ok</text>
<rect x="303.8" y="379.8" width="74.5" height="20" rx="10" fill="#0E131A"/>
<text x="341" y="394.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">stage fails</text>
<rect x="637.8" y="417.8" width="72.1" height="20" rx="10" fill="#0E131A"/>
<text x="673.9" y="432.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">fatal error</text>
<rect x="776.8" y="605.8" width="125.3" height="20" rx="10" fill="#0E131A"/>
<text x="839.4" y="620.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">fault_after in a row</text>
<rect x="565.1" y="489.8" width="71.8" height="20" rx="10" fill="#0E131A"/>
<text x="601" y="504.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Recover()</text>
<rect x="582.3" y="529.8" width="37.3" height="20" rx="10" fill="#0E131A"/>
<text x="601" y="544.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">fails</text>
<rect x="787.6" y="379.8" width="26.8" height="20" rx="10" fill="#0E131A"/>
<text x="801" y="394.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">ok</text>
<rect x="399.1" y="163.8" width="87.8" height="20" rx="10" fill="#0E131A"/>
<text x="443" y="178.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Deinitialize()</text>
<rect x="110.7" y="509.8" width="87.8" height="20" rx="10" fill="#0E131A"/>
<text x="154.7" y="524.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Deinitialize()</text>
<text x="46" y="668.5" font-size="15" font-weight="700" fill="#E2E8F0">Details</text>
<text x="46" y="686.3" font-size="13" fill="#E2E8F0">Recovery backoff doubles on each failure and the handler refuses Recover() after max_attempts. A failed start leaves the driver destroyed and the next start begins again</text>
<text x="46" y="705.2" font-size="13" fill="#E2E8F0">from the first stage.</text>
<rect x="32" y="736.5" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="54" y="748.2" font-size="12.5" fill="#9AA6B5">not started</text>
<rect x="145.8" y="736.5" width="14" height="14" rx="4" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="167.8" y="748.2" font-size="12.5" fill="#9AA6B5">in progress or degraded</text>
<rect x="343.1" y="736.5" width="14" height="14" rx="4" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<text x="365.1" y="748.2" font-size="12.5" fill="#9AA6B5">healthy</text>
<rect x="434.9" y="736.5" width="14" height="14" rx="4" fill="#321820" stroke="#FB7185" stroke-width="1.4"/>
<text x="456.9" y="748.2" font-size="12.5" fill="#9AA6B5">failed</text>
<rect x="515.5" y="736.5" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="537.5" y="748.2" font-size="12.5" fill="#9AA6B5">recovering</text>
</svg>
