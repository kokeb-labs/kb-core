<title id="components-map-title">Parts, ports and drivers</title>
<desc id="components-map-desc">Map of the repository in which the lib parts handlers, interfaces, rtos and utils each rest on the next one down, the MCU ports satisfy the interface contracts, and handlers bind the pinned drivers.</desc>
