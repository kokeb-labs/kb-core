<svg xmlns="http://www.w3.org/2000/svg" width="640" height="728" viewBox="0 0 640 728" role="img" aria-labelledby="dma-lease-title dma-lease-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="dma-lease-title">Ownership of a DMA buffer</title>
<desc id="dma-lease-desc">State machine with the states Cpu, Device and Quarantined: Lend moves a buffer to Device, Complete or a proven Abort returns it to Cpu, an unproven Abort quarantines it, and Recover with proof returns it to Cpu.</desc>
<defs><marker id="dma-lease-arrow-amber-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C26A05"/></marker><marker id="dma-lease-arrow-green-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="dma-lease-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8798"/></marker><marker id="dma-lease-arrow-rose-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DB2752"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="727" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">DMA</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">Ownership of a DMA buffer</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Only the port holds the key that moves a buffer between states. The CPU's</text>
<text x="32" y="125.5" font-size="15" fill="#566070">view exists in Cpu only.</text>
<rect x="32" y="141.6" width="576" height="1" fill="#E2E7EE"/>
<path d="M280 185.6 L280 257.6" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dma-lease-arrow-rail)"/>
<path d="M219 353.6 L219 425.6" fill="none" stroke="#C26A05" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dma-lease-arrow-amber-strong)"/>
<path d="M341 425.6 L341 407 Q341 399 333 399 L288 399 Q280 399 280 391 L280 353.6" fill="none" stroke="#15803D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dma-lease-arrow-green-strong)"/>
<path d="M280 521.5 L280 532.6 Q280 540.6 288 540.6 L291 540.6 Q299 540.6 299 548.6 L299 593.5" fill="none" stroke="#DB2752" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#dma-lease-arrow-rose-strong)"/>
<path d="M421 593.5 L421 582.5 Q421 574.5 413 574.5 L391 574.5 Q383 574.5 383 566.5 L383 427 Q383 419 375 419 L349 419 Q341 419 341 411 L341 353.6" fill="none" stroke="#15803D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dma-lease-arrow-green-strong)"/>
<rect x="205" y="261.6" width="150" height="88" rx="10" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<rect x="205" y="269.6" width="4" height="72" rx="2" fill="#15803D"/>
<rect x="205" y="429.6" width="150" height="88" rx="10" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<rect x="205" y="437.6" width="4" height="72" rx="2" fill="#C26A05"/>
<rect x="285" y="597.5" width="150" height="69" rx="10" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<rect x="285" y="605.5" width="4" height="53" rx="2" fill="#DB2752"/>
<circle cx="280" cy="170.6" r="11" fill="#2B3442"/>
<text x="283" y="288.3" font-size="15" font-weight="700" text-anchor="middle" fill="#14532D">Cpu</text>
<text x="283" y="313.1" font-size="13" text-anchor="middle" fill="#2B3442">static, aligned,</text>
<text x="283" y="332" font-size="13" text-anchor="middle" fill="#2B3442">padded</text>
<text x="283" y="456.3" font-size="15" font-weight="700" text-anchor="middle" fill="#8A3C0B">Device</text>
<text x="283" y="481.2" font-size="13" text-anchor="middle" fill="#2B3442">the peripheral</text>
<text x="283" y="500" font-size="13" text-anchor="middle" fill="#2B3442">owns it</text>
<text x="363" y="624.3" font-size="15" font-weight="700" text-anchor="middle" fill="#9F1239">Quarantined</text>
<text x="363" y="649.2" font-size="13" text-anchor="middle" fill="#2B3442">Lend refused</text>
<rect x="288" y="211.6" width="70.1" height="20" rx="10" fill="#FFFFFF"/>
<text x="323" y="225.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">construct</text>
<rect x="226.9" y="359.6" width="42.2" height="20" rx="10" fill="#FFFFFF"/>
<text x="248" y="373.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Lend</text>
<rect x="348.9" y="389" width="170.1" height="20" rx="10" fill="#FFFFFF"/>
<text x="434" y="403.3" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Complete or proven Abort</text>
<rect x="306.8" y="530.6" width="107.4" height="20" rx="10" fill="#FFFFFF"/>
<text x="360.5" y="544.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">unproven Abort</text>
<rect x="429" y="564.5" width="127.9" height="20" rx="10" fill="#FFFFFF"/>
<text x="493" y="578.8" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Recover with proof</text>
<rect x="32" y="681.9" width="14" height="14" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<text x="54" y="693.5" font-size="12.5" fill="#566070">the CPU owns it</text>
<rect x="178.2" y="681.9" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="200.2" y="693.5" font-size="12.5" fill="#566070">the device owns it</text>
<rect x="338.2" y="681.9" width="14" height="14" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="360.2" y="693.5" font-size="12.5" fill="#566070">quarantined</text>
</svg>
