<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="552" viewBox="0 0 1200 552" role="img" aria-labelledby="dma-lease-title dma-lease-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="dma-lease-title">Ownership of a DMA buffer</title>
<desc id="dma-lease-desc">State machine with the states Cpu, Device and Quarantined: Lend moves a buffer from Cpu to Device, Complete or a proven Abort returns it to Cpu, an unproven Abort moves it to Quarantined, and Recover with proof returns it to Cpu.</desc>
<defs><marker id="fk-arrow-amber-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C26A05"/></marker><marker id="fk-arrow-green-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="fk-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E1726"/></marker><marker id="fk-arrow-rose-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DB2752"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="551" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">DMA</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">Ownership of a DMA buffer</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Only the port holds the key that moves a buffer between states. The CPU's view exists in Cpu only.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#E2E7EE"/>
<path d="M17 259.8 L29 259.8" fill="none" stroke="#0E1726" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-ink)"/>
<path d="M225 237.8 L502 237.8" fill="none" stroke="#C26A05" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-amber-strong)"/>
<path d="M502 281.8 L225 281.8" fill="none" stroke="#15803D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-green-strong)"/>
<path d="M698 259.8 L975 259.8" fill="none" stroke="#DB2752" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#fk-arrow-rose-strong)"/>
<path d="M1073 314.8 L1073 363.8 Q1073 371.8 1065 371.8 L135 371.8 Q127 371.8 127 363.8 L127 314.8" fill="none" stroke="#15803D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-green-strong)"/>
<path d="M600 314.8 L600 337.8 Q600 345.8 592 345.8 L185 345.8 Q177 345.8 177 337.8 L177 314.8" fill="none" stroke="#15803D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-green-strong)"/>
<rect x="32" y="207.8" width="190" height="104" rx="10" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<rect x="32" y="215.8" width="4" height="88" rx="2" fill="#15803D"/>
<rect x="505" y="207.8" width="190" height="104" rx="10" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<rect x="505" y="215.8" width="4" height="88" rx="2" fill="#C26A05"/>
<rect x="978" y="207.8" width="190" height="104" rx="10" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<rect x="978" y="215.8" width="4" height="88" rx="2" fill="#DB2752"/>
<circle cx="10" cy="259.8" r="7" fill="#0E1726"/>
<rect x="32" y="411.8" width="1136" height="79.3" rx="10" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<text x="52" y="234.6" font-size="15" font-weight="700" fill="#14532D">Cpu</text>
<text x="52" y="259.4" font-size="13" fill="#2B3442">constructed: static,</text>
<text x="52" y="278.2" font-size="13" fill="#2B3442">line-aligned, padded</text>
<text x="525" y="234.6" font-size="15" font-weight="700" fill="#8A3C0B">Device</text>
<text x="525" y="259.4" font-size="13" fill="#2B3442">the peripheral owns the</text>
<text x="525" y="278.2" font-size="13" fill="#2B3442">buffer</text>
<text x="998" y="234.6" font-size="15" font-weight="700" fill="#9F1239">Quarantined</text>
<text x="998" y="259.4" font-size="13" fill="#2B3442">CpuView empty, Lend</text>
<text x="998" y="278.2" font-size="13" fill="#2B3442">refused with a Fault</text>
<rect x="342.4" y="227.8" width="42.2" height="20" rx="10" fill="#FFFFFF"/>
<text x="363.5" y="242.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Lend</text>
<rect x="328.2" y="271.8" width="70.7" height="20" rx="10" fill="#FFFFFF"/>
<text x="363.5" y="286.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Complete</text>
<rect x="771" y="249.8" width="131" height="20" rx="10" fill="#FFFFFF"/>
<text x="836.5" y="264.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Abort without proof</text>
<rect x="536" y="361.8" width="127.9" height="20" rx="10" fill="#FFFFFF"/>
<text x="600" y="376.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Recover with proof</text>
<rect x="362.8" y="335.8" width="111.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="418.5" y="350.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Abort with proof</text>
<text x="46" y="438.6" font-size="15" font-weight="700" fill="#334155">Details</text>
<text x="46" y="456.4" font-size="13" fill="#334155">Lend cleans or invalidates the owned cache lines and runs a barrier. Complete invalidates a receive and runs a barrier. A lease destroyed while the device owns the</text>
<text x="46" y="475.2" font-size="13" fill="#334155">buffer also quarantines it. Recover needs the peripheral to be re-initialised first.</text>
<rect x="32" y="506.5" width="14" height="14" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<text x="54" y="518.2" font-size="12.5" fill="#566070">the CPU owns it</text>
<rect x="178.2" y="506.5" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="200.2" y="518.2" font-size="12.5" fill="#566070">the device owns it</text>
<rect x="338.2" y="506.5" width="14" height="14" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="360.2" y="518.2" font-size="12.5" fill="#566070">quarantined</text>
</svg>
