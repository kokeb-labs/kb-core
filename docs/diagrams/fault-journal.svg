<text x="324" y="480.6" font-size="15" font-weight="700" fill="#7A360E">FaultJournal ring</text>
<text x="324" y="505.4" font-size="13" fill="#2B3442">32-byte records,</text>
<text x="324" y="524.2" font-size="13" fill="#2B3442">CRC-32</text>
<text x="327" y="638.5" font-size="15" font-weight="700" fill="#0B5F59">Store</text>
<text x="327" y="663.4" font-size="13" fill="#2B3442">RTC or no-init</text>
<text x="327" y="682.2" font-size="13" fill="#2B3442">RAM, NVS, FRAM,</text>
