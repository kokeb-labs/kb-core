<text x="48" y="184.6" font-size="13" font-weight="700" fill="#DDD6FE">STAGES, IN ORDER</text>
<text x="358" y="184.6" font-size="13" font-weight="700" fill="#BFDBFE">PLANS OF THREE CHIPS</text>
<text x="64" y="239.3" font-size="15" font-weight="700" fill="#E8EDF3">1 Power</text>
<text x="64" y="264.1" font-size="13" fill="#D2DAE4">rail or enable pin</text>
<text x="64" y="324.3" font-size="15" font-weight="700" fill="#E8EDF3">2 HostReset</text>
<text x="64" y="349.1" font-size="13" fill="#D2DAE4">reset pulse, hold, release</text>
<text x="64" y="409.3" font-size="15" font-weight="700" fill="#E8EDF3">3 Boot</text>
<text x="64" y="434.2" font-size="13" fill="#D2DAE4">boot time, ready pin</text>
<text x="64" y="494.3" font-size="15" font-weight="700" fill="#E8EDF3">4 Link</text>
<text x="64" y="519.2" font-size="13" fill="#D2DAE4">transport: T=1, SHTP</text>
<text x="64" y="579.3" font-size="15" font-weight="700" fill="#E8EDF3">5 Identify</text>
<text x="64" y="604.2" font-size="13" fill="#D2DAE4">ID, probe, capabilities</text>
<text x="64" y="664.3" font-size="15" font-weight="700" fill="#E8EDF3">6 Secure</text>
<text x="64" y="689.2" font-size="13" fill="#D2DAE4">platform SCP03</text>
<text x="64" y="749.3" font-size="15" font-weight="700" fill="#E8EDF3">7 Configure</text>
<text x="64" y="774.2" font-size="13" fill="#D2DAE4">apply the configuration</text>
<text x="64" y="834.3" font-size="15" font-weight="700" fill="#E8EDF3">8 Verify</text>
<text x="64" y="859.2" font-size="13" fill="#D2DAE4">read-back, lifecycle</text>
<text x="64" y="919.3" font-size="15" font-weight="700" fill="#E8EDF3">Ready</text>
<text x="64" y="944.2" font-size="13" fill="#D2DAE4">serves calls</text>
<text x="374" y="239.3" font-size="15" font-weight="700" fill="#E8EDF3">Most drivers</text>
<text x="374" y="264.1" font-size="13" fill="#D2DAE4">Start = EnsureInitialized()</text>
<text x="374" y="324.3" font-size="15" font-weight="700" fill="#E8EDF3">bno08x</text>
<text x="374" y="349.1" font-size="13" fill="#D2DAE4">HostReset = Begin(cfg)</text>
<text x="374" y="368" font-size="13" fill="#D2DAE4">Boot, Link = Poll()</text>
<text x="374" y="386.9" font-size="13" fill="#D2DAE4">Configure = SetFeature</text>
<text x="374" y="447.3" font-size="15" font-weight="700" fill="#E8EDF3">se05x</text>
<text x="374" y="472.2" font-size="13" fill="#D2DAE4">keys = SetPlatformKeys()</text>
<text x="374" y="491" font-size="13" fill="#D2DAE4">Link, Identify, Secure = Open()</text>
<text x="374" y="509.9" font-size="13" fill="#D2DAE4">Verify = lifecycle, optional</text>
<text x="374" y="570.3" font-size="15" font-weight="700" fill="#E8EDF3">Optional stages</text>
<text x="374" y="595.2" font-size="13" fill="#D2DAE4">no pin, rail or key:</text>
<text x="374" y="614" font-size="13" fill="#D2DAE4">skipped, not failed</text>
<rect x="32" y="996.9" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="54" y="1008.5" font-size="12.5" fill="#9AA6B5">stage</text>
<rect x="112.6" y="996.9" width="14" height="14" rx="4" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<text x="134.6" y="1008.5" font-size="12.5" fill="#9AA6B5">ready</text>
<rect x="194.3" y="996.9" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="216.3" y="1008.5" font-size="12.5" fill="#9AA6B5">plan of one chip</text>
</svg>
