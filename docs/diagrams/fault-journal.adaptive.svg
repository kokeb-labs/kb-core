<text x="110" y="183.6" font-size="15" font-weight="700" class="fk-f-violet-text">Handlers</text>
<text x="110" y="208.4" font-size="13" class="fk-f-ink2">Health(): lock-free</text>
<text x="326" y="164.6" font-size="15" font-weight="700" class="fk-f-amber-text">LivenessMonitor</text>
<text x="326" y="189.4" font-size="13" class="fk-f-ink2">Verdict(now)</text>
<text x="326" y="208.2" font-size="13" class="fk-f-ink2">kicks the watchdog</text>
<text x="326" y="227.1" font-size="13" class="fk-f-ink2">owner</text>
<text x="219" y="341.6" font-size="15" font-weight="700" class="fk-f-violet-text">HealthJournal</text>
<text x="219" y="366.4" font-size="13" class="fk-f-ink2">edges only</text>
<text x="435" y="341.6" font-size="15" font-weight="700" class="fk-f-teal-text">Boot</text>
<text x="435" y="366.4" font-size="13" class="fk-f-ink2">port reset reason</text>
<text x="324" y="480.6" font-size="15" font-weight="700" class="fk-f-brand-text">FaultJournal ring</text>
<text x="324" y="505.4" font-size="13" class="fk-f-ink2">32-byte records,</text>
<text x="324" y="524.2" font-size="13" class="fk-f-ink2">CRC-32</text>
<text x="327" y="638.5" font-size="15" font-weight="700" class="fk-f-teal-text">Store</text>
<text x="327" y="663.4" font-size="13" class="fk-f-ink2">RTC or no-init</text>
<text x="327" y="682.2" font-size="13" class="fk-f-ink2">RAM, NVS, FRAM,</text>
<text x="327" y="701.1" font-size="13" class="fk-f-ink2">flash</text>
<text x="327" y="720" font-size="13" class="fk-f-ink2">Open(): newest</text>
<text x="327" y="738.8" font-size="13" class="fk-f-ink2">record</text>
