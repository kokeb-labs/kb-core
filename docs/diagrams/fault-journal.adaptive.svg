<text x="220.4" y="782.8" font-size="12.5" class="fk-f-muted">liveness</text>
<rect x="295.6" y="771.2" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
<text x="317.6" y="782.8" font-size="12.5" class="fk-f-muted">port</text>
<rect x="366.9" y="771.2" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-brand-tint fk-s-brand-strong"/>
<text x="388.9" y="782.8" font-size="12.5" class="fk-f-muted">stored record</text>
