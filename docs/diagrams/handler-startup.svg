<text x="52" y="164.6" font-size="15" font-weight="700" fill="#5B21B6">Power</text>
<text x="52" y="189.4" font-size="13" fill="#2B3442">rail or enable pin</text>
<circle cx="474" cy="175.3" r="10.9" fill="#5B21B6"/>
<text x="474" y="179.4" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="52" y="261.6" font-size="15" font-weight="700" fill="#5B21B6">HostReset</text>
<text x="52" y="286.4" font-size="13" fill="#2B3442">reset pulse, hold, release</text>
<circle cx="474" cy="272.3" r="10.9" fill="#5B21B6"/>
<text x="474" y="276.4" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="52" y="358.6" font-size="15" font-weight="700" fill="#5B21B6">Boot</text>
<text x="52" y="383.4" font-size="13" fill="#2B3442">boot time, ready pin, advertisement</text>
<circle cx="474" cy="369.3" r="10.9" fill="#5B21B6"/>
<text x="474" y="373.4" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="52" y="455.6" font-size="15" font-weight="700" fill="#5B21B6">Link</text>
<text x="52" y="480.4" font-size="13" fill="#2B3442">transport session (T=1, SHTP)</text>
<circle cx="474" cy="466.3" r="10.9" fill="#5B21B6"/>
<text x="474" y="470.4" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
<text x="52" y="552.5" font-size="15" font-weight="700" fill="#5B21B6">Identify</text>
<text x="52" y="577.4" font-size="13" fill="#2B3442">ID, select, probe, capabilities</text>
<circle cx="474" cy="563.3" r="10.9" fill="#5B21B6"/>
<text x="474" y="567.4" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
<text x="52" y="649.5" font-size="15" font-weight="700" fill="#5B21B6">Secure</text>
<text x="52" y="674.4" font-size="13" fill="#2B3442">secure channel (platform SCP03)</text>
<circle cx="474" cy="660.3" r="10.9" fill="#5B21B6"/>
<text x="474" y="664.4" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">6</text>
<text x="52" y="746.5" font-size="15" font-weight="700" fill="#5B21B6">Configure</text>
<text x="52" y="771.4" font-size="13" fill="#2B3442">apply the configuration</text>
<circle cx="474" cy="757.3" r="10.9" fill="#5B21B6"/>
<text x="474" y="761.4" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">7</text>
<text x="52" y="843.5" font-size="15" font-weight="700" fill="#5B21B6">Verify</text>
<text x="52" y="868.4" font-size="13" fill="#2B3442">read-back, lifecycle state</text>
<circle cx="474" cy="854.3" r="10.9" fill="#5B21B6"/>
<text x="474" y="858.4" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">8</text>
<text x="52" y="940.5" font-size="15" font-weight="700" fill="#14532D">Ready</text>
<text x="52" y="965.4" font-size="13" fill="#2B3442">the handler serves calls</text>
<text x="562" y="153.8" font-size="13" font-weight="700" fill="#1E429F">PLANS OF DIFFERENT CHIPS</text>
<text x="582" y="198.6" font-size="15" font-weight="700" fill="#1E429F">Most drivers</text>
<text x="582" y="223.4" font-size="13" fill="#2B3442">One step: Start = driver.EnsureInitialized().</text>
<text x="582" y="242.2" font-size="13" fill="#2B3442">Identify and Configure happen inside the driver.</text>
<text x="582" y="306.6" font-size="15" font-weight="700" fill="#1E429F">bno08x</text>
<text x="582" y="331.4" font-size="13" fill="#2B3442">HostReset = Begin(cfg), synchronous.</text>
<text x="582" y="350.2" font-size="13" fill="#2B3442">Boot and Link = Poll() until Ready(), polled.</text>
<text x="582" y="369.1" font-size="13" fill="#2B3442">Configure = SetFeature operations until OpDone, polled.</text>
<text x="582" y="433.6" font-size="15" font-weight="700" fill="#1E429F">se05x</text>
<text x="582" y="458.4" font-size="13" fill="#2B3442">Secure keys = SetPlatformKeys(), no I/O.</text>
<text x="582" y="477.3" font-size="13" fill="#2B3442">Link, Identify and Secure = Open(), synchronous and bounded by the link.</text>
<text x="582" y="496.1" font-size="13" fill="#2B3442">Verify = lifecycle state check, optional.</text>
<text x="576" y="566.5" font-size="15" font-weight="700" fill="#334155">Optional stages</text>
<text x="576" y="584.4" font-size="13" fill="#334155">A stage the HAL gives nothing for (no pin, rail or key) is skipped, not failed.</text>
<rect x="32" y="1003.2" width="14" height="14" rx="4" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="54" y="1014.8" font-size="12.5" fill="#566070">stage</text>
<rect x="112.6" y="1003.2" width="14" height="14" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<text x="134.6" y="1014.8" font-size="12.5" fill="#566070">ready</text>
<rect x="194.3" y="1003.2" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="216.3" y="1014.8" font-size="12.5" fill="#566070">plan of one chip</text>
</svg>
