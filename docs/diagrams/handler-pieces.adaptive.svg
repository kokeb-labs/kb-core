<text x="240" y="186.3" font-size="15" font-weight="700" class="fk-f-magenta-text">HAL manager or task</text>
<text x="240" y="211.2" font-size="13" class="fk-f-ink2">EnsureStarted, Request,</text>
<text x="240" y="230" font-size="13" class="fk-f-ink2">Sample, Latest, Health</text>
<text x="243" y="344.3" font-size="15" font-weight="700" class="fk-f-violet-text">Access facade</text>
<text x="243" y="369.1" font-size="13" class="fk-f-ink2">OwnerAccess&lt;H&gt;:</text>
<text x="243" y="388" font-size="13" class="fk-f-ink2">queue, snapshot</text>
<text x="243" y="406.9" font-size="13" class="fk-f-ink2">or Guarded&lt;H&gt;:</text>
<text x="243" y="425.7" font-size="13" class="fk-f-ink2">handler lock, then bus</text>
<text x="243" y="444.6" font-size="13" class="fk-f-ink2">lock</text>
<text x="110" y="558.3" font-size="15" font-weight="700" class="fk-f-violet-text">HandlerCore</text>
<text x="110" y="583.2" font-size="13" class="fk-f-ink2">start-up runner</text>
<text x="110" y="602" font-size="13" class="fk-f-ink2">health</text>
<text x="110" y="620.9" font-size="13" class="fk-f-ink2">snapshot</text>
<text x="110" y="639.7" font-size="13" class="fk-f-ink2">liveness beat</text>
<text x="356" y="576.3" font-size="15" font-weight="700" class="fk-f-teal-text">BusDomain&lt;Bus, Model&gt;</text>
<text x="356" y="601.2" font-size="13" class="fk-f-ink2">one bus</text>
<text x="356" y="620" font-size="13" class="fk-f-ink2">its thread model</text>
<text x="110" y="753.3" font-size="15" font-weight="700" class="fk-f-green-text">Driver</text>
<text x="110" y="778.2" font-size="13" class="fk-f-ink2">std::optional</text>
<text x="110" y="797" font-size="13" class="fk-f-ink2">built by the plan</text>
<text x="110" y="911.3" font-size="15" font-weight="700" class="fk-f-violet-text">Binding Port</text>
<text x="110" y="936.2" font-size="13" class="fk-f-ink2">driver hooks</text>
<text x="110" y="955" font-size="13" class="fk-f-ink2">over kb::iface</text>
<text x="110" y="1069.3" font-size="15" font-weight="700" class="fk-f-blue-text">kb::iface contract</text>
<text x="110" y="1094.2" font-size="13" class="fk-f-ink2">the HAL's bus, pins,</text>
<text x="110" y="1113" font-size="13" class="fk-f-ink2">clock</text>
<rect x="326.6" y="272.6" width="39.8" height="20" rx="10" class="fk-f-canvas"/>
<text x="346.5" y="286.9" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">calls</text>
<rect x="244.8" y="471.7" width="81.5" height="20" rx="10" class="fk-f-canvas"/>
<text x="285.5" y="486" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">ServiceKey</text>
<rect x="402.9" y="501.4" width="44.7" height="20" rx="10" class="fk-f-canvas"/>
<text x="425.2" y="515.7" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">owns</text>
<rect x="193.2" y="681.5" width="48.6" height="20" rx="10" class="fk-f-canvas"/>
<text x="217.5" y="695.9" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">builds</text>
<rect x="32" y="1145.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-magenta-tint fk-s-magenta-strong"/>
<text x="54" y="1157.5" font-size="12.5" class="fk-f-muted">product and board HAL</text>
<rect x="224.5" y="1145.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-violet-tint fk-s-violet-strong"/>
<text x="246.5" y="1157.5" font-size="12.5" class="fk-f-muted">handlers</text>
<rect x="324.7" y="1145.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
<text x="346.7" y="1157.5" font-size="12.5" class="fk-f-muted">bus domain</text>
<rect x="443.5" y="1145.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-green-tint fk-s-green-strong"/>
<text x="465.5" y="1157.5" font-size="12.5" class="fk-f-muted">drivers</text>
<rect x="32" y="1170.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-blue-tint fk-s-blue-strong"/>
<text x="54" y="1182.5" font-size="12.5" class="fk-f-muted">interfaces and contracts</text>
