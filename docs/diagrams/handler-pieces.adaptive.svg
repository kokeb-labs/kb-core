<svg xmlns="http://www.w3.org/2000/svg" width="656" height="1217" viewBox="0 0 656 1217" role="img" aria-labelledby="handler-pieces-title handler-pieces-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="handler-pieces-title">The pieces of a handler</title>
<desc id="handler-pieces-desc">Stack in which a HAL manager calls an access facade, the facade runs the handler core with a service key and owns the bus domain, and the core builds the driver, which reaches the HAL's bus through the binding's port and the kb::iface contract.</desc>
