<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">The layer stack</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Arrows point from a layer to what it depends on. Only boundary files touch vendor</text>
<text x="32" y="125.5" font-size="15" fill="#566070">code.</text>
