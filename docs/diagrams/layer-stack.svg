<svg xmlns="http://www.w3.org/2000/svg" width="696" height="1417" viewBox="0 0 696 1417" role="img" aria-labelledby="layer-stack-title layer-stack-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="layer-stack-title">The layer stack</title>
<desc id="layer-stack-desc">Layer stack from the product application through the board HAL to kb::handlers, kb::interfaces, kb::rtos and kb::utils, with the drivers that handlers bind, the MCU ports that satisfy the contracts, and vendor SOUP reached only through boundary files.</desc>
