<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">UPDATES</text>
<text x="32" y="77.3" font-size="26" font-weight="700" class="fk-f-ink">The update path</text>
<text x="32" y="103.8" font-size="15" class="fk-f-muted">One pure function plans an upgrade. The kb tool and the configurator give</text>
<text x="32" y="125.5" font-size="15" class="fk-f-muted">the same bytes.</text>
