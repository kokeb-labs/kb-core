<text x="245" y="186.3" font-size="15" font-weight="700" class="fk-f-brown-text">Entry points</text>
<text x="245" y="211.2" font-size="13" class="fk-f-ink2">kb outdated</text>
<text x="245" y="230" font-size="13" class="fk-f-ink2">kb upgrade</text>
<text x="245" y="248.8" font-size="13" class="fk-f-ink2">the configurator</text>
<text x="245" y="363.3" font-size="15" font-weight="700" class="fk-f-blue-text">1 Read</text>
<text x="245" y="388.1" font-size="13" class="fk-f-ink2">lock, catalogue, image</text>
<text x="245" y="502.3" font-size="15" font-weight="700" class="fk-f-violet-text">2 Order</text>
<text x="245" y="527.2" font-size="13" class="fk-f-ink2">kb-core, port, drivers</text>
<text x="245" y="641.3" font-size="15" font-weight="700" class="fk-f-violet-text">3 Gate</text>
<text x="245" y="666.2" font-size="13" class="fk-f-ink2">MCU, kb_core_min,</text>
<text x="245" y="685" font-size="13" class="fk-f-ink2">owner task, bus kind</text>
<text x="122" y="799.3" font-size="15" font-weight="700" class="fk-f-rose-text">Held back</text>
<text x="122" y="824.2" font-size="13" class="fk-f-ink2">first failing gate</text>
<text x="368" y="799.3" font-size="15" font-weight="700" class="fk-f-violet-text">4 Rows</text>
<text x="368" y="824.2" font-size="13" class="fk-f-ink2">one per component</text>
<text x="368" y="938.3" font-size="15" font-weight="700" class="fk-f-green-text">5 Write</text>
<text x="368" y="963.2" font-size="13" class="fk-f-ink2">image, lock, CMake,</text>
<text x="368" y="982" font-size="13" class="fk-f-ink2">fetch script, report</text>
<text x="368" y="1096.3" font-size="15" font-weight="700" class="fk-f-brown-text">Then, by hand</text>
<text x="368" y="1121.2" font-size="13" class="fk-f-ink2">review, fetch, build,</text>
<text x="368" y="1140" font-size="13" class="fk-f-ink2">test</text>
