<svg xmlns="http://www.w3.org/2000/svg" width="654" height="904" viewBox="0 0 654 904" role="img" aria-labelledby="async-poll-title async-poll-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="async-poll-title">One asynchronous read</title>
<desc id="async-poll-desc">Sequence in which the owner task starts a read through the poller and the port in pass n, polls and gets Pending, the interrupt completes the transfer, and in pass n+1 the poll returns Done with the byte count.</desc>
<defs><marker id="async-poll-arrow-brown-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D6A26B"/></marker><marker id="async-poll-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker><marker id="async-poll-arrow-teal-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2BB3A3"/></marker><marker id="async-poll-arrow-violet-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A78BFA"/></marker></defs>
<rect x="0.5" y="0.5" width="653" height="903" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HANDLERS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">One asynchronous read</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Started in one owner pass, collected in a later one. No pass waits.</text>
<rect x="32" y="119.8" width="590" height="1" fill="#252F3C"/>
