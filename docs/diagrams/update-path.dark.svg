<text x="245" y="186.3" font-size="15" font-weight="700" fill="#F1D5B5">Entry points</text>
<text x="245" y="211.2" font-size="13" fill="#D2DAE4">kb outdated</text>
<text x="245" y="230" font-size="13" fill="#D2DAE4">kb upgrade</text>
<text x="245" y="248.8" font-size="13" fill="#D2DAE4">the configurator</text>
<text x="245" y="363.3" font-size="15" font-weight="700" fill="#BFDBFE">1 Read</text>
<text x="245" y="388.1" font-size="13" fill="#D2DAE4">lock, catalogue, image</text>
<text x="245" y="502.3" font-size="15" font-weight="700" fill="#DDD6FE">2 Order</text>
<text x="245" y="527.2" font-size="13" fill="#D2DAE4">kb-core, port, drivers</text>
<text x="245" y="641.3" font-size="15" font-weight="700" fill="#DDD6FE">3 Gate</text>
<text x="245" y="666.2" font-size="13" fill="#D2DAE4">MCU, kb_core_min,</text>
<text x="245" y="685" font-size="13" fill="#D2DAE4">owner task, bus kind</text>
<text x="122" y="799.3" font-size="15" font-weight="700" fill="#FECDD3">Held back</text>
<text x="122" y="824.2" font-size="13" fill="#D2DAE4">first failing gate</text>
<text x="368" y="799.3" font-size="15" font-weight="700" fill="#DDD6FE">4 Rows</text>
<text x="368" y="824.2" font-size="13" fill="#D2DAE4">one per component</text>
<text x="368" y="938.3" font-size="15" font-weight="700" fill="#BBF7D0">5 Write</text>
<text x="368" y="963.2" font-size="13" fill="#D2DAE4">image, lock, CMake,</text>
<text x="368" y="982" font-size="13" fill="#D2DAE4">fetch script, report</text>
<text x="368" y="1096.3" font-size="15" font-weight="700" fill="#F1D5B5">Then, by hand</text>
<text x="368" y="1121.2" font-size="13" fill="#D2DAE4">review, fetch, build,</text>
<text x="368" y="1140" font-size="13" fill="#D2DAE4">test</text>
<rect x="394.4" y="742.4" width="55.1" height="20" rx="10" fill="#0E131A"/>
<text x="422" y="756.7" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">passes</text>
