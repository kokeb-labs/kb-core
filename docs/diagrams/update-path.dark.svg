<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">UPDATES</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">The update path</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">One pure function plans an upgrade. The kb tool and the configurator give</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">the same bytes.</text>
