<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1219" viewBox="0 0 640 1219" role="img" aria-labelledby="update-path-title update-path-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="update-path-title">The update path</title>
<desc id="update-path-desc">Five steps from reading the lock, catalogue and image through ordering, gating, one row per component and writing the new files, with failing versions held back and a final review, fetch, build and test by hand.</desc>
<defs><marker id="update-path-arrow-green-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ADE80"/></marker><marker id="update-path-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker><marker id="update-path-arrow-rose-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FB7185"/></marker></defs>
