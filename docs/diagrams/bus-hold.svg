<path d="M197 380.6 L197 432.6" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bus-hold-arrow-violet-strong)"/>
<path d="M197 528.5 L197 571.5" fill="none" stroke="#0B7A72" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bus-hold-arrow-teal-strong)"/>
