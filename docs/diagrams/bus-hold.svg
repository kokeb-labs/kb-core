<text x="122" y="186.3" font-size="15" font-weight="700" fill="#6B3F17">Task X</text>
<text x="122" y="203.5" font-size="12" fill="#6B3F17">guarded bus</text>
<text x="122" y="227.4" font-size="13" fill="#2B3442">Guarded::Hold(timeout)</text>
<text x="122" y="334.3" font-size="15" font-weight="700" fill="#5B21B6">1: handler mutex</text>
<text x="122" y="359.1" font-size="13" fill="#2B3442">bounded wait</text>
<text x="122" y="463.3" font-size="15" font-weight="700" fill="#0B5F59">2: BusDomain::Hold</text>
<text x="122" y="488.2" font-size="13" fill="#2B3442">bus mutex</text>
<text x="122" y="507" font-size="13" fill="#2B3442">bounded</text>
<text x="122" y="602.3" font-size="15" font-weight="700" fill="#5B21B6">GuardedHeld</text>
<text x="122" y="627.2" font-size="13" fill="#2B3442">many calls</text>
<text x="122" y="646" font-size="13" fill="#2B3442">nothing between</text>
<text x="122" y="741.3" font-size="15" font-weight="700" fill="#9F1239">Task Y: Request</text>
<text x="122" y="766.2" font-size="13" fill="#2B3442">waits or Timeout</text>
<text x="368" y="186.3" font-size="15" font-weight="700" fill="#6B3F17">Owner task</text>
<text x="368" y="203.5" font-size="12" fill="#6B3F17">owner bus</text>
<text x="368" y="227.4" font-size="13" fill="#2B3442">Hold() between passes</text>
<text x="368" y="324.3" font-size="15" font-weight="700" fill="#0B5F59">Pass flag</text>
<text x="368" y="349.1" font-size="13" fill="#2B3442">set while held</text>
<text x="368" y="368" font-size="13" fill="#2B3442">never waits</text>
<text x="368" y="463.3" font-size="15" font-weight="700" fill="#5B21B6">OwnerAccess::Held</text>
<text x="368" y="488.2" font-size="13" fill="#2B3442">inline calls</text>
<text x="368" y="507" font-size="13" fill="#2B3442">several handlers</text>
<text x="368" y="602.3" font-size="15" font-weight="700" fill="#9F1239">Service(now, ...)</text>
<text x="368" y="627.2" font-size="13" fill="#2B3442">Busy</text>
<text x="368" y="646" font-size="13" fill="#2B3442">violation counted</text>
