<rect x="0.5" y="0.5" width="696" height="1442" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">HANDLERS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">Handler lifecycle and health</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Only EnsureInitialized, StartStep, Deinitialize and Recover change the lifecycle. A</text>
<text x="32" y="125.5" font-size="15" fill="#566070">call never starts or restarts the chip.</text>
