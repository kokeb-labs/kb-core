<svg xmlns="http://www.w3.org/2000/svg" width="697" height="1443" viewBox="0 0 697 1443" role="img" aria-labelledby="handler-health-title handler-health-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="handler-health-title">Handler lifecycle and health</title>
<desc id="handler-health-desc">State machine of a handler with the states Unknown, Starting, Ready, Degraded, Faulted and Recovering, and the calls and failures that move it between them.</desc>
