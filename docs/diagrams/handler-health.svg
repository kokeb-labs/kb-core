<text x="52" y="234.6" font-size="15" font-weight="700" fill="#334155">Unknown</text>
<text x="52" y="259.4" font-size="13" fill="#2B3442">constructed, no I/O</text>
<text x="368" y="234.6" font-size="15" font-weight="700" fill="#8A3C0B">Starting</text>
<text x="368" y="259.4" font-size="13" fill="#2B3442">walks the declared</text>
<text x="368" y="278.2" font-size="13" fill="#2B3442">stages</text>
<text x="684" y="234.6" font-size="15" font-weight="700" fill="#14532D">Ready</text>
<text x="684" y="259.4" font-size="13" fill="#2B3442">all calls allowed</text>
<text x="998" y="234.6" font-size="15" font-weight="700" fill="#8A3C0B">Degraded</text>
<text x="998" y="259.4" font-size="13" fill="#2B3442">a call failed, below</text>
<text x="998" y="278.2" font-size="13" fill="#2B3442">fault_after</text>
<text x="368" y="494.6" font-size="15" font-weight="700" fill="#9F1239">Faulted</text>
<text x="368" y="519.4" font-size="13" fill="#2B3442">chip lost or fault_after</text>
<text x="368" y="538.2" font-size="13" fill="#2B3442">reached</text>
<text x="684" y="494.6" font-size="15" font-weight="700" fill="#5B21B6">Recovering</text>
<text x="684" y="519.4" font-size="13" fill="#2B3442">Recover() running, with</text>
<text x="684" y="538.2" font-size="13" fill="#2B3442">backoff</text>
<rect x="265.2" y="249.8" width="39.7" height="20" rx="10" fill="#FFFFFF"/>
<text x="285" y="264.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">start</text>
<rect x="405.2" y="161.8" width="75.7" height="20" rx="10" fill="#FFFFFF"/>
<text x="443" y="176.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">next stage</text>
<rect x="556.5" y="249.8" width="88.9" height="20" rx="10" fill="#FFFFFF"/>
<text x="601" y="264.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">last stage ok</text>
<rect x="885.2" y="227.8" width="61.7" height="20" rx="10" fill="#FFFFFF"/>
<text x="916" y="242.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">call fails</text>
<rect x="890.4" y="271.8" width="51.2" height="20" rx="10" fill="#FFFFFF"/>
<text x="916" y="286.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">call ok</text>
<rect x="303.8" y="379.8" width="74.5" height="20" rx="10" fill="#FFFFFF"/>
<text x="341" y="394.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">stage fails</text>
<rect x="637.8" y="417.8" width="72.1" height="20" rx="10" fill="#FFFFFF"/>
<text x="673.9" y="432.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">fatal error</text>
<rect x="776.8" y="605.8" width="125.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="839.4" y="620.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">fault_after in a row</text>
<rect x="565.1" y="489.8" width="71.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="601" y="504.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Recover()</text>
<rect x="582.3" y="529.8" width="37.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="601" y="544.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">fails</text>
<rect x="787.6" y="379.8" width="26.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="801" y="394.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">ok</text>
<rect x="399.1" y="163.8" width="87.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="443" y="178.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Deinitialize()</text>
<rect x="110.7" y="509.8" width="87.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="154.7" y="524.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Deinitialize()</text>
<text x="46" y="668.5" font-size="15" font-weight="700" fill="#334155">Details</text>
<text x="46" y="686.3" font-size="13" fill="#334155">Recovery backoff doubles on each failure and the handler refuses Recover() after max_attempts. A failed start leaves the driver destroyed and the next start begins again</text>
<text x="46" y="705.2" font-size="13" fill="#334155">from the first stage.</text>
<rect x="32" y="736.5" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="54" y="748.2" font-size="12.5" fill="#566070">not started</text>
<rect x="145.8" y="736.5" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="167.8" y="748.2" font-size="12.5" fill="#566070">in progress or degraded</text>
<rect x="343.1" y="736.5" width="14" height="14" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<text x="365.1" y="748.2" font-size="12.5" fill="#566070">healthy</text>
<rect x="434.9" y="736.5" width="14" height="14" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="456.9" y="748.2" font-size="12.5" fill="#566070">failed</text>
<rect x="515.5" y="736.5" width="14" height="14" rx="4" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="537.5" y="748.2" font-size="12.5" fill="#566070">recovering</text>
</svg>
