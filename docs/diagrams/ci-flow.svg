<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1007" viewBox="0 0 1200 1007" role="img" aria-labelledby="ci-flow-title ci-flow-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="ci-flow-title">The CI flow</title>
<desc id="ci-flow-desc">Flow: local preflight, then a pull request; always-run checks, path-gated checks and the drivers that are never re-run feed one required gate; a tag then produces the release assets and a schedule re-scans them.</desc>
