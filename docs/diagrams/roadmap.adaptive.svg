<text x="150" y="164.6" font-size="15" font-weight="700" class="fk-f-brand-text">M0 Decisions and guardrails</text>
<text x="150" y="189.4" font-size="13" class="fk-f-ink2">ADR-0006 to 0013; checks green on empty parts</text>
<text x="150" y="279.6" font-size="15" font-weight="700" class="fk-f-brand-text">M1 kb::utils v0.1</text>
<text x="150" y="304.4" font-size="13" class="fk-f-ink2">MISRA 0 findings, coverage, mutation, fuzz</text>
<text x="150" y="394.6" font-size="15" font-weight="700" class="fk-f-amber-text">M2 kb::rtos v0.2</text>
<text x="150" y="419.4" font-size="13" class="fk-f-ink2">none and FreeRTOS backends, TSan clean</text>
<text x="150" y="509.6" font-size="15" font-weight="700" class="fk-f-blue-text">M3 kb::interfaces v0.3</text>
<text x="150" y="534.4" font-size="13" class="fk-f-ink2">concepts, host port, BusDomain</text>
<text x="150" y="624.5" font-size="15" font-weight="700" class="fk-f-teal-text">M4 ESP32 port v0.4</text>
<text x="150" y="649.4" font-size="13" class="fk-f-ink2">3 simple drivers bound</text>
<text x="150" y="668.2" font-size="13" class="fk-f-ink2">bench run</text>
<text x="150" y="758.5" font-size="15" font-weight="700" class="fk-f-violet-text">M5 Handler rollout v1.0</text>
<text x="150" y="783.4" font-size="13" class="fk-f-ink2">all drivers, simplest to hardest</text>
<text x="150" y="873.5" font-size="15" font-weight="700" class="fk-f-brown-text">M6 Breadth</text>
<text x="150" y="898.4" font-size="13" class="fk-f-ink2">port-stm32, ThreadX, tested sets</text>
<text x="150" y="988.5" font-size="15" font-weight="700" class="fk-f-brown-text">M7 Generators</text>
<text x="150" y="1013.4" font-size="13" class="fk-f-ink2">board.yml pin tables, archive, HIL</text>
