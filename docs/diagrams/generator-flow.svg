<svg xmlns="http://www.w3.org/2000/svg" width="640" height="951" viewBox="0 0 640 951" role="img" aria-labelledby="generator-flow-title generator-flow-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="generator-flow-title">Generators and the configurator</title>
<desc id="generator-flow-desc">Flow from the release inputs through the kb command line or the configurator site to one resolver, which writes kb-image.yml, git commands, CMake presets, evidence for the selection and later a project archive.</desc>
<defs><marker id="generator-flow-arrow-green-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="generator-flow-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8798"/></marker></defs>
