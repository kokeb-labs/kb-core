<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">CONFIGURATOR</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">Generators and the configurator</text>
<text x="32" y="103.8" font-size="15" fill="#566070">One resolver specification, two front ends, repeatable downloads. Items</text>
<text x="32" y="125.5" font-size="15" fill="#566070">marked later come in M6 and M7.</text>
