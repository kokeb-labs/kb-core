<text x="245" y="186.3" font-size="15" font-weight="700" fill="#1E429F">Inputs</text>
<text x="245" y="211.2" font-size="13" fill="#2B3442">driver.yml per driver</text>
<text x="245" y="230" font-size="13" fill="#2B3442">release lock</text>
<text x="245" y="248.8" font-size="13" fill="#2B3442">evidence: SBOM, CVEs</text>
<text x="245" y="267.7" font-size="13" fill="#2B3442">tested sets kb YYYY.N</text>
<text x="245" y="286.5" font-size="13" fill="#2B3442">board.yml (later)</text>
<text x="122" y="400.3" font-size="15" font-weight="700" fill="#6B3F17">kb command line</text>
<text x="122" y="425.2" font-size="13" fill="#2B3442">tools/kb</text>
<text x="122" y="444" font-size="13" fill="#2B3442">standard library only</text>
<text x="368" y="400.3" font-size="15" font-weight="700" fill="#6B3F17">Configurator site</text>
<text x="368" y="425.2" font-size="13" fill="#2B3442">static</text>
<text x="368" y="444" font-size="13" fill="#2B3442">GitHub Pages</text>
<text x="245" y="558.3" font-size="15" font-weight="700" fill="#6B3F17">Resolve</text>
<text x="245" y="583.2" font-size="13" fill="#2B3442">drivers to handlers</text>
<text x="245" y="602" font-size="13" fill="#2B3442">interfaces and parts</text>
<text x="245" y="620.9" font-size="13" fill="#2B3442">MCU gates</text>
<text x="245" y="639.7" font-size="13" fill="#2B3442">kb_core_min</text>
<text x="245" y="658.6" font-size="13" fill="#2B3442">thread model per bus</text>
<text x="245" y="772.3" font-size="15" font-weight="700" fill="#14532D">Downloads</text>
<text x="245" y="797.2" font-size="13" fill="#2B3442">kb-image.yml</text>
<text x="245" y="816" font-size="13" fill="#2B3442">git commands</text>
<text x="245" y="834.9" font-size="13" fill="#2B3442">CMake presets</text>
<text x="245" y="853.7" font-size="13" fill="#2B3442">selection evidence</text>
<text x="245" y="872.6" font-size="13" fill="#2B3442">project archive (later)</text>
