<rect x="48" y="632.2" width="524" height="69" rx="10" fill="#321820" stroke="#FB7185" stroke-width="1.4" stroke-dasharray="6 4"/>
<rect x="628" y="196.2" width="524" height="69" rx="10" fill="#2A1F14" stroke="#D6A26B" stroke-width="1.4"/>
<rect x="628" y="204.2" width="4" height="53" rx="2" fill="#D6A26B"/>
<rect x="628" y="305.2" width="524" height="69" rx="10" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<rect x="628" y="313.2" width="4" height="53" rx="2" fill="#2BB3A3"/>
<rect x="628" y="414.2" width="524" height="69" rx="10" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<rect x="628" y="422.2" width="4" height="53" rx="2" fill="#A78BFA"/>
<rect x="628" y="523.2" width="524" height="69" rx="10" fill="#321820" stroke="#FB7185" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="68" y="223" font-size="15" font-weight="700" fill="#F1D5B5">Task X</text>
<text x="68" y="247.8" font-size="13" fill="#D2DAE4">Guarded::Hold(timeout)</text>
<text x="68" y="332" font-size="15" font-weight="700" fill="#DDD6FE">1: handler mutex</text>
<text x="68" y="356.8" font-size="13" fill="#D2DAE4">bounded wait</text>
<text x="68" y="440.9" font-size="15" font-weight="700" fill="#A7F3E6">2: BusDomain::Hold</text>
<text x="68" y="465.8" font-size="13" fill="#D2DAE4">bus mutex, bounded wait</text>
<text x="68" y="550" font-size="15" font-weight="700" fill="#DDD6FE">GuardedHeld</text>
<text x="68" y="574.8" font-size="13" fill="#D2DAE4">Request, Sample ... many calls, nothing in between</text>
<text x="68" y="659" font-size="15" font-weight="700" fill="#FECDD3">Task Y: plain Request</text>
<text x="68" y="683.8" font-size="13" fill="#D2DAE4">waits (bounded) or returns Timeout</text>
<text x="648" y="223" font-size="15" font-weight="700" fill="#F1D5B5">Owner task, between passes</text>
<text x="648" y="247.8" font-size="13" fill="#D2DAE4">BusDomain::Hold(): never waits</text>
<text x="648" y="332" font-size="15" font-weight="700" fill="#A7F3E6">Pass flag</text>
<text x="648" y="356.8" font-size="13" fill="#D2DAE4">set while the hold is held</text>
<text x="648" y="440.9" font-size="15" font-weight="700" fill="#DDD6FE">OwnerAccess::Held(hold)</text>
<text x="648" y="465.8" font-size="13" fill="#D2DAE4">inline calls, several handlers</text>
<text x="648" y="550" font-size="15" font-weight="700" fill="#FECDD3">Service(now, ...)</text>
<text x="648" y="574.8" font-size="13" fill="#D2DAE4">Busy while held; the violation is counted</text>
<text x="48" y="162.8" font-size="13" font-weight="700" fill="#DDD6FE">GUARDED BUS</text>
<text x="48" y="180.2" font-size="12" fill="#DDD6FE">handler lock, then bus lock</text>
<text x="628" y="162.8" font-size="13" font-weight="700" fill="#DDD6FE">OWNER BUS</text>
<text x="628" y="180.2" font-size="12" fill="#DDD6FE">the pass flag</text>
<rect x="32" y="734.6" width="14" height="14" rx="4" fill="#2A1F14" stroke="#D6A26B" stroke-width="1.4"/>
<text x="54" y="746.2" font-size="12.5" fill="#9AA6B5">task</text>
<rect x="104" y="734.6" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="126" y="746.2" font-size="12.5" fill="#9AA6B5">handler</text>
<rect x="197.2" y="734.6" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="219.2" y="746.2" font-size="12.5" fill="#9AA6B5">bus domain</text>
<rect x="316" y="734.6" width="14" height="14" rx="4" fill="#321820" stroke="#FB7185" stroke-width="1.4"/>
<text x="338" y="746.2" font-size="12.5" fill="#9AA6B5">excluded</text>
</svg>
