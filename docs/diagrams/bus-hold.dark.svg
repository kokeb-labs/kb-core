<svg xmlns="http://www.w3.org/2000/svg" width="640" height="845" viewBox="0 0 640 845" role="img" aria-labelledby="bus-hold-title bus-hold-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="bus-hold-title">Held transactions</title>
<desc id="bus-hold-desc">Two chains side by side: on a guarded bus task X takes the handler mutex and then the bus mutex while task Y waits; on an owner bus the owner task takes the hold between passes and the service pass reports Busy.</desc>
<defs><marker id="bus-hold-arrow-brown-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D6A26B"/></marker><marker id="bus-hold-arrow-rose-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FB7185"/></marker><marker id="bus-hold-arrow-teal-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2BB3A3"/></marker><marker id="bus-hold-arrow-violet-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A78BFA"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="844" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HANDLERS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">Held transactions</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">The order of the locks, and what each hold excludes. Left, a guarded bus;</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">right, an owner bus.</text>
<rect x="32" y="141.6" width="576" height="1" fill="#252F3C"/>
