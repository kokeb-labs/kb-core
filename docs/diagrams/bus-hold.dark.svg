<text x="122" y="186.3" font-size="15" font-weight="700" fill="#F1D5B5">Task X</text>
<text x="122" y="203.5" font-size="12" fill="#F1D5B5">guarded bus</text>
<text x="122" y="227.4" font-size="13" fill="#D2DAE4">Guarded::Hold(timeout)</text>
<text x="122" y="334.3" font-size="15" font-weight="700" fill="#DDD6FE">1: handler mutex</text>
<text x="122" y="359.1" font-size="13" fill="#D2DAE4">bounded wait</text>
<text x="122" y="463.3" font-size="15" font-weight="700" fill="#A7F3E6">2: BusDomain::Hold</text>
<text x="122" y="488.2" font-size="13" fill="#D2DAE4">bus mutex</text>
<text x="122" y="507" font-size="13" fill="#D2DAE4">bounded</text>
<text x="122" y="602.3" font-size="15" font-weight="700" fill="#DDD6FE">GuardedHeld</text>
<text x="122" y="627.2" font-size="13" fill="#D2DAE4">many calls</text>
<text x="122" y="646" font-size="13" fill="#D2DAE4">nothing between</text>
<text x="122" y="741.3" font-size="15" font-weight="700" fill="#FECDD3">Task Y: Request</text>
<text x="122" y="766.2" font-size="13" fill="#D2DAE4">waits or Timeout</text>
<text x="368" y="186.3" font-size="15" font-weight="700" fill="#F1D5B5">Owner task</text>
<text x="368" y="203.5" font-size="12" fill="#F1D5B5">owner bus</text>
<text x="368" y="227.4" font-size="13" fill="#D2DAE4">Hold() between passes</text>
<text x="368" y="324.3" font-size="15" font-weight="700" fill="#A7F3E6">Pass flag</text>
<text x="368" y="349.1" font-size="13" fill="#D2DAE4">set while held</text>
<text x="368" y="368" font-size="13" fill="#D2DAE4">never waits</text>
<text x="368" y="463.3" font-size="15" font-weight="700" fill="#DDD6FE">OwnerAccess::Held</text>
<text x="368" y="488.2" font-size="13" fill="#D2DAE4">inline calls</text>
<text x="368" y="507" font-size="13" fill="#D2DAE4">several handlers</text>
<text x="368" y="602.3" font-size="15" font-weight="700" fill="#FECDD3">Service(now, ...)</text>
<text x="368" y="627.2" font-size="13" fill="#D2DAE4">Busy</text>
<text x="368" y="646" font-size="13" fill="#D2DAE4">violation counted</text>
