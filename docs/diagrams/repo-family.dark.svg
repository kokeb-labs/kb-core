<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">The kb repository family</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Only kb-core exists today. Every repository marked planned is not built yet.</text>
