<rect x="402.9" y="501.4" width="44.7" height="20" rx="10" fill="#0E131A"/>
<text x="425.2" y="515.7" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">owns</text>
<rect x="193.2" y="681.5" width="48.6" height="20" rx="10" fill="#0E131A"/>
<text x="217.5" y="695.9" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">builds</text>
<rect x="32" y="1145.9" width="14" height="14" rx="4" fill="#2E1533" stroke="#F0ABFC" stroke-width="1.4"/>
<text x="54" y="1157.5" font-size="12.5" fill="#9AA6B5">product and board HAL</text>
<rect x="224.5" y="1145.9" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="246.5" y="1157.5" font-size="12.5" fill="#9AA6B5">handlers</text>
<rect x="324.7" y="1145.9" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="346.7" y="1157.5" font-size="12.5" fill="#9AA6B5">bus domain</text>
<rect x="443.5" y="1145.9" width="14" height="14" rx="4" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<text x="465.5" y="1157.5" font-size="12.5" fill="#9AA6B5">drivers</text>
<rect x="32" y="1170.9" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="54" y="1182.5" font-size="12.5" fill="#9AA6B5">interfaces and contracts</text>
