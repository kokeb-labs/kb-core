<text x="240" y="186.3" font-size="15" font-weight="700" fill="#F5D0FE">HAL manager or task</text>
<text x="240" y="211.2" font-size="13" fill="#D2DAE4">EnsureStarted, Request,</text>
<text x="240" y="230" font-size="13" fill="#D2DAE4">Sample, Latest, Health</text>
<text x="243" y="344.3" font-size="15" font-weight="700" fill="#DDD6FE">Access facade</text>
<text x="243" y="369.1" font-size="13" fill="#D2DAE4">OwnerAccess&lt;H&gt;:</text>
<text x="243" y="388" font-size="13" fill="#D2DAE4">queue, snapshot</text>
<text x="243" y="406.9" font-size="13" fill="#D2DAE4">or Guarded&lt;H&gt;:</text>
<text x="243" y="425.7" font-size="13" fill="#D2DAE4">handler lock, then bus</text>
<text x="243" y="444.6" font-size="13" fill="#D2DAE4">lock</text>
<text x="110" y="558.3" font-size="15" font-weight="700" fill="#DDD6FE">HandlerCore</text>
<text x="110" y="583.2" font-size="13" fill="#D2DAE4">start-up runner</text>
<text x="110" y="602" font-size="13" fill="#D2DAE4">health</text>
<text x="110" y="620.9" font-size="13" fill="#D2DAE4">snapshot</text>
<text x="110" y="639.7" font-size="13" fill="#D2DAE4">liveness beat</text>
<text x="356" y="576.3" font-size="15" font-weight="700" fill="#A7F3E6">BusDomain&lt;Bus, Model&gt;</text>
<text x="356" y="601.2" font-size="13" fill="#D2DAE4">one bus</text>
<text x="356" y="620" font-size="13" fill="#D2DAE4">its thread model</text>
<text x="110" y="753.3" font-size="15" font-weight="700" fill="#BBF7D0">Driver</text>
<text x="110" y="778.2" font-size="13" fill="#D2DAE4">std::optional</text>
<text x="110" y="797" font-size="13" fill="#D2DAE4">built by the plan</text>
<text x="110" y="911.3" font-size="15" font-weight="700" fill="#DDD6FE">Binding Port</text>
<text x="110" y="936.2" font-size="13" fill="#D2DAE4">driver hooks</text>
<text x="110" y="955" font-size="13" fill="#D2DAE4">over kb::iface</text>
<text x="110" y="1069.3" font-size="15" font-weight="700" fill="#BFDBFE">kb::iface contract</text>
<text x="110" y="1094.2" font-size="13" fill="#D2DAE4">the HAL's bus, pins,</text>
<text x="110" y="1113" font-size="13" fill="#D2DAE4">clock</text>
<rect x="326.6" y="272.6" width="39.8" height="20" rx="10" fill="#0E131A"/>
