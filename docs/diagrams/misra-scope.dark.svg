<text x="48" y="162.8" font-size="13" font-weight="700" fill="#BBF7D0">CLAIMED COMPLIANT</text>
<text x="48" y="180.2" font-size="12" fill="#BBF7D0">kb-core own code, components/lib/**, zero repository deviations</text>
<text x="68" y="223" font-size="15" font-weight="700" fill="#F8D27A">kb::utils</text>
<text x="68" y="247.8" font-size="13" fill="#D2DAE4">phase 1</text>
<text x="348.5" y="223" font-size="15" font-weight="700" fill="#BFDBFE">kb::interfaces</text>
<text x="348.5" y="247.8" font-size="13" fill="#D2DAE4">contracts and host port, phase 1</text>
<text x="629" y="223" font-size="15" font-weight="700" fill="#FDE68A">kb::rtos</text>
<text x="629" y="247.8" font-size="13" fill="#D2DAE4">public API, phase 2</text>
<text x="909.5" y="223" font-size="15" font-weight="700" fill="#DDD6FE">kb::handlers</text>
<text x="909.5" y="247.8" font-size="13" fill="#D2DAE4">handlers and bindings, phase 4</text>
<text x="48" y="362.2" font-size="13" font-weight="700" fill="#FDE68A">BOUNDARY FILES</text>
<text x="48" y="379.6" font-size="12" fill="#FDE68A">compliant with recorded deviations (DEV-KBC-*, DEV-KBP-*)</text>
<text x="68" y="422.4" font-size="15" font-weight="700" fill="#E8EDF3">RTOS backend boundary files</text>
<text x="68" y="446.5" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">components/lib/rtos/backends/freertos/*_boundary.cpp</text>
<text x="629" y="422.4" font-size="15" font-weight="700" fill="#E8EDF3">Port boundary files</text>
<text x="629" y="446.5" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">components/ports/esp32/src/*_boundary.cpp (own records)</text>
<text x="48" y="560.6" font-size="13" font-weight="700" fill="#BFDBFE">COVERED BY THEIR OWN EVIDENCE</text>
<text x="68" y="603.4" font-size="15" font-weight="700" fill="#BBF7D0">driver-&lt;chip&gt; at its pinned tag</text>
<text x="68" y="628.2" font-size="13" fill="#D2DAE4">own ru-misra run at level high</text>
<text x="48" y="742.6" font-size="13" font-weight="700" fill="#E2E8F0">SOUP, OUT OF SCOPE</text>
<text x="68" y="785.3" font-size="15" font-weight="700" fill="#E8EDF3">Vendor and third-party code</text>
<text x="68" y="810.2" font-size="13" fill="#D2DAE4">ESP-IDF, STM32 HAL, FreeRTOS, ThreadX, mbedTLS, listed with versions</text>
<rect x="879.7" y="299.2" width="176.6" height="20" rx="10" fill="#0E131A"/>
<text x="968" y="313.5" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">includes the boundary files</text>
<rect x="886.4" y="679.6" width="163.2" height="20" rx="10" fill="#0E131A"/>
<text x="968" y="693.9" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">-isystem, never reported</text>
