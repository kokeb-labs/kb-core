<title id="roadmap-title">Phase roadmap</title>
<desc id="roadmap-desc">Column of eight phases in order, M0 to M7: decisions, utils, rtos, interfaces, the ESP32 port and bindings, the handler rollout, breadth and generators, each with its exit criteria.</desc>
