<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="951" viewBox="0 0 1200 951" role="img" aria-labelledby="handler-threading-title handler-threading-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="handler-threading-title">Handler thread models</title>
<desc id="handler-threading-desc">Two side by side models. Owner task: other tasks read a lock-free snapshot or post requests to a queue that the owner task publishes to and drains, and the owner task steps the handlers on an unlocked bus domain. Guarded facade: tasks call a guarded handler that takes the handler lock then a bounded bus lock.</desc>
