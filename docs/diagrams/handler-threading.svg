<text x="68" y="223" font-size="15" font-weight="700" fill="#6B3F17">Other tasks</text>
<text x="68" y="247.8" font-size="13" fill="#2B3442">Latest(): lock-free copy</text>
<text x="68" y="266.6" font-size="13" fill="#2B3442">Request(cmd, timeout): post, wait</text>
<text x="68" y="363" font-size="15" font-weight="700" fill="#1E429F">SeqlockSnapshot</text>
<text x="68" y="387.8" font-size="13" fill="#2B3442">published each step</text>
<text x="348" y="363" font-size="15" font-weight="700" fill="#1E429F">Command queue</text>
<text x="348" y="387.8" font-size="13" fill="#2B3442">drained, bounded</text>
<rect x="150.6" y="300.2" width="58.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="180" y="314.5" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Latest()</text>
<rect x="424.4" y="300.2" width="71.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="460" y="314.5" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Request()</text>
<text x="68" y="483.9" font-size="15" font-weight="700" fill="#6B3F17">Owner task</text>
<text x="68" y="508.8" font-size="13" fill="#2B3442">fixed-rate Thread, calls Service(now)</text>
<rect x="144.7" y="421.2" width="70.6" height="20" rx="10" fill="#FFFFFF"/>
<text x="180" y="435.5" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">publishes</text>
<rect x="435.1" y="421.2" width="49.7" height="20" rx="10" fill="#FFFFFF"/>
<text x="460" y="435.5" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">drains</text>
<text x="68" y="605" font-size="15" font-weight="700" fill="#5B21B6">Handler A</text>
<text x="68" y="629.8" font-size="13" fill="#2B3442">single-threaded core</text>
<text x="348" y="605" font-size="15" font-weight="700" fill="#5B21B6">Handler B</text>
<text x="348" y="629.8" font-size="13" fill="#2B3442">single-threaded core</text>
<text x="68" y="726" font-size="15" font-weight="700" fill="#0B5F59">BusDomain&lt;SPI1, Owner&gt;</text>
<text x="68" y="750.8" font-size="13" fill="#2B3442">no mutex, owner check</text>
<text x="48" y="162.8" font-size="13" font-weight="700" fill="#5B21B6">MODEL O: OWNER TASK</text>
<text x="48" y="180.2" font-size="12" fill="#5B21B6">default for real-time buses</text>
<text x="68" y="905.3" font-size="15" font-weight="700" fill="#6B3F17">Task X</text>
<text x="348" y="905.3" font-size="15" font-weight="700" fill="#6B3F17">Task Y</text>
<text x="68" y="1001.3" font-size="15" font-weight="700" fill="#5B21B6">Guarded&lt;Handler C&gt;</text>
<text x="68" y="1026.2" font-size="13" fill="#2B3442">handler lock</text>
<text x="348" y="1001.3" font-size="15" font-weight="700" fill="#5B21B6">Guarded&lt;Handler D&gt;</text>
<text x="348" y="1026.2" font-size="13" fill="#2B3442">handler lock</text>
<rect x="123.4" y="938.6" width="113.1" height="20" rx="10" fill="#FFFFFF"/>
<text x="180" y="952.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Call(timeout, op)</text>
<rect x="403.4" y="938.6" width="113.1" height="20" rx="10" fill="#FFFFFF"/>
<text x="460" y="952.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Call(timeout, op)</text>
<text x="68" y="1122.3" font-size="15" font-weight="700" fill="#0B5F59">BusDomain&lt;I2C0, Guarded&gt;</text>
<text x="68" y="1147.2" font-size="13" fill="#2B3442">mutex, recovery, statistics</text>
<rect x="133.2" y="1059.6" width="93.6" height="20" rx="10" fill="#FFFFFF"/>
<text x="180" y="1073.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">then bus lock</text>
<text x="48" y="845.2" font-size="13" font-weight="700" fill="#5B21B6">MODEL G: GUARDED FACADE</text>
<text x="48" y="862.6" font-size="12" fill="#5B21B6">slow, sporadic devices</text>
<text x="46" y="1235.3" font-size="15" font-weight="700" fill="#334155">Interrupts</text>
<text x="46" y="1253.1" font-size="13" fill="#334155">An ISR only sets event flags or notifies the owner task. It never calls a handler.</text>
<rect x="32" y="1284.5" width="14" height="14" rx="4" fill="#F8F1EA" stroke="#7C4A1E" stroke-width="1.4"/>
<text x="54" y="1296.1" font-size="12.5" fill="#566070">task</text>
<rect x="104" y="1284.5" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="126" y="1296.1" font-size="12.5" fill="#566070">shared state</text>
<rect x="227.7" y="1284.5" width="14" height="14" rx="4" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="249.7" y="1296.1" font-size="12.5" fill="#566070">handler</text>
<rect x="320.8" y="1284.5" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="342.8" y="1296.1" font-size="12.5" fill="#566070">bus domain</text>
</svg>
