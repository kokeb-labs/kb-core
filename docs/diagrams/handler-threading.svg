<text x="68" y="223" font-size="15" font-weight="700" fill="#6B3F17">Other tasks</text>
<text x="68" y="247.8" font-size="13" fill="#2B3442">Latest(): lock-free copy</text>
<text x="68" y="266.6" font-size="13" fill="#2B3442">Request(cmd, timeout): post and wait</text>
<text x="68" y="365" font-size="15" font-weight="700" fill="#1E429F">SeqlockSnapshot</text>
<text x="68" y="389.8" font-size="13" fill="#2B3442">published each step</text>
<text x="338" y="365" font-size="15" font-weight="700" fill="#1E429F">Command queue</text>
<text x="338" y="389.8" font-size="13" fill="#2B3442">with completion, drained</text>
<text x="338" y="408.7" font-size="13" fill="#2B3442">bounded per step</text>
<rect x="145.6" y="301.2" width="58.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="175" y="315.5" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Latest()</text>
<rect x="409.4" y="301.2" width="71.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="445" y="315.5" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Request()</text>
<text x="68" y="506.9" font-size="15" font-weight="700" fill="#6B3F17">Owner task</text>
<text x="68" y="531.8" font-size="13" fill="#2B3442">kb::rtos::Thread at a fixed rate, calls Service(now)</text>
<rect x="139.7" y="443.2" width="70.6" height="20" rx="10" fill="#FFFFFF"/>
<text x="175" y="457.5" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">publishes</text>
<rect x="420.1" y="443.2" width="49.7" height="20" rx="10" fill="#FFFFFF"/>
<text x="445" y="457.5" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">drains</text>
<text x="68" y="624" font-size="15" font-weight="700" fill="#5B21B6">Handler A</text>
<text x="68" y="648.8" font-size="13" fill="#2B3442">single-threaded core</text>
<text x="338" y="624" font-size="15" font-weight="700" fill="#5B21B6">Handler B</text>
<text x="338" y="648.8" font-size="13" fill="#2B3442">single-threaded core</text>
<text x="68" y="741" font-size="15" font-weight="700" fill="#0B5F59">BusDomain&lt;SPI1, Owner&gt;</text>
<text x="68" y="765.8" font-size="13" fill="#2B3442">no mutex, owner check</text>
<text x="648" y="223" font-size="15" font-weight="700" fill="#6B3F17">Task X</text>
<text x="918" y="223" font-size="15" font-weight="700" fill="#6B3F17">Task Y</text>
<text x="648" y="337" font-size="15" font-weight="700" fill="#5B21B6">Guarded&lt;Handler C&gt;</text>
<text x="648" y="361.8" font-size="13" fill="#2B3442">handler lock</text>
<text x="918" y="337" font-size="15" font-weight="700" fill="#5B21B6">Guarded&lt;Handler D&gt;</text>
<text x="918" y="361.8" font-size="13" fill="#2B3442">handler lock</text>
<rect x="698.4" y="265.2" width="113.1" height="20" rx="10" fill="#FFFFFF"/>
<text x="755" y="279.5" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Call(timeout, op)</text>
<rect x="968.4" y="265.2" width="113.1" height="20" rx="10" fill="#FFFFFF"/>
<text x="1025" y="279.5" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Call(timeout, op)</text>
<text x="648" y="485.9" font-size="15" font-weight="700" fill="#0B5F59">BusDomain&lt;I2C0, Guarded&gt;</text>
<text x="648" y="510.8" font-size="13" fill="#2B3442">mutex, recovery, statistics</text>
<rect x="666.8" y="409.2" width="176.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="755" y="423.5" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">then bus lock (TryLockFor)</text>
<text x="48" y="162.8" font-size="13" font-weight="700" fill="#5B21B6">MODEL O: OWNER TASK</text>
<text x="48" y="180.2" font-size="12" fill="#5B21B6">default for real-time buses</text>
<text x="628" y="162.8" font-size="13" font-weight="700" fill="#5B21B6">MODEL G: GUARDED FACADE</text>
<text x="628" y="180.2" font-size="12" fill="#5B21B6">slow, sporadic devices</text>
<text x="46" y="856" font-size="15" font-weight="700" fill="#334155">Interrupts</text>
<text x="46" y="873.8" font-size="13" fill="#334155">An ISR only sets event flags or notifies the owner task. It never calls a handler.</text>
<rect x="32" y="905.1" width="14" height="14" rx="4" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="54" y="916.7" font-size="12.5" fill="#566070">handler</text>
<rect x="125.1" y="905.1" width="14" height="14" rx="4" fill="#F8F1EA" stroke="#7C4A1E" stroke-width="1.4"/>
<text x="147.1" y="916.7" font-size="12.5" fill="#566070">task</text>
<rect x="197.2" y="905.1" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="219.2" y="916.7" font-size="12.5" fill="#566070">shared state</text>
<rect x="320.8" y="905.1" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="342.8" y="916.7" font-size="12.5" fill="#566070">bus domain</text>
