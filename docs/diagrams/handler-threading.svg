<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1330" viewBox="0 0 640 1330" role="img" aria-labelledby="handler-threading-title handler-threading-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="handler-threading-title">Handler thread models</title>
<desc id="handler-threading-desc">Two thread models, one above the other: in model O other tasks read a lock-free snapshot or queue requests that the owner task publishes and drains, and in model G tasks call guarded handlers that take the handler lock and then a bounded bus lock.</desc>
<defs><marker id="handler-threading-arrow-brown-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C4A1E"/></marker><marker id="handler-threading-arrow-violet-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="1329" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">HANDLERS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">Handler thread models</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Declared per bus. Callers on other tasks use one access API in both models.</text>
<rect x="32" y="119.8" width="576" height="1" fill="#E2E7EE"/>
