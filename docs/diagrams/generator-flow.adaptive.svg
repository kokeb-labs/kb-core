<text x="245" y="186.3" font-size="15" font-weight="700" class="fk-f-blue-text">Inputs</text>
<text x="245" y="211.2" font-size="13" class="fk-f-ink2">driver.yml per driver</text>
<text x="245" y="230" font-size="13" class="fk-f-ink2">release lock</text>
<text x="245" y="248.8" font-size="13" class="fk-f-ink2">evidence: SBOM, CVEs</text>
<text x="245" y="267.7" font-size="13" class="fk-f-ink2">tested sets kb YYYY.N</text>
<text x="245" y="286.5" font-size="13" class="fk-f-ink2">board.yml (later)</text>
<text x="122" y="400.3" font-size="15" font-weight="700" class="fk-f-brown-text">kb command line</text>
<text x="122" y="425.2" font-size="13" class="fk-f-ink2">tools/kb</text>
<text x="122" y="444" font-size="13" class="fk-f-ink2">standard library only</text>
<text x="368" y="400.3" font-size="15" font-weight="700" class="fk-f-brown-text">Configurator site</text>
<text x="368" y="425.2" font-size="13" class="fk-f-ink2">static</text>
<text x="368" y="444" font-size="13" class="fk-f-ink2">GitHub Pages</text>
<text x="245" y="558.3" font-size="15" font-weight="700" class="fk-f-brown-text">Resolve</text>
<text x="245" y="583.2" font-size="13" class="fk-f-ink2">drivers to handlers</text>
<text x="245" y="602" font-size="13" class="fk-f-ink2">interfaces and parts</text>
<text x="245" y="620.9" font-size="13" class="fk-f-ink2">MCU gates</text>
<text x="245" y="639.7" font-size="13" class="fk-f-ink2">kb_core_min</text>
<text x="245" y="658.6" font-size="13" class="fk-f-ink2">thread model per bus</text>
<text x="245" y="772.3" font-size="15" font-weight="700" class="fk-f-green-text">Downloads</text>
<text x="245" y="797.2" font-size="13" class="fk-f-ink2">kb-image.yml</text>
<text x="245" y="816" font-size="13" class="fk-f-ink2">git commands</text>
