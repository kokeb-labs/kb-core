<rect x="354" y="428.6" width="4" height="91" rx="2" class="fk-f-blue-strong"/>
<rect x="354" y="543.5" width="246" height="88" rx="10" stroke-width="1" class="fk-f-card fk-s-line"/>
<rect x="354" y="551.5" width="4" height="72" rx="2" class="fk-f-slate-strong"/>
<text x="48" y="184.6" font-size="13" font-weight="700" class="fk-f-violet-text">STAGES, IN ORDER</text>
<text x="358" y="184.6" font-size="13" font-weight="700" class="fk-f-blue-text">PLANS OF THREE CHIPS</text>
<text x="64" y="239.3" font-size="15" font-weight="700" class="fk-f-ink">1 Power</text>
<text x="64" y="264.1" font-size="13" class="fk-f-ink2">rail or enable pin</text>
<text x="64" y="324.3" font-size="15" font-weight="700" class="fk-f-ink">2 HostReset</text>
<text x="64" y="349.1" font-size="13" class="fk-f-ink2">reset pulse, hold, release</text>
<text x="64" y="409.3" font-size="15" font-weight="700" class="fk-f-ink">3 Boot</text>
<text x="64" y="434.2" font-size="13" class="fk-f-ink2">boot time, ready pin</text>
<text x="64" y="494.3" font-size="15" font-weight="700" class="fk-f-ink">4 Link</text>
<text x="64" y="519.2" font-size="13" class="fk-f-ink2">transport: T=1, SHTP</text>
<text x="64" y="579.3" font-size="15" font-weight="700" class="fk-f-ink">5 Identify</text>
<text x="64" y="604.2" font-size="13" class="fk-f-ink2">ID, probe, capabilities</text>
<text x="64" y="664.3" font-size="15" font-weight="700" class="fk-f-ink">6 Secure</text>
<text x="64" y="689.2" font-size="13" class="fk-f-ink2">platform SCP03</text>
<text x="64" y="749.3" font-size="15" font-weight="700" class="fk-f-ink">7 Configure</text>
<text x="64" y="774.2" font-size="13" class="fk-f-ink2">apply the configuration</text>
<text x="64" y="834.3" font-size="15" font-weight="700" class="fk-f-ink">8 Verify</text>
<text x="64" y="859.2" font-size="13" class="fk-f-ink2">read-back, lifecycle</text>
<text x="64" y="919.3" font-size="15" font-weight="700" class="fk-f-ink">Ready</text>
<text x="64" y="944.2" font-size="13" class="fk-f-ink2">serves calls</text>
<text x="374" y="239.3" font-size="15" font-weight="700" class="fk-f-ink">Most drivers</text>
<text x="374" y="264.1" font-size="13" class="fk-f-ink2">Start = EnsureInitialized()</text>
<text x="374" y="324.3" font-size="15" font-weight="700" class="fk-f-ink">bno08x</text>
<text x="374" y="349.1" font-size="13" class="fk-f-ink2">HostReset = Begin(cfg)</text>
<text x="374" y="368" font-size="13" class="fk-f-ink2">Boot, Link = Poll()</text>
<text x="374" y="386.9" font-size="13" class="fk-f-ink2">Configure = SetFeature</text>
<text x="374" y="447.3" font-size="15" font-weight="700" class="fk-f-ink">se05x</text>
<text x="374" y="472.2" font-size="13" class="fk-f-ink2">keys = SetPlatformKeys()</text>
<text x="374" y="491" font-size="13" class="fk-f-ink2">Link, Identify, Secure = Open()</text>
<text x="374" y="509.9" font-size="13" class="fk-f-ink2">Verify = lifecycle, optional</text>
<text x="374" y="570.3" font-size="15" font-weight="700" class="fk-f-ink">Optional stages</text>
<text x="374" y="595.2" font-size="13" class="fk-f-ink2">no pin, rail or key:</text>
<text x="374" y="614" font-size="13" class="fk-f-ink2">skipped, not failed</text>
<rect x="32" y="996.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-violet-tint fk-s-violet-strong"/>
<text x="54" y="1008.5" font-size="12.5" class="fk-f-muted">stage</text>
<rect x="112.6" y="996.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-green-tint fk-s-green-strong"/>
<text x="134.6" y="1008.5" font-size="12.5" class="fk-f-muted">ready</text>
<rect x="194.3" y="996.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-blue-tint fk-s-blue-strong"/>
<text x="216.3" y="1008.5" font-size="12.5" class="fk-f-muted">plan of one chip</text>
</svg>
