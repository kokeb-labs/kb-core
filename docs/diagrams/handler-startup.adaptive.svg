<svg xmlns="http://www.w3.org/2000/svg" width="644" height="1043" viewBox="0 0 644 1043" role="img" aria-labelledby="handler-startup-title handler-startup-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="handler-startup-title">The handler start-up pipeline</title>
<desc id="handler-startup-desc">Eight start-up stages in order, Power, HostReset, Boot, Link, Identify, Secure, Configure and Verify, ending in Ready, beside the plans of most drivers, the bno08x and the se05x, each using only some of the stages.</desc>
