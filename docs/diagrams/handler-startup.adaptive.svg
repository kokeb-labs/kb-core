<rect x="0.5" y="0.5" width="643" height="1042" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">HANDLERS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" class="fk-f-ink">The handler start-up pipeline</text>
<text x="32" y="103.8" font-size="15" class="fk-f-muted">One runner, a plan of declared stages per chip. Each stage is synchronous</text>
<text x="32" y="125.5" font-size="15" class="fk-f-muted">or polled, and bounded.</text>
<rect x="32" y="141.6" width="580" height="1" class="fk-f-hair"/>
