<text x="68" y="223" font-size="15" font-weight="700" class="fk-f-brown-text">Other tasks</text>
<text x="68" y="247.8" font-size="13" class="fk-f-ink2">Latest(): lock-free copy</text>
<text x="68" y="266.6" font-size="13" class="fk-f-ink2">Request(cmd, timeout): post, wait</text>
<text x="68" y="363" font-size="15" font-weight="700" class="fk-f-blue-text">SeqlockSnapshot</text>
<text x="68" y="387.8" font-size="13" class="fk-f-ink2">published each step</text>
<text x="348" y="363" font-size="15" font-weight="700" class="fk-f-blue-text">Command queue</text>
<text x="348" y="387.8" font-size="13" class="fk-f-ink2">drained, bounded</text>
<rect x="150.6" y="300.2" width="58.8" height="20" rx="10" class="fk-f-canvas"/>
<text x="180" y="314.5" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">Latest()</text>
<rect x="424.4" y="300.2" width="71.3" height="20" rx="10" class="fk-f-canvas"/>
<text x="460" y="314.5" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">Request()</text>
<text x="68" y="483.9" font-size="15" font-weight="700" class="fk-f-brown-text">Owner task</text>
<text x="68" y="508.8" font-size="13" class="fk-f-ink2">fixed-rate Thread, calls Service(now)</text>
<rect x="144.7" y="421.2" width="70.6" height="20" rx="10" class="fk-f-canvas"/>
<text x="180" y="435.5" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">publishes</text>
<rect x="435.1" y="421.2" width="49.7" height="20" rx="10" class="fk-f-canvas"/>
<text x="460" y="435.5" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">drains</text>
<text x="68" y="605" font-size="15" font-weight="700" class="fk-f-violet-text">Handler A</text>
<text x="68" y="629.8" font-size="13" class="fk-f-ink2">single-threaded core</text>
<text x="348" y="605" font-size="15" font-weight="700" class="fk-f-violet-text">Handler B</text>
<text x="348" y="629.8" font-size="13" class="fk-f-ink2">single-threaded core</text>
<text x="68" y="726" font-size="15" font-weight="700" class="fk-f-teal-text">BusDomain&lt;SPI1, Owner&gt;</text>
<text x="68" y="750.8" font-size="13" class="fk-f-ink2">no mutex, owner check</text>
<text x="48" y="162.8" font-size="13" font-weight="700" class="fk-f-violet-text">MODEL O: OWNER TASK</text>
<text x="48" y="180.2" font-size="12" class="fk-f-violet-text">default for real-time buses</text>
<text x="68" y="905.3" font-size="15" font-weight="700" class="fk-f-brown-text">Task X</text>
<text x="348" y="905.3" font-size="15" font-weight="700" class="fk-f-brown-text">Task Y</text>
<text x="68" y="1001.3" font-size="15" font-weight="700" class="fk-f-violet-text">Guarded&lt;Handler C&gt;</text>
<text x="68" y="1026.2" font-size="13" class="fk-f-ink2">handler lock</text>
<text x="348" y="1001.3" font-size="15" font-weight="700" class="fk-f-violet-text">Guarded&lt;Handler D&gt;</text>
<text x="348" y="1026.2" font-size="13" class="fk-f-ink2">handler lock</text>
<rect x="123.4" y="938.6" width="113.1" height="20" rx="10" class="fk-f-canvas"/>
<text x="180" y="952.9" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">Call(timeout, op)</text>
<rect x="403.4" y="938.6" width="113.1" height="20" rx="10" class="fk-f-canvas"/>
<text x="460" y="952.9" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">Call(timeout, op)</text>
<text x="68" y="1122.3" font-size="15" font-weight="700" class="fk-f-teal-text">BusDomain&lt;I2C0, Guarded&gt;</text>
<text x="68" y="1147.2" font-size="13" class="fk-f-ink2">mutex, recovery, statistics</text>
<rect x="133.2" y="1059.6" width="93.6" height="20" rx="10" class="fk-f-canvas"/>
<text x="180" y="1073.9" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">then bus lock</text>
<text x="48" y="845.2" font-size="13" font-weight="700" class="fk-f-violet-text">MODEL G: GUARDED FACADE</text>
<text x="48" y="862.6" font-size="12" class="fk-f-violet-text">slow, sporadic devices</text>
<text x="46" y="1235.3" font-size="15" font-weight="700" class="fk-f-slate-text">Interrupts</text>
<text x="46" y="1253.1" font-size="13" class="fk-f-slate-text">An ISR only sets event flags or notifies the owner task. It never calls a handler.</text>
<rect x="32" y="1284.5" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-brown-tint fk-s-brown-strong"/>
<text x="54" y="1296.1" font-size="12.5" class="fk-f-muted">task</text>
<rect x="104" y="1284.5" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-blue-tint fk-s-blue-strong"/>
<text x="126" y="1296.1" font-size="12.5" class="fk-f-muted">shared state</text>
<rect x="227.7" y="1284.5" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-violet-tint fk-s-violet-strong"/>
<text x="249.7" y="1296.1" font-size="12.5" class="fk-f-muted">handler</text>
<rect x="320.8" y="1284.5" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
<text x="342.8" y="1296.1" font-size="12.5" class="fk-f-muted">bus domain</text>
