<defs><marker id="call-sequence-arrow-green-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fk-f-green-strong"/></marker><marker id="call-sequence-arrow-magenta-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fk-f-magenta-strong"/></marker><marker id="call-sequence-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fk-f-rail"/></marker><marker id="call-sequence-arrow-teal-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fk-f-teal-strong"/></marker><marker id="call-sequence-arrow-violet-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fk-f-violet-strong"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="927" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">ARCHITECTURE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" class="fk-f-ink">One call through the layers</text>
<text x="32" y="103.8" font-size="15" class="fk-f-muted">A HAL reads a register of a PF1550 power IC. Only the last step knows it</text>
<text x="32" y="125.5" font-size="15" class="fk-f-muted">runs on an ESP32.</text>
<rect x="32" y="141.6" width="576" height="1" class="fk-f-hair"/>
<path d="M239 232.6 L239 294.6" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#call-sequence-arrow-magenta-strong)" class="fk-s-magenta-strong"/>
<path d="M239 390.6 L239 452.6" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#call-sequence-arrow-violet-strong)" class="fk-s-violet-strong"/>
<path d="M239 548.5 L239 610.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#call-sequence-arrow-green-strong)" class="fk-s-green-strong"/>
