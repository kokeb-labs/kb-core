<text x="245" y="186.3" font-size="15" font-weight="700" class="fk-f-magenta-text">HAL</text>
<text x="245" y="211.2" font-size="13" class="fk-f-ink2">reads a register</text>
<text x="245" y="325.3" font-size="15" font-weight="700" class="fk-f-violet-text">Guarded handler</text>
<text x="245" y="350.1" font-size="13" class="fk-f-ink2">handler lock, then bus</text>
<text x="245" y="369" font-size="13" class="fk-f-ink2">lock</text>
<text x="245" y="483.3" font-size="15" font-weight="700" class="fk-f-green-text">pf1550 driver</text>
<text x="245" y="508.2" font-size="13" class="fk-f-ink2">calls its WriteRead</text>
<text x="245" y="527" font-size="13" class="fk-f-ink2">hook</text>
<text x="245" y="641.3" font-size="15" font-weight="700" class="fk-f-violet-text">kb binding</text>
<text x="245" y="666.2" font-size="13" class="fk-f-ink2">Pf1550Port</text>
<text x="245" y="780.3" font-size="15" font-weight="700" class="fk-f-teal-text">ESP32 I2cDevice</text>
<text x="245" y="805.2" font-size="13" class="fk-f-ink2">the only step that</text>
<text x="245" y="824" font-size="13" class="fk-f-ink2">knows the MCU</text>
<rect x="246.9" y="238.7" width="113.1" height="20" rx="10" class="fk-f-canvas"/>
<text x="303.5" y="253" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">Call(timeout, op)</text>
<rect x="247" y="396.7" width="72.1" height="20" rx="10" class="fk-f-canvas"/>
<text x="283" y="411" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">driver call</text>
<rect x="246.8" y="554.7" width="75.5" height="20" rx="10" class="fk-f-canvas"/>
<text x="284.5" y="569" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">WriteRead</text>
<rect x="246.8" y="693.7" width="121.3" height="20" rx="10" class="fk-f-canvas"/>
<text x="307.5" y="708" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">WriteRead(spans)</text>
<rect x="409" y="723.4" width="106" height="20" rx="10" class="fk-f-canvas"/>
<text x="462" y="737.7" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">ok or I2cFailure</text>
<rect x="408.8" y="584.4" width="114.4" height="20" rx="10" class="fk-f-canvas"/>
<text x="466" y="598.7" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">bool, failure kept</text>
<rect x="409.1" y="426.4" width="49.8" height="20" rx="10" class="fk-f-canvas"/>
<text x="434" y="440.7" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">Result</text>
<rect x="408.8" y="268.4" width="72.4" height="20" rx="10" class="fk-f-canvas"/>
<text x="445" y="282.7" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">kb::Result</text>
<rect x="32" y="856.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-magenta-tint fk-s-magenta-strong"/>
<text x="54" y="868.5" font-size="12.5" class="fk-f-muted">HAL</text>
<rect x="104.5" y="856.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-violet-tint fk-s-violet-strong"/>
<text x="126.5" y="868.5" font-size="12.5" class="fk-f-muted">handler and binding</text>
<rect x="274.9" y="856.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-green-tint fk-s-green-strong"/>
<text x="296.9" y="868.5" font-size="12.5" class="fk-f-muted">driver</text>
<rect x="357.3" y="856.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
<text x="379.3" y="868.5" font-size="12.5" class="fk-f-muted">MCU port</text>
<path d="M464 863.2L494 863.2" fill="none" stroke-width="1.6" marker-end="url(#call-sequence-arrow-rail)" class="fk-s-rail"/>
<text x="508" y="868.5" font-size="12.5" class="fk-f-muted">call</text>
<path d="M32 888.2L62 888.2" fill="none" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#call-sequence-arrow-rail)" class="fk-s-rail"/>
<text x="76" y="893.5" font-size="12.5" class="fk-f-muted">return</text>
