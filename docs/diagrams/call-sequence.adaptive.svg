<path d="M401 294.6 L401 232.6" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#call-sequence-arrow-violet-strong)" class="fk-s-violet-strong"/>
