<text x="245" y="164.6" font-size="15" font-weight="700" fill="#F1D5B5">tools/preflight.sh</text>
<text x="245" y="189.4" font-size="13" fill="#D2DAE4">local</text>
<text x="245" y="208.2" font-size="13" fill="#D2DAE4">before every push</text>
<text x="245" y="332.6" font-size="15" font-weight="700" fill="#F1D5B5">Pull request or push</text>
<text x="122" y="456.6" font-size="15" font-weight="700" fill="#BBF7D0">Always</text>
<text x="122" y="481.4" font-size="13" fill="#D2DAE4">repository checks</text>
<text x="122" y="500.3" font-size="13" fill="#D2DAE4">layering</text>
<text x="122" y="519.1" font-size="13" fill="#D2DAE4">layout and examples</text>
<text x="122" y="538" font-size="13" fill="#D2DAE4">own parts</text>
<text x="122" y="556.8" font-size="13" fill="#D2DAE4">MISRA level high</text>
<text x="122" y="575.7" font-size="13" fill="#D2DAE4">pin hygiene</text>
<text x="368" y="456.6" font-size="15" font-weight="700" fill="#BFDBFE">Path-gated</text>
<text x="368" y="481.4" font-size="13" fill="#D2DAE4">quality</text>
<text x="368" y="500.3" font-size="13" fill="#D2DAE4">integration</text>
<text x="368" y="519.1" font-size="13" fill="#D2DAE4">ESP-IDF port job</text>
<text x="368" y="538" font-size="13" fill="#D2DAE4">catalogue</text>
<text x="368" y="556.8" font-size="13" fill="#D2DAE4">on matching paths</text>
<text x="368" y="575.7" font-size="13" fill="#D2DAE4">main and tags</text>
<text x="368" y="699.5" font-size="15" font-weight="700" fill="#E8EDF3">Driver tests</text>
<text x="368" y="724.4" font-size="13" fill="#D2DAE4">never re-run here</text>
<text x="368" y="743.2" font-size="13" fill="#D2DAE4">trusted by pin hygiene</text>
<text x="122" y="699.5" font-size="15" font-weight="700" fill="#F8D27A">ru-ci-gate</text>
<text x="122" y="724.4" font-size="13" fill="#D2DAE4">the single required</text>
<text x="122" y="743.2" font-size="13" fill="#D2DAE4">check</text>
<text x="122" y="867.5" font-size="15" font-weight="700" fill="#F8D27A">Tag vX.Y.Z</text>
<text x="122" y="892.4" font-size="13" fill="#D2DAE4">release assets</text>
<text x="122" y="911.2" font-size="13" fill="#D2DAE4">SBOM, CVE scan</text>
<text x="122" y="1035.5" font-size="15" font-weight="700" fill="#F8D27A">Scheduled</text>
<text x="122" y="1060.4" font-size="13" fill="#D2DAE4">CVE re-scan</text>
<text x="122" y="1079.2" font-size="13" fill="#D2DAE4">tested set kb YYYY.N</text>
