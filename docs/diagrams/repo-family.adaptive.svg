<title id="repo-family-title">The kb repository family</title>
<desc id="repo-family-desc">Repository graph with consumers on top, in which the product application uses a board HAL built on kb-hal-common and an MCU port, both resting on kb-core, which pins the drivers, while planned tool repositories read kb-core.</desc>
