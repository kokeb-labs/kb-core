<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1099" viewBox="0 0 640 1099" role="img" aria-labelledby="assembler-flow-title assembler-flow-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="assembler-flow-title">From tags to a project</title>
<desc id="assembler-flow-desc">Driver and kb-core tags feed kb catalog build, which writes catalog.json; the resolver reads it and kb-image.yml and writes the lock and the project files; kb sbom turns the lock into SBOMs.</desc>
