<text x="122" y="186.3" font-size="15" font-weight="700" class="fk-f-blue-text">Release tags</text>
<text x="122" y="211.2" font-size="13" class="fk-f-ink2">driver.yml per driver</text>
<text x="122" y="230" font-size="13" class="fk-f-ink2">kb-core: platform, pins</text>
<text x="122" y="344.3" font-size="15" font-weight="700" class="fk-f-brown-text">kb catalog build</text>
<text x="122" y="369.1" font-size="13" class="fk-f-ink2">reads the tags</text>
<text x="122" y="483.3" font-size="15" font-weight="700" class="fk-f-green-text">catalog.json</text>
<text x="122" y="508.2" font-size="13" class="fk-f-ink2">every part at every</text>
<text x="122" y="527" font-size="13" class="fk-f-ink2">version</text>
<text x="368" y="483.3" font-size="15" font-weight="700" class="fk-f-blue-text">kb-image.yml</text>
<text x="368" y="508.2" font-size="13" class="fk-f-ink2">what the user picked</text>
<text x="368" y="527" font-size="13" class="fk-f-ink2">MCU, RTOS, drivers</text>
<text x="245" y="641.3" font-size="15" font-weight="700" class="fk-f-brown-text">Resolver</text>
<text x="245" y="666.2" font-size="13" class="fk-f-ink2">Python or JavaScript</text>
<text x="245" y="685" font-size="13" class="fk-f-ink2">one spec</text>
<text x="122" y="799.3" font-size="15" font-weight="700" class="fk-f-green-text">kb-image.lock.yml</text>
<text x="122" y="824.2" font-size="13" class="fk-f-ink2">every version</text>
<text x="122" y="843" font-size="13" class="fk-f-ink2">every tag</text>
<text x="122" y="861.9" font-size="13" class="fk-f-ink2">every SHA</text>
<text x="368" y="799.3" font-size="15" font-weight="700" class="fk-f-green-text">Project files</text>
<text x="368" y="824.2" font-size="13" class="fk-f-ink2">CMakePresets.json</text>
<text x="368" y="843" font-size="13" class="fk-f-ink2">kb_image.cmake</text>
<text x="368" y="861.9" font-size="13" class="fk-f-ink2">kb-fetch.sh</text>
<text x="122" y="976.3" font-size="15" font-weight="700" class="fk-f-brown-text">kb sbom</text>
<text x="122" y="1001.2" font-size="13" class="fk-f-ink2">CycloneDX 1.6</text>
<text x="122" y="1020" font-size="13" class="fk-f-ink2">SPDX 2.3</text>
