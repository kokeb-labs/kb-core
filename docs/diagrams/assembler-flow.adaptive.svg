<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">CONFIGURATOR</text>
<text x="32" y="77.3" font-size="26" font-weight="700" class="fk-f-ink">From tags to a project</text>
<text x="32" y="103.8" font-size="15" class="fk-f-muted">One resolver specification, implemented in Python and JavaScript, held to</text>
<text x="32" y="125.5" font-size="15" class="fk-f-muted">the same vectors.</text>
