<rect x="442.7" y="255.8" width="314.7" height="88" rx="10" fill="#151C26" stroke="#3A4657" stroke-width="1" stroke-dasharray="6 4"/>
<text x="52" y="164.6" font-size="15" font-weight="700" fill="#A7F3E6">DMA ring</text>
<text x="52" y="189.4" font-size="13" fill="#D2DAE4">in the buffer: 2 halves or N frames</text>
<text x="462.7" y="164.6" font-size="15" font-weight="700" fill="#DDD6FE">Interrupt</text>
<text x="462.7" y="189.4" font-size="13" fill="#D2DAE4">PublishFromDevice: invalidate, copy out,</text>
<text x="462.7" y="208.2" font-size="13" fill="#D2DAE4">seq, time, torn?</text>
<text x="873.3" y="164.6" font-size="15" font-weight="700" fill="#BFDBFE">Ring of slots</text>
<text x="873.3" y="189.4" font-size="13" fill="#D2DAE4">at least 2 slots</text>
<rect x="362.5" y="171.8" width="64.3" height="20" rx="10" fill="#0E131A"/>
<text x="394.7" y="186.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">interrupt</text>
<rect x="774.3" y="171.8" width="62.1" height="20" rx="10" fill="#0E131A"/>
<text x="805.3" y="186.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">slot free</text>
<text x="52" y="462.6" font-size="15" font-weight="700" fill="#BBF7D0">Fallback producer</text>
<text x="52" y="487.4" font-size="13" fill="#D2DAE4">frames flagged Fallback()</text>
<text x="462.7" y="462.6" font-size="15" font-weight="700" fill="#DDD6FE">Supervise</text>
<text x="462.7" y="487.4" font-size="13" fill="#D2DAE4">None, Restart, BackOff, UseFallback</text>
<text x="873.3" y="462.6" font-size="15" font-weight="700" fill="#BFDBFE">FrameView</text>
<text x="873.3" y="487.4" font-size="13" fill="#D2DAE4">move-only, releases on end</text>
<rect x="979.3" y="320.8" width="62.6" height="20" rx="10" fill="#0E131A"/>
<text x="1010.7" y="335.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">TryTake</text>
<rect x="780.2" y="460.3" width="50.2" height="20" rx="10" fill="#0E131A"/>
<text x="805.3" y="474.6" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Judge</text>
<rect x="364.7" y="460.3" width="60" height="20" rx="10" fill="#0E131A"/>
<text x="394.7" y="474.6" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">fallback</text>
<text x="462.7" y="282.6" font-size="15" font-weight="700" fill="#E8EDF3">Next frame: Gap()</text>
<text x="462.7" y="307.4" font-size="13" fill="#D2DAE4">every slot was held: the frame is dropped</text>
<text x="462.7" y="326.2" font-size="13" fill="#D2DAE4">and counted as Full</text>
<rect x="572.4" y="230.8" width="55.2" height="20" rx="10" fill="#0E131A"/>
<text x="600" y="245.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">all held</text>
<rect x="32" y="520.2" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="54" y="531.8" font-size="12.5" fill="#9AA6B5">hardware</text>
<rect x="137.4" y="520.2" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="159.4" y="531.8" font-size="12.5" fill="#9AA6B5">interrupt</text>
<rect x="236.7" y="520.2" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="258.7" y="531.8" font-size="12.5" fill="#9AA6B5">task</text>
<rect x="308.8" y="520.2" width="14" height="14" rx="4" fill="#321820" stroke="#FB7185" stroke-width="1.4"/>
<text x="330.8" y="531.8" font-size="12.5" fill="#9AA6B5">gap</text>
<rect x="378.4" y="520.2" width="14" height="14" rx="4" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<text x="400.4" y="531.8" font-size="12.5" fill="#9AA6B5">fallback</text>
</svg>
