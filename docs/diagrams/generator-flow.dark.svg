<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">CONFIGURATOR</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">Generators and the configurator</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">One resolver specification, two front ends, repeatable downloads. Items</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">marked later come in M6 and M7.</text>
<rect x="32" y="141.6" width="576" height="1" fill="#252F3C"/>
