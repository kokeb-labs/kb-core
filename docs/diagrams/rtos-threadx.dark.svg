<title id="rtos-threadx-title">The ThreadX backend</title>
<desc id="rtos-threadx-desc">The kb::rtos API and seam lead to two ThreadX backend files, and the boundary file reaches the ThreadX kernel, from a product's copy or the pinned submodule, which tests run on a fake kernel and on the Linux port.</desc>
