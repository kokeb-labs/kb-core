<text x="245" y="211.2" font-size="13" fill="#D2DAE4">Mutex, Queue, Thread</text>
<text x="245" y="230" font-size="13" fill="#D2DAE4">...</text>
<text x="245" y="344.3" font-size="15" font-weight="700" fill="#FDE68A">kb::rtos::backend</text>
<text x="245" y="369.1" font-size="13" fill="#D2DAE4">backend.hpp</text>
<text x="245" y="388" font-size="13" fill="#D2DAE4">the seam</text>
<text x="155" y="502.3" font-size="15" font-weight="700" fill="#FDE68A">threadx_isr.cpp</text>
<text x="155" y="527.2" font-size="13" fill="#D2DAE4">FromIsr with</text>
<text x="155" y="546" font-size="13" fill="#D2DAE4">TX_NO_WAIT</text>
