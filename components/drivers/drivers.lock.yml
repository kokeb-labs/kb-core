# The driver pins of this kb-core revision (ADR-0002, ADR-0012). One entry per submodule under components/drivers/; CI (pin
# hygiene) checks that each entry's commit equals the gitlink, that the tag points at that commit and matches
# vX.Y.Z or vX.Y.Z-rc.N (never a branch), that the tag's CI gate concluded success, and that the driver.yml at the
# tag agrees (name, version, mcus, peripheral, kb_core_min). Each release copies these entries into its release
# lock, next to kb-core's own commit SHA.
#
# Entry format:
#   - name: pf1550                                   # driver.yml name and the KB_ENABLE_<NAME> switch
#     repo: kokeb-labs-drivers/driver-pf1550
#     tag: v0.1.0                                    # or v0.1.0-rc.1
#     commit: <40-hex commit of the tag>
#     kind: release                                  # release | rc, agrees with the tag
