---
# kb-core ESP32 examples: the app matrix read by the ESP-IDF build scripts and CI (ci-esp32.yml).
version: "1.0"

metadata:
  project: "kb-core ESP32 examples"
  default_app: "kb_utils_smoke"
  target: "esp32c6"
  idf_versions: ["release/v5.5"]
  build_types: [["Debug", "Release"]]

apps:
  kb_utils_smoke:
    description: "kb::utils on target: CRC check values, byte packing, checked arithmetic, wrap-safe time"
    source_file: "kb_utils_smoke.cpp"
    category: "smoke"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true
    hardware_required: false
    features:
      - "No heap, no exceptions, no RTTI"

  kb_rtos_smoke:
    description: "kb::rtos over FreeRTOS: CRTP thread on a 10 ms grid, queue, mutex, event flags, timer, sleeps"
    source_file: "kb_rtos_smoke.cpp"
    category: "smoke"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true
    hardware_required: false
    features:
      - "Static allocation only; the FreeRTOS backend's boundary files on target"

build_config:
  build_types:
    Debug:
      description: "Debug build"
      cmake_build_type: "Debug"
      optimization: "-O0"
      debug_level: "-g3"
      defines: ["DEBUG"]
    Release:
      description: "Release build"
      cmake_build_type: "Release"
      optimization: "-O2"
      debug_level: "-g0"
      defines: ["NDEBUG"]
  build_directory_pattern: "build-app-{app_type}-type-{build_type}-target-{target}-idf-{idf_version}"
  project_name_pattern: "kb_esp32_{app_type}"

ci_config:
  timeout_minutes: 30
  fail_fast: false
  exclude_combinations: []
  special_apps: []
