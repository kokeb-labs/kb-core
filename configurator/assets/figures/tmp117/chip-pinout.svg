<title id="chip-pinout-title">TMP117 pinout, WSON-6</title>
<desc id="chip-pinout-desc">Pinout of the TMP117 in WSON-6, top view: 6 pins and an exposed pad, each with its name, its electrical type as a colour and the driver hook that uses it.</desc>
