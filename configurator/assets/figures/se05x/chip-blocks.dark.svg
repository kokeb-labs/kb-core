<text x="32" y="695.8" font-size="12.5" fill="#9AA6B5">* Not confirmed in the datasheet: the diagram: drawn from the functional description (sections 3 to 5) of the SE050 data sheet, which has no hardware block diagram; it shows the</text>
<text x="32" y="713.8" font-size="12.5" fill="#9AA6B5">SE050 and SE051 (same pin table); the SE052 has no ENA pin (SE052 Table 2, p. 4), so the power-switch block does not apply to it; pin IO2: the data sheet gives VOUT (note under</text>
<text x="32" y="731.8" font-size="12.5" fill="#9AA6B5">Table 5, p. 12) and VIN (Table 9 note 2, p. 13) as the reference of IO2.</text>
