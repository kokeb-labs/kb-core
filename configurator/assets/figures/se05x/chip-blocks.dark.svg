<text x="152" y="162.8" font-size="13" font-weight="700" fill="#E2E8F0">SE05X*</text>
<text x="217.1" y="162.8" font-size="12" fill="#E2E8F0">HX2QFN20</text>
<text x="196" y="228.6" font-size="15" font-weight="700" fill="#BFDBFE">I2C target</text>
<text x="196" y="253.4" font-size="13" fill="#D2DAE4">T=1 over I2C,</text>
<text x="196" y="272.2" font-size="13" fill="#D2DAE4">address 0x48</text>
<text x="532" y="228.6" font-size="15" font-weight="700" fill="#F8D27A">IoT applet</text>
<text x="532" y="253.4" font-size="13" fill="#D2DAE4">secure objects,</text>
<text x="532" y="272.2" font-size="13" fill="#D2DAE4">policies, 2 sessions</text>
<text x="868" y="228.6" font-size="15" font-weight="700" fill="#A7F3E6">Crypto and RNG</text>
<text x="868" y="253.4" font-size="13" fill="#D2DAE4">EC, RSA, AES, DRG.4</text>
<text x="868" y="272.2" font-size="13" fill="#D2DAE4">from a PTG.2 TRNG</text>
<text x="196" y="364.6" font-size="15" font-weight="700" fill="#E2E8F0">Power switch</text>
<text x="196" y="389.4" font-size="13" fill="#D2DAE4">ENA, VIN to VOUT,</text>
<text x="196" y="408.3" font-size="13" fill="#D2DAE4">deep power-down;</text>
<text x="196" y="427.1" font-size="13" fill="#D2DAE4">not on the SE052</text>
<text x="868" y="364.6" font-size="15" font-weight="700" fill="#DDD6FE">I2C controller</text>
<text x="868" y="389.4" font-size="13" fill="#D2DAE4">400 kHz, for a sensor</text>
<text x="196" y="540.5" font-size="15" font-weight="700" fill="#E2E8F0">ISO 7816 and</text>
<text x="196" y="560" font-size="15" font-weight="700" fill="#E2E8F0">14443</text>
<text x="196" y="584.9" font-size="13" fill="#D2DAE4">not enabled in</text>
<text x="196" y="603.8" font-size="13" fill="#D2DAE4">generic</text>
<text x="196" y="622.6" font-size="13" fill="#D2DAE4">configurations</text>
