<text x="232" y="162.8" font-size="13" font-weight="700" fill="#E2E8F0">BNO08X</text>
<text x="302.7" y="162.8" font-size="12" fill="#E2E8F0">LGA-28</text>
<text x="276" y="228.6" font-size="15" font-weight="700" fill="#BFDBFE">Host interface</text>
<text x="276" y="253.4" font-size="13" fill="#D2DAE4">I2C, SPI,</text>
<text x="276" y="272.2" font-size="13" fill="#D2DAE4">UART-SHTP,</text>
<text x="276" y="291.1" font-size="13" fill="#D2DAE4">UART-RVC</text>
<text x="572" y="228.6" font-size="15" font-weight="700" fill="#F8D27A">Cortex-M0+</text>
<text x="572" y="248.1" font-size="15" font-weight="700" fill="#F8D27A">and SH-2</text>
<text x="572" y="272.9" font-size="13" fill="#D2DAE4">MotionEngine,</text>
<text x="572" y="291.8" font-size="13" fill="#D2DAE4">SHTP, FRS flash</text>
<text x="868" y="228.6" font-size="15" font-weight="700" fill="#A7F3E6">Three MEMS</text>
<text x="868" y="248.1" font-size="15" font-weight="700" fill="#A7F3E6">sensors</text>
<text x="868" y="272.9" font-size="13" fill="#D2DAE4">accelerometer,</text>
<text x="868" y="291.8" font-size="13" fill="#D2DAE4">gyroscope,</text>
<text x="868" y="310.6" font-size="13" fill="#D2DAE4">magnetometer</text>
<text x="572" y="404.6" font-size="15" font-weight="700" fill="#FDE68A">Environmental</text>
<text x="572" y="424.1" font-size="15" font-weight="700" fill="#FDE68A">bus</text>
<text x="572" y="448.9" font-size="13" fill="#D2DAE4">pressure, light,</text>
<text x="572" y="467.8" font-size="13" fill="#D2DAE4">humidity,</text>
<text x="572" y="486.6" font-size="13" fill="#D2DAE4">proximity</text>
<text x="276" y="404.6" font-size="15" font-weight="700" fill="#E2E8F0">Reset, boot</text>
<text x="276" y="424.1" font-size="15" font-weight="700" fill="#E2E8F0">and clock</text>
<text x="276" y="448.9" font-size="13" fill="#D2DAE4">NRST, BOOTN,</text>
<text x="276" y="467.8" font-size="13" fill="#D2DAE4">PS1, PS0, 32.768</text>
<text x="276" y="486.6" font-size="13" fill="#D2DAE4">kHz</text>
<text x="868" y="404.6" font-size="15" font-weight="700" fill="#E2E8F0">Power</text>
<text x="868" y="429.4" font-size="13" fill="#D2DAE4">VDD, VDDIO, CAP</text>
<text x="202" y="246.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#E8EDF3">H_SCL/SCK/RX  19</text>
<text x="202" y="270.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#E8EDF3">H_SDA/H_MISO/TX  20</text>
<text x="202" y="294.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#E8EDF3">H_INTN  14</text>
