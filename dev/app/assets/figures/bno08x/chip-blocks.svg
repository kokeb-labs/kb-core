<text x="232" y="162.8" font-size="13" font-weight="700" fill="#334155">BNO08X</text>
<text x="302.7" y="162.8" font-size="12" fill="#334155">LGA-28</text>
<text x="276" y="228.6" font-size="15" font-weight="700" fill="#1E429F">Host interface</text>
<text x="276" y="253.4" font-size="13" fill="#2B3442">I2C, SPI,</text>
<text x="276" y="272.2" font-size="13" fill="#2B3442">UART-SHTP,</text>
<text x="276" y="291.1" font-size="13" fill="#2B3442">UART-RVC</text>
<text x="572" y="228.6" font-size="15" font-weight="700" fill="#7A360E">Cortex-M0+</text>
<text x="572" y="248.1" font-size="15" font-weight="700" fill="#7A360E">and SH-2</text>
<text x="572" y="272.9" font-size="13" fill="#2B3442">MotionEngine,</text>
<text x="572" y="291.8" font-size="13" fill="#2B3442">SHTP, FRS flash</text>
<text x="868" y="228.6" font-size="15" font-weight="700" fill="#0B5F59">Three MEMS</text>
<text x="868" y="248.1" font-size="15" font-weight="700" fill="#0B5F59">sensors</text>
<text x="868" y="272.9" font-size="13" fill="#2B3442">accelerometer,</text>
<text x="868" y="291.8" font-size="13" fill="#2B3442">gyroscope,</text>
<text x="868" y="310.6" font-size="13" fill="#2B3442">magnetometer</text>
<text x="572" y="404.6" font-size="15" font-weight="700" fill="#8A3C0B">Environmental</text>
<text x="572" y="424.1" font-size="15" font-weight="700" fill="#8A3C0B">bus</text>
<text x="572" y="448.9" font-size="13" fill="#2B3442">pressure, light,</text>
<text x="572" y="467.8" font-size="13" fill="#2B3442">humidity,</text>
<text x="572" y="486.6" font-size="13" fill="#2B3442">proximity</text>
<text x="276" y="404.6" font-size="15" font-weight="700" fill="#334155">Reset, boot</text>
<text x="276" y="424.1" font-size="15" font-weight="700" fill="#334155">and clock</text>
<text x="276" y="448.9" font-size="13" fill="#2B3442">NRST, BOOTN,</text>
<text x="276" y="467.8" font-size="13" fill="#2B3442">PS1, PS0, 32.768</text>
<text x="276" y="486.6" font-size="13" fill="#2B3442">kHz</text>
<text x="868" y="404.6" font-size="15" font-weight="700" fill="#334155">Power</text>
<text x="868" y="429.4" font-size="13" fill="#2B3442">VDD, VDDIO, CAP</text>
<text x="202" y="246.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">H_SCL/SCK/RX  19</text>
<text x="202" y="270.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">H_SDA/H_MISO/TX  20</text>
