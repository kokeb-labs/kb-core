<svg xmlns="http://www.w3.org/2000/svg" width="640" height="928" viewBox="0 0 640 928" role="img" aria-labelledby="call-sequence-title call-sequence-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="call-sequence-title">One call through the layers</title>
<desc id="call-sequence-desc">Call chain in which the HAL calls a guarded handler, which locks and calls the pf1550 driver, the driver calls the kb binding's WriteRead, which calls the ESP32 I2C device, and the results return the same way.</desc>
<defs><marker id="call-sequence-arrow-green-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ADE80"/></marker><marker id="call-sequence-arrow-magenta-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F0ABFC"/></marker><marker id="call-sequence-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker><marker id="call-sequence-arrow-teal-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2BB3A3"/></marker><marker id="call-sequence-arrow-violet-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A78BFA"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="927" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">ARCHITECTURE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">One call through the layers</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">A HAL reads a register of a PF1550 power IC. Only the last step knows it</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">runs on an ESP32.</text>
<rect x="32" y="141.6" width="576" height="1" fill="#252F3C"/>
<path d="M239 232.6 L239 294.6" fill="none" stroke="#F0ABFC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#call-sequence-arrow-magenta-strong)"/>
<path d="M239 390.6 L239 452.6" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#call-sequence-arrow-violet-strong)"/>
<path d="M239 548.5 L239 610.5" fill="none" stroke="#4ADE80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#call-sequence-arrow-green-strong)"/>
<path d="M239 687.5 L239 749.5" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#call-sequence-arrow-violet-strong)"/>
<path d="M401 749.5 L401 687.5" fill="none" stroke="#2BB3A3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#call-sequence-arrow-teal-strong)"/>
<path d="M401 610.5 L401 548.5" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#call-sequence-arrow-violet-strong)"/>
<path d="M401 452.6 L401 390.6" fill="none" stroke="#4ADE80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#call-sequence-arrow-green-strong)"/>
<path d="M401 294.6 L401 232.6" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#call-sequence-arrow-violet-strong)"/>
<rect x="225" y="159.6" width="190" height="69" rx="10" fill="#2E1533" stroke="#F0ABFC" stroke-width="1.4"/>
<rect x="225" y="167.6" width="4" height="53" rx="2" fill="#F0ABFC"/>
<rect x="225" y="298.6" width="190" height="88" rx="10" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<rect x="225" y="306.6" width="4" height="72" rx="2" fill="#A78BFA"/>
<rect x="225" y="456.6" width="190" height="88" rx="10" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<rect x="225" y="464.6" width="4" height="72" rx="2" fill="#4ADE80"/>
<rect x="225" y="614.5" width="190" height="69" rx="10" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<rect x="225" y="622.5" width="4" height="53" rx="2" fill="#A78BFA"/>
<rect x="225" y="753.5" width="190" height="88" rx="10" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<rect x="225" y="761.5" width="4" height="72" rx="2" fill="#2BB3A3"/>
<text x="245" y="186.3" font-size="15" font-weight="700" fill="#F5D0FE">HAL</text>
<text x="245" y="211.2" font-size="13" fill="#D2DAE4">reads a register</text>
<text x="245" y="325.3" font-size="15" font-weight="700" fill="#DDD6FE">Guarded handler</text>
<text x="245" y="350.1" font-size="13" fill="#D2DAE4">handler lock, then bus</text>
<text x="245" y="369" font-size="13" fill="#D2DAE4">lock</text>
<text x="245" y="483.3" font-size="15" font-weight="700" fill="#BBF7D0">pf1550 driver</text>
<text x="245" y="508.2" font-size="13" fill="#D2DAE4">calls its WriteRead</text>
<text x="245" y="527" font-size="13" fill="#D2DAE4">hook</text>
<text x="245" y="641.3" font-size="15" font-weight="700" fill="#DDD6FE">kb binding</text>
<text x="245" y="666.2" font-size="13" fill="#D2DAE4">Pf1550Port</text>
<text x="245" y="780.3" font-size="15" font-weight="700" fill="#A7F3E6">ESP32 I2cDevice</text>
<text x="245" y="805.2" font-size="13" fill="#D2DAE4">the only step that</text>
<text x="245" y="824" font-size="13" fill="#D2DAE4">knows the MCU</text>
<rect x="246.9" y="238.7" width="113.1" height="20" rx="10" fill="#0E131A"/>
<text x="303.5" y="253" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Call(timeout, op)</text>
<rect x="247" y="396.7" width="72.1" height="20" rx="10" fill="#0E131A"/>
<text x="283" y="411" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">driver call</text>
<rect x="246.8" y="554.7" width="75.5" height="20" rx="10" fill="#0E131A"/>
<text x="284.5" y="569" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">WriteRead</text>
<rect x="246.8" y="693.7" width="121.3" height="20" rx="10" fill="#0E131A"/>
<text x="307.5" y="708" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">WriteRead(spans)</text>
<rect x="409" y="723.4" width="106" height="20" rx="10" fill="#0E131A"/>
<text x="462" y="737.7" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">ok or I2cFailure</text>
<rect x="408.8" y="584.4" width="114.4" height="20" rx="10" fill="#0E131A"/>
<text x="466" y="598.7" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">bool, failure kept</text>
<rect x="409.1" y="426.4" width="49.8" height="20" rx="10" fill="#0E131A"/>
<text x="434" y="440.7" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Result</text>
<rect x="408.8" y="268.4" width="72.4" height="20" rx="10" fill="#0E131A"/>
<text x="445" y="282.7" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">kb::Result</text>
<rect x="32" y="856.9" width="14" height="14" rx="4" fill="#2E1533" stroke="#F0ABFC" stroke-width="1.4"/>
<text x="54" y="868.5" font-size="12.5" fill="#9AA6B5">HAL</text>
<rect x="104.5" y="856.9" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="126.5" y="868.5" font-size="12.5" fill="#9AA6B5">handler and binding</text>
<rect x="274.9" y="856.9" width="14" height="14" rx="4" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<text x="296.9" y="868.5" font-size="12.5" fill="#9AA6B5">driver</text>
<rect x="357.3" y="856.9" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="379.3" y="868.5" font-size="12.5" fill="#9AA6B5">MCU port</text>
<path d="M464 863.2L494 863.2" fill="none" stroke="#6C7889" stroke-width="1.6" marker-end="url(#call-sequence-arrow-rail)"/>
<text x="508" y="868.5" font-size="12.5" fill="#9AA6B5">call</text>
<path d="M32 888.2L62 888.2" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#call-sequence-arrow-rail)"/>
<text x="76" y="893.5" font-size="12.5" fill="#9AA6B5">return</text>
</svg>
