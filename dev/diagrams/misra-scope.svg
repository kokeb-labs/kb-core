<text x="48" y="162.8" font-size="13" font-weight="700" fill="#14532D">CLAIMED COMPLIANT</text>
<text x="48" y="180.2" font-size="12" fill="#14532D">kb-core own code, components/lib/**, zero repository deviations</text>
<text x="68" y="223" font-size="15" font-weight="700" fill="#7A360E">kb::utils</text>
<text x="68" y="247.8" font-size="13" fill="#2B3442">phase 1</text>
<text x="348.5" y="223" font-size="15" font-weight="700" fill="#1E429F">kb::interfaces</text>
<text x="348.5" y="247.8" font-size="13" fill="#2B3442">contracts and host port, phase 1</text>
<text x="629" y="223" font-size="15" font-weight="700" fill="#8A3C0B">kb::rtos</text>
<text x="629" y="247.8" font-size="13" fill="#2B3442">public API, phase 2</text>
<text x="909.5" y="223" font-size="15" font-weight="700" fill="#5B21B6">kb::handlers</text>
<text x="909.5" y="247.8" font-size="13" fill="#2B3442">handlers and bindings, phase 4</text>
<text x="48" y="362.2" font-size="13" font-weight="700" fill="#8A3C0B">BOUNDARY FILES</text>
<text x="48" y="379.6" font-size="12" fill="#8A3C0B">compliant with recorded deviations (DEV-KBC-*, DEV-KBP-*)</text>
<text x="68" y="422.4" font-size="15" font-weight="700" fill="#0E1726">RTOS backend boundary files</text>
<text x="68" y="446.5" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">components/lib/rtos/backends/freertos/*_boundary.cpp</text>
<text x="629" y="422.4" font-size="15" font-weight="700" fill="#0E1726">Port boundary files</text>
<text x="629" y="446.5" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">components/ports/esp32/src/*_boundary.cpp (own records)</text>
<text x="48" y="560.6" font-size="13" font-weight="700" fill="#1E429F">COVERED BY THEIR OWN EVIDENCE</text>
<text x="68" y="603.4" font-size="15" font-weight="700" fill="#14532D">driver-&lt;chip&gt; at its pinned tag</text>
<text x="68" y="628.2" font-size="13" fill="#2B3442">own ru-misra run at level high</text>
<text x="48" y="742.6" font-size="13" font-weight="700" fill="#334155">SOUP, OUT OF SCOPE</text>
<text x="68" y="785.3" font-size="15" font-weight="700" fill="#0E1726">Vendor and third-party code</text>
<text x="68" y="810.2" font-size="13" fill="#2B3442">ESP-IDF, STM32 HAL, FreeRTOS, ThreadX, mbedTLS, listed with versions</text>
<rect x="879.7" y="299.2" width="176.6" height="20" rx="10" fill="#FFFFFF"/>
<text x="968" y="313.5" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">includes the boundary files</text>
<rect x="886.4" y="679.6" width="163.2" height="20" rx="10" fill="#FFFFFF"/>
<text x="968" y="693.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">-isystem, never reported</text>
