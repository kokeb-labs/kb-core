<title id="misra-scope-title">MISRA C++:2023 scope</title>
<desc id="misra-scope-desc">Four zones from strongest claim to none: kb-core own code claimed compliant with zero deviations; boundary files compliant with recorded deviations; drivers covered by their own evidence; SOUP out of scope and never reported.</desc>
