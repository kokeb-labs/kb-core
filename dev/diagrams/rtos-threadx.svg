<text x="52" y="164.6" font-size="15" font-weight="700" fill="#8A3C0B">kb::rtos API</text>
<text x="52" y="189.4" font-size="13" fill="#2B3442">Mutex, RecursiveMutex, Semaphore, Queue,</text>
<text x="52" y="208.2" font-size="13" fill="#2B3442">EventFlags, Timer, Thread, CriticalSection</text>
<text x="451.9" y="164.6" font-size="15" font-weight="700" fill="#8A3C0B">kb::rtos::backend</text>
<text x="451.9" y="189.4" font-size="13" fill="#2B3442">backend.hpp, the seam</text>
<text x="52" y="322.6" font-size="15" font-weight="700" fill="#8A3C0B">threadx_isr.cpp</text>
<text x="52" y="347.4" font-size="13" fill="#2B3442">every FromIsr call is the same call with</text>
<text x="52" y="366.2" font-size="13" fill="#2B3442">TX_NO_WAIT</text>
<text x="444" y="322.6" font-size="15" font-weight="700" fill="#8A3C0B">threadx_boundary.cpp</text>
<text x="444" y="347.4" font-size="13" fill="#2B3442">the only boundary file; creates objects on</text>
<text x="444" y="366.2" font-size="13" fill="#2B3442">kb-owned control blocks and stacks</text>
<text x="836" y="322.6" font-size="15" font-weight="700" fill="#6B3F17">Fake kernel</text>
<text x="836" y="347.4" font-size="13" fill="#2B3442">tests/fakes/threadx: contract and seam, exact</text>
<text x="836" y="366.2" font-size="13" fill="#2B3442">ticks (kb_rtos_tests_threadx)</text>
<text x="68" y="521.5" font-size="15" font-weight="700" fill="#334155">Pinned submodule</text>
<text x="68" y="546.4" font-size="13" fill="#2B3442">third_party/threadx at a release tag; KB_THREADX_PORT = cortex_m0,</text>
<text x="68" y="565.2" font-size="13" fill="#2B3442">cortex_m4, cortex_m7 or linux</text>
<text x="629" y="521.5" font-size="15" font-weight="700" fill="#334155">A product's copy</text>
<text x="629" y="546.4" font-size="13" fill="#2B3442">KB_THREADX_INCLUDE_DIRS: STM32Cube or a vendor SDK</text>
<text x="48" y="478.8" font-size="13" font-weight="700" fill="#334155">THREADX KERNEL</text>
<text x="184.6" y="478.8" font-size="12" fill="#334155">SOUP, never edited</text>
<rect x="559.7" y="408.8" width="80.6" height="20" rx="10" fill="#FFFFFF"/>
<text x="600" y="423.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">tx_*_create</text>
<text x="68" y="685.5" font-size="15" font-weight="700" fill="#6B3F17">Linux port</text>
<text x="68" y="710.4" font-size="13" fill="#2B3442">threaded suite with priority inheritance</text>
<rect x="229.8" y="618.8" width="179.5" height="20" rx="10" fill="#FFFFFF"/>
<text x="319.5" y="633.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">kb_rtos_tests_threadx_linux</text>
<rect x="32" y="743.2" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="54" y="754.8" font-size="12.5" fill="#566070">kb::rtos</text>
<rect x="125.3" y="743.2" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="147.3" y="754.8" font-size="12.5" fill="#566070">SOUP and planned</text>
<rect x="289.3" y="743.2" width="14" height="14" rx="4" fill="#F8F1EA" stroke="#7C4A1E" stroke-width="1.4"/>
