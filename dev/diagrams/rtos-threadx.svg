<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">The ThreadX backend</text>
<text x="32" y="103.8" font-size="15" fill="#566070">One boundary file between the kb::rtos seam and the kernel, three ways to get the kernel.</text>
