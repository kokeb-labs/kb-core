<text x="500.6" y="303.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">handler lock, then bus lock</text>
<rect x="450.4" y="329.8" width="72.1" height="20" rx="10" fill="#FFFFFF"/>
<text x="486.4" y="344.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">driver call</text>
