<text x="148.6" y="173.8" font-size="15" font-weight="700" text-anchor="middle" fill="#86198F">HAL</text>
<text x="375.8" y="173.8" font-size="15" font-weight="700" text-anchor="middle" fill="#5B21B6">Guarded handler</text>
<text x="603" y="173.8" font-size="15" font-weight="700" text-anchor="middle" fill="#14532D">pf1550 driver</text>
