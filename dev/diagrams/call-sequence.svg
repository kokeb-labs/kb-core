<text x="940.8" y="460.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">WriteRead(addr, span, span)</text>
<rect x="885.9" y="503.8" width="109.9" height="20" rx="10" fill="#FFFFFF"/>
<text x="940.8" y="518.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">ok, or I2cFailure</text>
