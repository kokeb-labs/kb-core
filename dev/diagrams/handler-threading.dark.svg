<text x="68" y="223" font-size="15" font-weight="700" fill="#F1D5B5">Other tasks</text>
<text x="68" y="247.8" font-size="13" fill="#D2DAE4">Latest(): lock-free copy</text>
<text x="68" y="266.6" font-size="13" fill="#D2DAE4">Request(cmd, timeout): post, wait</text>
<text x="68" y="363" font-size="15" font-weight="700" fill="#BFDBFE">SeqlockSnapshot</text>
<text x="68" y="387.8" font-size="13" fill="#D2DAE4">published each step</text>
<text x="348" y="363" font-size="15" font-weight="700" fill="#BFDBFE">Command queue</text>
<text x="348" y="387.8" font-size="13" fill="#D2DAE4">drained, bounded</text>
<rect x="150.6" y="300.2" width="58.8" height="20" rx="10" fill="#0E131A"/>
<text x="180" y="314.5" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Latest()</text>
<rect x="424.4" y="300.2" width="71.3" height="20" rx="10" fill="#0E131A"/>
<text x="460" y="314.5" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Request()</text>
<text x="68" y="483.9" font-size="15" font-weight="700" fill="#F1D5B5">Owner task</text>
<text x="68" y="508.8" font-size="13" fill="#D2DAE4">fixed-rate Thread, calls Service(now)</text>
<rect x="144.7" y="421.2" width="70.6" height="20" rx="10" fill="#0E131A"/>
<text x="180" y="435.5" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">publishes</text>
<rect x="435.1" y="421.2" width="49.7" height="20" rx="10" fill="#0E131A"/>
<text x="460" y="435.5" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">drains</text>
<text x="68" y="605" font-size="15" font-weight="700" fill="#DDD6FE">Handler A</text>
<text x="68" y="629.8" font-size="13" fill="#D2DAE4">single-threaded core</text>
<text x="348" y="605" font-size="15" font-weight="700" fill="#DDD6FE">Handler B</text>
<text x="348" y="629.8" font-size="13" fill="#D2DAE4">single-threaded core</text>
<text x="68" y="726" font-size="15" font-weight="700" fill="#A7F3E6">BusDomain&lt;SPI1, Owner&gt;</text>
<text x="68" y="750.8" font-size="13" fill="#D2DAE4">no mutex, owner check</text>
<text x="48" y="162.8" font-size="13" font-weight="700" fill="#DDD6FE">MODEL O: OWNER TASK</text>
<text x="48" y="180.2" font-size="12" fill="#DDD6FE">default for real-time buses</text>
<text x="68" y="905.3" font-size="15" font-weight="700" fill="#F1D5B5">Task X</text>
<text x="348" y="905.3" font-size="15" font-weight="700" fill="#F1D5B5">Task Y</text>
<text x="68" y="1001.3" font-size="15" font-weight="700" fill="#DDD6FE">Guarded&lt;Handler C&gt;</text>
<text x="68" y="1026.2" font-size="13" fill="#D2DAE4">handler lock</text>
<text x="348" y="1001.3" font-size="15" font-weight="700" fill="#DDD6FE">Guarded&lt;Handler D&gt;</text>
<text x="348" y="1026.2" font-size="13" fill="#D2DAE4">handler lock</text>
<rect x="123.4" y="938.6" width="113.1" height="20" rx="10" fill="#0E131A"/>
<text x="180" y="952.9" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Call(timeout, op)</text>
<rect x="403.4" y="938.6" width="113.1" height="20" rx="10" fill="#0E131A"/>
<text x="460" y="952.9" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Call(timeout, op)</text>
<text x="68" y="1122.3" font-size="15" font-weight="700" fill="#A7F3E6">BusDomain&lt;I2C0, Guarded&gt;</text>
<text x="68" y="1147.2" font-size="13" fill="#D2DAE4">mutex, recovery, statistics</text>
<rect x="133.2" y="1059.6" width="93.6" height="20" rx="10" fill="#0E131A"/>
<text x="180" y="1073.9" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">then bus lock</text>
<text x="48" y="845.2" font-size="13" font-weight="700" fill="#DDD6FE">MODEL G: GUARDED FACADE</text>
<text x="48" y="862.6" font-size="12" fill="#DDD6FE">slow, sporadic devices</text>
<text x="46" y="1235.3" font-size="15" font-weight="700" fill="#E2E8F0">Interrupts</text>
<text x="46" y="1253.1" font-size="13" fill="#E2E8F0">An ISR only sets event flags or notifies the owner task. It never calls a handler.</text>
<rect x="32" y="1284.5" width="14" height="14" rx="4" fill="#2A1F14" stroke="#D6A26B" stroke-width="1.4"/>
<text x="54" y="1296.1" font-size="12.5" fill="#9AA6B5">task</text>
<rect x="104" y="1284.5" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="126" y="1296.1" font-size="12.5" fill="#9AA6B5">shared state</text>
<rect x="227.7" y="1284.5" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="249.7" y="1296.1" font-size="12.5" fill="#9AA6B5">handler</text>
<rect x="320.8" y="1284.5" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="342.8" y="1296.1" font-size="12.5" fill="#9AA6B5">bus domain</text>
</svg>
