<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">TESTING</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">The CI flow</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Every CI job has a local equivalent in tools/preflight.sh, run before any push.</text>
