<text x="245" y="164.6" font-size="15" font-weight="700" class="fk-f-brown-text">tools/preflight.sh</text>
<text x="245" y="189.4" font-size="13" class="fk-f-ink2">local</text>
<text x="245" y="208.2" font-size="13" class="fk-f-ink2">before every push</text>
<text x="245" y="332.6" font-size="15" font-weight="700" class="fk-f-brown-text">Pull request or push</text>
<text x="122" y="456.6" font-size="15" font-weight="700" class="fk-f-green-text">Always</text>
<text x="122" y="481.4" font-size="13" class="fk-f-ink2">repository checks</text>
<text x="122" y="500.3" font-size="13" class="fk-f-ink2">layering</text>
<text x="122" y="519.1" font-size="13" class="fk-f-ink2">layout and examples</text>
<text x="122" y="538" font-size="13" class="fk-f-ink2">own parts</text>
<text x="122" y="556.8" font-size="13" class="fk-f-ink2">MISRA level high</text>
<text x="122" y="575.7" font-size="13" class="fk-f-ink2">pin hygiene</text>
<text x="368" y="456.6" font-size="15" font-weight="700" class="fk-f-blue-text">Path-gated</text>
<text x="368" y="481.4" font-size="13" class="fk-f-ink2">quality</text>
<text x="368" y="500.3" font-size="13" class="fk-f-ink2">integration</text>
<text x="368" y="519.1" font-size="13" class="fk-f-ink2">ESP-IDF port job</text>
<text x="368" y="538" font-size="13" class="fk-f-ink2">catalogue</text>
<text x="368" y="556.8" font-size="13" class="fk-f-ink2">on matching paths</text>
<text x="368" y="575.7" font-size="13" class="fk-f-ink2">main and tags</text>
<text x="368" y="699.5" font-size="15" font-weight="700" class="fk-f-ink">Driver tests</text>
<text x="368" y="724.4" font-size="13" class="fk-f-ink2">never re-run here</text>
<text x="368" y="743.2" font-size="13" class="fk-f-ink2">trusted by pin hygiene</text>
<text x="122" y="699.5" font-size="15" font-weight="700" class="fk-f-brand-text">ru-ci-gate</text>
<text x="122" y="724.4" font-size="13" class="fk-f-ink2">the single required</text>
<text x="122" y="743.2" font-size="13" class="fk-f-ink2">check</text>
<text x="122" y="867.5" font-size="15" font-weight="700" class="fk-f-brand-text">Tag vX.Y.Z</text>
<text x="122" y="892.4" font-size="13" class="fk-f-ink2">release assets</text>
<text x="122" y="911.2" font-size="13" class="fk-f-ink2">SBOM, CVE scan</text>
<text x="122" y="1035.5" font-size="15" font-weight="700" class="fk-f-brand-text">Scheduled</text>
<text x="122" y="1060.4" font-size="13" class="fk-f-ink2">CVE re-scan</text>
<text x="122" y="1079.2" font-size="13" class="fk-f-ink2">tested set kb YYYY.N</text>
