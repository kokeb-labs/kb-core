<text x="54" y="1123.8" font-size="12.5" class="fk-f-muted">start</text>
<rect x="106.1" y="1112.2" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-green-tint fk-s-green-strong"/>
<text x="128.1" y="1123.8" font-size="12.5" class="fk-f-muted">always</text>
