<svg xmlns="http://www.w3.org/2000/svg" width="654" height="904" viewBox="0 0 654 904" role="img" aria-labelledby="async-poll-title async-poll-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="async-poll-title">One asynchronous read</title>
<desc id="async-poll-desc">Sequence in which the owner task starts a read through the poller and the port in pass n, polls and gets Pending, the interrupt completes the transfer, and in pass n+1 the poll returns Done with the byte count.</desc>
