<rect x="48" y="632.2" width="524" height="69" rx="10" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4" stroke-dasharray="6 4"/>
<rect x="628" y="196.2" width="524" height="69" rx="10" fill="#F8F1EA" stroke="#7C4A1E" stroke-width="1.4"/>
<rect x="628" y="204.2" width="4" height="53" rx="2" fill="#7C4A1E"/>
<rect x="628" y="305.2" width="524" height="69" rx="10" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="628" y="313.2" width="4" height="53" rx="2" fill="#0B7A72"/>
<rect x="628" y="414.2" width="524" height="69" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<rect x="628" y="422.2" width="4" height="53" rx="2" fill="#7C3AED"/>
<rect x="628" y="523.2" width="524" height="69" rx="10" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="68" y="223" font-size="15" font-weight="700" fill="#6B3F17">Task X</text>
<text x="68" y="247.8" font-size="13" fill="#2B3442">Guarded::Hold(timeout)</text>
<text x="68" y="332" font-size="15" font-weight="700" fill="#5B21B6">1: handler mutex</text>
<text x="68" y="356.8" font-size="13" fill="#2B3442">bounded wait</text>
<text x="68" y="440.9" font-size="15" font-weight="700" fill="#0B5F59">2: BusDomain::Hold</text>
<text x="68" y="465.8" font-size="13" fill="#2B3442">bus mutex, bounded wait</text>
<text x="68" y="550" font-size="15" font-weight="700" fill="#5B21B6">GuardedHeld</text>
<text x="68" y="574.8" font-size="13" fill="#2B3442">Request, Sample ... many calls, nothing in between</text>
<text x="68" y="659" font-size="15" font-weight="700" fill="#9F1239">Task Y: plain Request</text>
<text x="68" y="683.8" font-size="13" fill="#2B3442">waits (bounded) or returns Timeout</text>
<text x="648" y="223" font-size="15" font-weight="700" fill="#6B3F17">Owner task, between passes</text>
<text x="648" y="247.8" font-size="13" fill="#2B3442">BusDomain::Hold(): never waits</text>
<text x="648" y="332" font-size="15" font-weight="700" fill="#0B5F59">Pass flag</text>
<text x="648" y="356.8" font-size="13" fill="#2B3442">set while the hold is held</text>
<text x="648" y="440.9" font-size="15" font-weight="700" fill="#5B21B6">OwnerAccess::Held(hold)</text>
<text x="648" y="465.8" font-size="13" fill="#2B3442">inline calls, several handlers</text>
<text x="648" y="550" font-size="15" font-weight="700" fill="#9F1239">Service(now, ...)</text>
<text x="648" y="574.8" font-size="13" fill="#2B3442">Busy while held; the violation is counted</text>
<text x="48" y="162.8" font-size="13" font-weight="700" fill="#5B21B6">GUARDED BUS</text>
<text x="48" y="180.2" font-size="12" fill="#5B21B6">handler lock, then bus lock</text>
<text x="628" y="162.8" font-size="13" font-weight="700" fill="#5B21B6">OWNER BUS</text>
<text x="628" y="180.2" font-size="12" fill="#5B21B6">the pass flag</text>
<rect x="32" y="734.6" width="14" height="14" rx="4" fill="#F8F1EA" stroke="#7C4A1E" stroke-width="1.4"/>
<text x="54" y="746.2" font-size="12.5" fill="#566070">task</text>
<rect x="104" y="734.6" width="14" height="14" rx="4" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="126" y="746.2" font-size="12.5" fill="#566070">handler</text>
<rect x="197.2" y="734.6" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="219.2" y="746.2" font-size="12.5" fill="#566070">bus domain</text>
<rect x="316" y="734.6" width="14" height="14" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="338" y="746.2" font-size="12.5" fill="#566070">excluded</text>
</svg>
