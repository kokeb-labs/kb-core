<rect x="48" y="204.2" width="4" height="53" rx="2" fill="#7C4A1E"/>
<rect x="48" y="305.2" width="524" height="69" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<rect x="48" y="313.2" width="4" height="53" rx="2" fill="#7C3AED"/>
