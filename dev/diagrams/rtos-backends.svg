<svg xmlns="http://www.w3.org/2000/svg" width="670" height="881" viewBox="0 0 670 881" role="img" aria-labelledby="rtos-backends-title rtos-backends-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="rtos-backends-title">kb::rtos backends</title>
<desc id="rtos-backends-desc">The kb::rtos API reaches one backend through a single seam, none, FreeRTOS, ThreadX or host for tests, and FreeRTOS and ThreadX reach their kernel, which is SOUP, through boundary files and are tested on fake kernels.</desc>
