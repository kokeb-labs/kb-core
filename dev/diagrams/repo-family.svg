<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="919" viewBox="0 0 1200 919" role="img" aria-labelledby="repo-family-title repo-family-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="repo-family-title">The kb repository family</title>
<desc id="repo-family-desc">Repository graph with consumers on top: the product application uses a product board HAL, which uses kb-hal-common and an MCU port; both depend on kb-core, which pins the drivers. The configurator reads kb-core releases and fills the application template; tested version sets list sets of kb-core.</desc>
