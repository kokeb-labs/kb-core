<text x="245" y="164.6" font-size="15" font-weight="700" fill="#6B3F17">tools/preflight.sh</text>
<text x="245" y="189.4" font-size="13" fill="#2B3442">local</text>
<text x="245" y="208.2" font-size="13" fill="#2B3442">before every push</text>
<text x="245" y="332.6" font-size="15" font-weight="700" fill="#6B3F17">Pull request or push</text>
<text x="122" y="456.6" font-size="15" font-weight="700" fill="#14532D">Always</text>
<text x="122" y="481.4" font-size="13" fill="#2B3442">repository checks</text>
<text x="122" y="500.3" font-size="13" fill="#2B3442">layering</text>
<text x="122" y="519.1" font-size="13" fill="#2B3442">layout and examples</text>
<text x="122" y="538" font-size="13" fill="#2B3442">own parts</text>
<text x="122" y="556.8" font-size="13" fill="#2B3442">MISRA level high</text>
<text x="122" y="575.7" font-size="13" fill="#2B3442">pin hygiene</text>
<text x="368" y="456.6" font-size="15" font-weight="700" fill="#1E429F">Path-gated</text>
<text x="368" y="481.4" font-size="13" fill="#2B3442">quality</text>
<text x="368" y="500.3" font-size="13" fill="#2B3442">integration</text>
<text x="368" y="519.1" font-size="13" fill="#2B3442">ESP-IDF port job</text>
<text x="368" y="538" font-size="13" fill="#2B3442">catalogue</text>
<text x="368" y="556.8" font-size="13" fill="#2B3442">on matching paths</text>
<text x="368" y="575.7" font-size="13" fill="#2B3442">main and tags</text>
<text x="368" y="699.5" font-size="15" font-weight="700" fill="#0E1726">Driver tests</text>
<text x="368" y="724.4" font-size="13" fill="#2B3442">never re-run here</text>
<text x="368" y="743.2" font-size="13" fill="#2B3442">trusted by pin hygiene</text>
<text x="122" y="699.5" font-size="15" font-weight="700" fill="#7A360E">ru-ci-gate</text>
<text x="122" y="724.4" font-size="13" fill="#2B3442">the single required</text>
<text x="122" y="743.2" font-size="13" fill="#2B3442">check</text>
<text x="122" y="867.5" font-size="15" font-weight="700" fill="#7A360E">Tag vX.Y.Z</text>
<text x="122" y="892.4" font-size="13" fill="#2B3442">release assets</text>
<text x="122" y="911.2" font-size="13" fill="#2B3442">SBOM, CVE scan</text>
<text x="122" y="1035.5" font-size="15" font-weight="700" fill="#7A360E">Scheduled</text>
<text x="122" y="1060.4" font-size="13" fill="#2B3442">CVE re-scan</text>
<text x="122" y="1079.2" font-size="13" fill="#2B3442">tested set kb YYYY.N</text>
