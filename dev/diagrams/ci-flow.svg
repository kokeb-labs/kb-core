<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1158" viewBox="0 0 640 1158" role="img" aria-labelledby="ci-flow-title ci-flow-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="ci-flow-title">The CI flow</title>
<desc id="ci-flow-desc">Flow from the local preflight to a pull request, then always-run and path-gated checks into one required gate, with the drivers' own tests never re-run, and a tag producing the release assets that a schedule re-scans.</desc>
