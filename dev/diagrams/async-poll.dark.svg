<text x="177" y="173.8" font-size="15" font-weight="700" text-anchor="middle" fill="#F1D5B5">Owner task (service pass)</text>
<text x="461" y="164.1" font-size="15" font-weight="700" text-anchor="middle" fill="#DDD6FE">AsyncPoller (owns the</text>
<text x="461" y="183.6" font-size="15" font-weight="700" text-anchor="middle" fill="#DDD6FE">buffers)</text>
<text x="745" y="173.8" font-size="15" font-weight="700" text-anchor="middle" fill="#A7F3E6">Port (I2cAsync / SpiAsync)</text>
<text x="1029" y="173.8" font-size="15" font-weight="700" text-anchor="middle" fill="#A7F3E6">Peripheral ISR</text>
<rect x="229.7" y="213.8" width="172.5" height="20" rx="10" fill="#0E131A"/>
<text x="316" y="228.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">pass n: StartWriteRead(...)</text>
<rect x="507" y="271.8" width="186" height="20" rx="10" fill="#0E131A"/>
<text x="600" y="286.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">StartWriteRead(..., Deadline)</text>
<rect x="561.3" y="329.8" width="77.3" height="20" rx="10" fill="#0E131A"/>
<text x="600" y="344.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Ok at once</text>
<rect x="254.9" y="387.8" width="122.2" height="20" rx="10" fill="#0E131A"/>
<text x="316" y="402.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">pass n: Step(now)</text>
<rect x="565.2" y="445.8" width="69.5" height="20" rx="10" fill="#0E131A"/>
<text x="600" y="460.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Poll(now)</text>
<rect x="569.1" y="503.8" width="61.9" height="20" rx="10" fill="#0E131A"/>
<text x="600" y="518.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Pending</text>
<rect x="791.8" y="561.8" width="184.3" height="20" rx="10" fill="#0E131A"/>
<text x="884" y="576.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">transfer done, event flag set</text>
<rect x="248" y="619.8" width="136" height="20" rx="10" fill="#0E131A"/>
<text x="316" y="634.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">pass n+1: Step(now)</text>
<rect x="565.2" y="677.8" width="69.5" height="20" rx="10" fill="#0E131A"/>
<text x="600" y="692.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Poll(now)</text>
<rect x="545" y="735.8" width="110" height="20" rx="10" fill="#0E131A"/>
<text x="600" y="750.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Done, Ok, count</text>
<rect x="225" y="793.8" width="182" height="20" rx="10" fill="#0E131A"/>
<text x="316" y="808.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Completion() Ok, bytes held</text>
<text x="336" y="887.8" font-size="13" fill="#DDD6FE">Past the deadline: Done with</text>
<text x="336" y="906.7" font-size="13" fill="#DDD6FE">Timeout, late data too. Cancel(): Idle,</text>
<text x="336" y="925.5" font-size="13" fill="#DDD6FE">buffers released.</text>
