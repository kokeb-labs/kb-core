<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1003" viewBox="0 0 1200 1003" role="img" aria-labelledby="async-poll-title async-poll-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="async-poll-title">One asynchronous read</title>
<desc id="async-poll-desc">Sequence: the owner task starts a read through the poller and the port in pass n; the poller polls and gets Pending; the interrupt completes the transfer; in pass n+1 the poll returns Done with the byte count and the completion is Ok. Past the deadline the result is Timeout; Cancel releases the buffers.</desc>
<defs><marker id="fk-arrow-brown-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C4A1E"/></marker><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8893A2"/></marker><marker id="fk-arrow-teal-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0B7A72"/></marker><marker id="fk-arrow-violet-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="1002" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">HANDLERS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">One asynchronous read</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Started in one owner pass, collected in a later one. No pass waits.</text>
