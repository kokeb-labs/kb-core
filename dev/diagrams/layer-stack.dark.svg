<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">The layer stack</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Arrows point from a layer to what it depends on. Only boundary files touch vendor code.</text>
