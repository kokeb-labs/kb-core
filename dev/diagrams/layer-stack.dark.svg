<text x="48" y="162.8" font-size="13" font-weight="700" fill="#E2E8F0">PRODUCT</text>
<text x="68" y="205.6" font-size="15" font-weight="700" fill="#F5D0FE">Application tasks</text>
<text x="68" y="230.4" font-size="13" fill="#D2DAE4">control, protocols, safety layer</text>
<text x="48" y="336.8" font-size="13" font-weight="700" fill="#E2E8F0">BOARD HAL</text>
<text x="68" y="379.6" font-size="15" font-weight="700" fill="#E8EDF3">Board facade and managers</text>
<text x="68" y="404.4" font-size="13" fill="#D2DAE4">built on kb-hal-common</text>
<text x="486.5" y="379.6" font-size="15" font-weight="700" fill="#E8EDF3">Board config</text>
<text x="486.5" y="404.4" font-size="13" fill="#D2DAE4">bus table, thread model per bus, chip</text>
<text x="486.5" y="423.3" font-size="13" fill="#D2DAE4">list, pins</text>
<text x="798.2" y="379.6" font-size="15" font-weight="700" fill="#E8EDF3">Platform bind</text>
<text x="798.2" y="404.4" font-size="13" fill="#D2DAE4">builds the port objects, sets the start-up order</text>
<rect x="753.8" y="290.3" width="39.8" height="20" rx="10" fill="#0E131A"/>
<text x="773.7" y="304.6" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">calls</text>
<text x="48" y="549.8" font-size="13" font-weight="700" fill="#F8D27A">KB-CORE</text>
<text x="68" y="592.5" font-size="15" font-weight="700" fill="#DDD6FE">kb::handlers</text>
<text x="68" y="617.4" font-size="13" fill="#D2DAE4">bindings, handler core, start-up</text>
<text x="68" y="636.2" font-size="13" fill="#D2DAE4">pipeline, owner and guarded</text>
<text x="68" y="655.1" font-size="13" fill="#D2DAE4">access</text>
<text x="348.5" y="592.5" font-size="15" font-weight="700" fill="#BFDBFE">kb::interfaces</text>
<text x="348.5" y="617.4" font-size="13" fill="#D2DAE4">contracts: C++20 concepts only,</text>
<text x="348.5" y="636.2" font-size="13" fill="#D2DAE4">plus the host test port</text>
<text x="629" y="592.5" font-size="15" font-weight="700" fill="#FDE68A">kb::rtos</text>
<text x="629" y="617.4" font-size="13" fill="#D2DAE4">API; backends none, FreeRTOS,</text>
<text x="629" y="636.2" font-size="13" fill="#D2DAE4">ThreadX</text>
<text x="909.5" y="592.5" font-size="15" font-weight="700" fill="#F8D27A">kb::utils</text>
<text x="909.5" y="617.4" font-size="13" fill="#D2DAE4">Status/Result, units, containers,</text>
<text x="909.5" y="636.2" font-size="13" fill="#D2DAE4">CRC, seqlock</text>
<rect x="335.9" y="493.3" width="40.8" height="20" rx="10" fill="#0E131A"/>
<text x="356.4" y="507.6" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">uses</text>
<text x="68" y="779.5" font-size="15" font-weight="700" fill="#BBF7D0">driver-&lt;chip&gt;</text>
<text x="68" y="804.4" font-size="13" fill="#D2DAE4">brand-free, own CI at level high,</text>
<text x="68" y="823.2" font-size="13" fill="#D2DAE4">pinned release tags</text>
<rect x="261.5" y="702.8" width="45.4" height="20" rx="10" fill="#0E131A"/>
<text x="284.2" y="717.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">binds</text>
<text x="328.5" y="737.8" font-size="13" font-weight="700" fill="#A7F3E6">MCU PORTS</text>
<text x="348.5" y="780.5" font-size="15" font-weight="700" fill="#A7F3E6">port-esp32</text>
<text x="348.5" y="805.4" font-size="13" fill="#D2DAE4">components/ports/esp32, own CMake project</text>
<text x="769.2" y="780.5" font-size="15" font-weight="700" fill="#E8EDF3">port-stm32</text>
<text x="769.2" y="805.4" font-size="13" fill="#D2DAE4">planned, own repository</text>
<rect x="523.8" y="703.3" width="62.8" height="20" rx="10" fill="#0E131A"/>
<text x="555.2" y="717.6" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">satisfies</text>
<text x="52" y="931.5" font-size="15" font-weight="700" fill="#E8EDF3">SOUP</text>
<text x="52" y="956.4" font-size="13" fill="#D2DAE4">ESP-IDF, STM32 HAL, FreeRTOS, ThreadX, mbedTLS. Reached only through boundary files of the ports and the RTOS backends; never analysed, never edited.</text>
<rect x="561.2" y="853.8" width="128.4" height="20" rx="10" fill="#0E131A"/>
<text x="625.4" y="868.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">boundary files only</text>
<rect x="32" y="989.2" width="14" height="14" rx="4" fill="#2E1533" stroke="#F0ABFC" stroke-width="1.4"/>
<text x="54" y="1000.8" font-size="12.5" fill="#9AA6B5">product and board HAL</text>
<rect x="224.5" y="989.2" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="246.5" y="1000.8" font-size="12.5" fill="#9AA6B5">handlers</text>
<rect x="324.7" y="989.2" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="346.7" y="1000.8" font-size="12.5" fill="#9AA6B5">interfaces and contracts</text>
<rect x="523.2" y="989.2" width="14" height="14" rx="4" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="545.2" y="1000.8" font-size="12.5" fill="#9AA6B5">kb::rtos</text>
<rect x="616.5" y="989.2" width="14" height="14" rx="4" fill="#2A2113" stroke="#F4B942" stroke-width="1.4"/>
<text x="638.5" y="1000.8" font-size="12.5" fill="#9AA6B5">kb::utils</text>
<rect x="711.1" y="989.2" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="733.1" y="1000.8" font-size="12.5" fill="#9AA6B5">MCU ports</text>
<rect x="824.7" y="989.2" width="14" height="14" rx="4" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<text x="846.7" y="1000.8" font-size="12.5" fill="#9AA6B5">drivers</text>
<rect x="914.2" y="989.2" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="936.2" y="1000.8" font-size="12.5" fill="#9AA6B5">SOUP and planned</text>
