<text x="68" y="205.6" font-size="15" font-weight="700" fill="#1E429F">driver.yml of each pinned driver</text>
<text x="68" y="230.4" font-size="13" fill="#2B3442">bus, mcus, peripheral, kb_core_min,</text>
<text x="68" y="249.2" font-size="13" fill="#2B3442">ports, binding</text>
<text x="68" y="307.6" font-size="15" font-weight="700" fill="#1E429F">Release lock</text>
<text x="68" y="332.4" font-size="13" fill="#2B3442">kb-core tag and SHA, every pin with tag</text>
<text x="68" y="351.2" font-size="13" fill="#2B3442">and SHA</text>
<text x="68" y="409.6" font-size="15" font-weight="700" fill="#1E429F">Evidence</text>
<text x="68" y="434.4" font-size="13" fill="#2B3442">SBOM (SPDX, CycloneDX), CVE scan,</text>
<text x="68" y="453.3" font-size="13" fill="#2B3442">licence report</text>
<text x="68" y="511.6" font-size="15" font-weight="700" fill="#1E429F">Tested version sets</text>
<text x="68" y="536.4" font-size="13" fill="#2B3442">kb YYYY.N</text>
<text x="68" y="594.5" font-size="15" font-weight="700" fill="#1E429F">board.yml</text>
<text x="68" y="619.4" font-size="13" fill="#2B3442">buses, pins, chips (later)</text>
<text x="48" y="162.8" font-size="13" font-weight="700" fill="#1E429F">INPUTS</text>
<text x="470" y="205.6" font-size="15" font-weight="700" fill="#6B3F17">kb command line</text>
<text x="470" y="230.4" font-size="13" fill="#2B3442">Python standard library only, tools/kb</text>
<text x="470" y="288.6" font-size="15" font-weight="700" fill="#6B3F17">Configurator site</text>
<text x="470" y="313.4" font-size="13" fill="#2B3442">static, GitHub Pages: pick MCU, RTOS,</text>
<text x="470" y="332.2" font-size="13" fill="#2B3442">drivers, handlers</text>
<text x="470" y="390.6" font-size="15" font-weight="700" fill="#6B3F17">Resolve</text>
<text x="470" y="415.4" font-size="13" fill="#2B3442">drivers, then handlers, interfaces and</text>
<text x="470" y="434.3" font-size="13" fill="#2B3442">parts; MCU gates; kb_core_min; thread</text>
<text x="470" y="453.1" font-size="13" fill="#2B3442">model per bus</text>
<text x="450" y="162.8" font-size="13" font-weight="700" fill="#6B3F17">ONE RESOLVER SPEC</text>
<text x="872" y="205.6" font-size="15" font-weight="700" fill="#14532D">kb-image.yml</text>
<text x="872" y="230.4" font-size="13" fill="#2B3442">the selection</text>
<text x="872" y="288.6" font-size="15" font-weight="700" fill="#14532D">Git commands</text>
<text x="872" y="313.4" font-size="13" fill="#2B3442">clone at the tag, check the SHA, init only</text>
<text x="872" y="332.2" font-size="13" fill="#2B3442">the enabled submodules</text>
<text x="872" y="390.6" font-size="15" font-weight="700" fill="#14532D">CMake presets and</text>
<text x="872" y="410.1" font-size="15" font-weight="700" fill="#14532D">kb_image.cmake</text>
<text x="872" y="434.9" font-size="13" fill="#2B3442">a presets fragment and the image</text>
<text x="872" y="453.8" font-size="13" fill="#2B3442">include</text>
<text x="872" y="511.6" font-size="15" font-weight="700" fill="#14532D">Evidence for the selection</text>
<text x="872" y="536.4" font-size="13" fill="#2B3442">SBOM, CVEs, licences, compatibility</text>
<text x="872" y="555.2" font-size="13" fill="#2B3442">rows, tested set</text>
<text x="872" y="613.5" font-size="15" font-weight="700" fill="#14532D">Project archive</text>
<text x="872" y="638.4" font-size="13" fill="#2B3442">later</text>
<text x="852" y="162.8" font-size="13" font-weight="700" fill="#14532D">DOWNLOADS, BYTE FOR BYTE REPEATABLE</text>
