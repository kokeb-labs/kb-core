<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1049" viewBox="0 0 1200 1049" role="img" aria-labelledby="handler-startup-title handler-startup-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="handler-startup-title">The handler start-up pipeline</title>
<desc id="handler-startup-desc">Pipeline of eight start-up stages in order, Power, HostReset, Boot, Link, Identify, Secure, Configure and Verify, ending in Ready; beside it the plans of most drivers, the bno08x and the se05x, each using only some of the stages.</desc>
<defs><marker id="fk-arrow-green-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ADE80"/></marker><marker id="fk-arrow-violet-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A78BFA"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="1048" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HANDLERS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">The handler start-up pipeline</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">One runner, a plan of declared stages per chip. Each stage is synchronous or polled, and bounded.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#252F3C"/>
