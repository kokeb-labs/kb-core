<text x="122" y="186.3" font-size="15" font-weight="700" fill="#BFDBFE">Release tags</text>
<text x="122" y="211.2" font-size="13" fill="#D2DAE4">driver.yml per driver</text>
<text x="122" y="230" font-size="13" fill="#D2DAE4">kb-core: platform, pins</text>
<text x="122" y="344.3" font-size="15" font-weight="700" fill="#F1D5B5">kb catalog build</text>
<text x="122" y="369.1" font-size="13" fill="#D2DAE4">reads the tags</text>
<text x="122" y="483.3" font-size="15" font-weight="700" fill="#BBF7D0">catalog.json</text>
<text x="122" y="508.2" font-size="13" fill="#D2DAE4">every part at every</text>
<text x="122" y="527" font-size="13" fill="#D2DAE4">version</text>
<text x="368" y="483.3" font-size="15" font-weight="700" fill="#BFDBFE">kb-image.yml</text>
<text x="368" y="508.2" font-size="13" fill="#D2DAE4">what the user picked</text>
<text x="368" y="527" font-size="13" fill="#D2DAE4">MCU, RTOS, drivers</text>
<text x="245" y="641.3" font-size="15" font-weight="700" fill="#F1D5B5">Resolver</text>
<text x="245" y="666.2" font-size="13" fill="#D2DAE4">Python or JavaScript</text>
<text x="245" y="685" font-size="13" fill="#D2DAE4">one spec</text>
<text x="122" y="799.3" font-size="15" font-weight="700" fill="#BBF7D0">kb-image.lock.yml</text>
<text x="122" y="824.2" font-size="13" fill="#D2DAE4">every version</text>
<text x="122" y="843" font-size="13" fill="#D2DAE4">every tag</text>
<text x="122" y="861.9" font-size="13" fill="#D2DAE4">every SHA</text>
<text x="368" y="799.3" font-size="15" font-weight="700" fill="#BBF7D0">Project files</text>
<text x="368" y="824.2" font-size="13" fill="#D2DAE4">CMakePresets.json</text>
<text x="368" y="843" font-size="13" fill="#D2DAE4">kb_image.cmake</text>
<text x="368" y="861.9" font-size="13" fill="#D2DAE4">kb-fetch.sh</text>
<text x="122" y="976.3" font-size="15" font-weight="700" fill="#F1D5B5">kb sbom</text>
