<title id="dependency-rules-title">Which layer may depend on which</title>
<desc id="dependency-rules-desc">Table of nineteen dependency rules between layers, twelve allowed from the application down to kb::utils and seven forbidden, each forbidden one with the check that catches it.</desc>
