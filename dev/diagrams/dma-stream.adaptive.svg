<rect x="102" y="957.5" width="4" height="53" rx="2" class="fk-f-green-strong"/>
<text x="245" y="186.3" font-size="15" font-weight="700" class="fk-f-teal-text">DMA ring</text>
<text x="245" y="211.2" font-size="13" class="fk-f-ink2">2 halves or N frames</text>
<text x="245" y="325.3" font-size="15" font-weight="700" class="fk-f-violet-text">Interrupt</text>
<text x="245" y="350.1" font-size="13" class="fk-f-ink2">PublishFromDevice</text>
<text x="245" y="369" font-size="13" class="fk-f-ink2">copy out, seq, time,</text>
<text x="245" y="387.9" font-size="13" class="fk-f-ink2">torn</text>
<text x="122" y="512.3" font-size="15" font-weight="700" class="fk-f-blue-text">Ring of slots</text>
<text x="122" y="537.2" font-size="13" class="fk-f-ink2">at least 2 slots</text>
<text x="368" y="502.3" font-size="15" font-weight="700" class="fk-f-rose-text">Next frame: Gap()</text>
<text x="368" y="527.2" font-size="13" class="fk-f-ink2">all slots held</text>
<text x="368" y="546" font-size="13" class="fk-f-ink2">frame dropped as Full</text>
<text x="122" y="660.3" font-size="15" font-weight="700" class="fk-f-blue-text">FrameView</text>
<text x="122" y="685.2" font-size="13" class="fk-f-ink2">move-only</text>
<text x="122" y="704" font-size="13" class="fk-f-ink2">releases on end</text>
<text x="122" y="818.3" font-size="15" font-weight="700" class="fk-f-violet-text">Supervise</text>
<text x="122" y="843.2" font-size="13" class="fk-f-ink2">None, Restart, BackOff,</text>
<text x="122" y="862" font-size="13" class="fk-f-ink2">UseFallback</text>
<text x="122" y="976.3" font-size="15" font-weight="700" class="fk-f-green-text">Fallback producer</text>
<text x="122" y="1001.2" font-size="13" class="fk-f-ink2">frames carry Fallback()</text>
<rect x="328" y="253.6" width="111" height="20" rx="10" class="fk-f-canvas"/>
<text x="383.5" y="267.9" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">half or complete</text>
<rect x="246.9" y="415.7" width="62.1" height="20" rx="10" class="fk-f-canvas"/>
<text x="278" y="430" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">slot free</text>
<rect x="394.4" y="445.4" width="55.2" height="20" rx="10" class="fk-f-canvas"/>
<text x="422" y="459.7" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">all held</text>
<rect x="205.2" y="588.5" width="62.6" height="20" rx="10" class="fk-f-canvas"/>
<text x="236.5" y="602.9" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">TryTake</text>
<rect x="204.9" y="746.5" width="50.2" height="20" rx="10" class="fk-f-canvas"/>
<text x="230" y="760.9" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">Judge</text>
<rect x="205.1" y="904.5" width="94.7" height="20" rx="10" class="fk-f-canvas"/>
<text x="252.5" y="918.9" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">EnterFallback</text>
<rect x="32" y="1033.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
<text x="54" y="1045.5" font-size="12.5" class="fk-f-muted">hardware</text>
<rect x="137.4" y="1033.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-violet-tint fk-s-violet-strong"/>
<text x="159.4" y="1045.5" font-size="12.5" class="fk-f-muted">interrupt</text>
<rect x="236.7" y="1033.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-blue-tint fk-s-blue-strong"/>
<text x="258.7" y="1045.5" font-size="12.5" class="fk-f-muted">task</text>
<rect x="308.8" y="1033.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-rose-tint fk-s-rose-strong"/>
<text x="330.8" y="1045.5" font-size="12.5" class="fk-f-muted">gap</text>
<rect x="378.4" y="1033.9" width="14" height="14" rx="4" stroke-width="1.4" class="fk-f-green-tint fk-s-green-strong"/>
<text x="400.4" y="1045.5" font-size="12.5" class="fk-f-muted">fallback</text>
