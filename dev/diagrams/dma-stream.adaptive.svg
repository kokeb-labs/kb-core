<path d="M401 409.6 L401 447.4 Q401 455.4 409 455.4 L435 455.4 Q443 455.4 443 463.4 L443 471.6" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#dma-stream-arrow-rose-strong)" class="fk-s-rose-strong"/>
