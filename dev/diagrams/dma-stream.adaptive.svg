<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080" role="img" aria-labelledby="dma-stream-title dma-stream-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="dma-stream-title">The DMA copy-out stream</title>
<desc id="dma-stream-desc">Flow in which the DMA ring raises an interrupt that copies each finished frame into a slot, the task takes a slot as a FrameView, a content check feeds the supervisor, and a full ring drops the frame and flags the next with Gap.</desc>
