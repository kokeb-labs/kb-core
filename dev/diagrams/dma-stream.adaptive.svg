<rect x="0.5" y="0.5" width="639" height="1079" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">DMA</text>
<text x="32" y="77.3" font-size="26" font-weight="700" class="fk-f-ink">The DMA copy-out stream</text>
<text x="32" y="103.8" font-size="15" class="fk-f-muted">The interrupt copies each finished frame into a slot. The task never holds</text>
<text x="32" y="125.5" font-size="15" class="fk-f-muted">the ring itself.</text>
<rect x="32" y="141.6" width="576" height="1" class="fk-f-hair"/>
