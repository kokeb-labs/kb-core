<text x="411.7" y="250.6" font-size="12" text-anchor="middle" class="fk-f-ok-text">0 deviations, phase 1</text>
<text x="82.3" y="294.6" font-size="13" font-weight="700" class="fk-f-ink">kb::interfaces</text>
<text x="421.7" y="291.6" font-size="13" font-weight="600" text-anchor="middle" class="fk-f-ok-text">compliant</text>
<text x="411.7" y="310.6" font-size="12" text-anchor="middle" class="fk-f-ok-text">0 deviations, phase 1</text>
