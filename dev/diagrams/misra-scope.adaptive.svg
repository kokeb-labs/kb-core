<text x="82.3" y="474.6" font-size="13" font-weight="700" class="fk-f-ink">RTOS boundary files</text>
<text x="421.7" y="471.6" font-size="13" font-weight="600" text-anchor="middle" class="fk-f-warn-text">compliant</text>
