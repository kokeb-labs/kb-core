<text x="240" y="186.3" font-size="15" font-weight="700" fill="#86198F">HAL manager or task</text>
<text x="240" y="211.2" font-size="13" fill="#2B3442">EnsureStarted, Request,</text>
<text x="240" y="230" font-size="13" fill="#2B3442">Sample, Latest, Health</text>
<text x="243" y="344.3" font-size="15" font-weight="700" fill="#5B21B6">Access facade</text>
<text x="243" y="369.1" font-size="13" fill="#2B3442">OwnerAccess&lt;H&gt;:</text>
<text x="243" y="388" font-size="13" fill="#2B3442">queue, snapshot</text>
<text x="243" y="406.9" font-size="13" fill="#2B3442">or Guarded&lt;H&gt;:</text>
<text x="243" y="425.7" font-size="13" fill="#2B3442">handler lock, then bus</text>
<text x="243" y="444.6" font-size="13" fill="#2B3442">lock</text>
<text x="110" y="558.3" font-size="15" font-weight="700" fill="#5B21B6">HandlerCore</text>
<text x="110" y="583.2" font-size="13" fill="#2B3442">start-up runner</text>
<text x="110" y="602" font-size="13" fill="#2B3442">health</text>
<text x="110" y="620.9" font-size="13" fill="#2B3442">snapshot</text>
<text x="110" y="639.7" font-size="13" fill="#2B3442">liveness beat</text>
<text x="356" y="576.3" font-size="15" font-weight="700" fill="#0B5F59">BusDomain&lt;Bus, Model&gt;</text>
<text x="356" y="601.2" font-size="13" fill="#2B3442">one bus</text>
<text x="356" y="620" font-size="13" fill="#2B3442">its thread model</text>
<text x="110" y="753.3" font-size="15" font-weight="700" fill="#14532D">Driver</text>
<text x="110" y="778.2" font-size="13" fill="#2B3442">std::optional</text>
<text x="110" y="797" font-size="13" fill="#2B3442">built by the plan</text>
<text x="110" y="911.3" font-size="15" font-weight="700" fill="#5B21B6">Binding Port</text>
<text x="110" y="936.2" font-size="13" fill="#2B3442">driver hooks</text>
<text x="110" y="955" font-size="13" fill="#2B3442">over kb::iface</text>
<text x="110" y="1069.3" font-size="15" font-weight="700" fill="#1E429F">kb::iface contract</text>
<text x="110" y="1094.2" font-size="13" fill="#2B3442">the HAL's bus, pins,</text>
<text x="110" y="1113" font-size="13" fill="#2B3442">clock</text>
<rect x="326.6" y="272.6" width="39.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="346.5" y="286.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">calls</text>
