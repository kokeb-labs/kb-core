<text x="425.2" y="515.7" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">owns</text>
<rect x="193.2" y="681.5" width="48.6" height="20" rx="10" fill="#FFFFFF"/>
<text x="217.5" y="695.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">builds</text>
<rect x="32" y="1145.9" width="14" height="14" rx="4" fill="#FDF0FF" stroke="#A21CAF" stroke-width="1.4"/>
<text x="54" y="1157.5" font-size="12.5" fill="#566070">product and board HAL</text>
<rect x="224.5" y="1145.9" width="14" height="14" rx="4" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="246.5" y="1157.5" font-size="12.5" fill="#566070">handlers</text>
<rect x="324.7" y="1145.9" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="346.7" y="1157.5" font-size="12.5" fill="#566070">bus domain</text>
<rect x="443.5" y="1145.9" width="14" height="14" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<text x="465.5" y="1157.5" font-size="12.5" fill="#566070">drivers</text>
<rect x="32" y="1170.9" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="54" y="1182.5" font-size="12.5" fill="#566070">interfaces and contracts</text>
