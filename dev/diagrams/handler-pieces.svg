<svg xmlns="http://www.w3.org/2000/svg" width="656" height="1217" viewBox="0 0 656 1217" role="img" aria-labelledby="handler-pieces-title handler-pieces-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="handler-pieces-title">The pieces of a handler</title>
<desc id="handler-pieces-desc">Stack in which a HAL manager calls an access facade, the facade runs the handler core with a service key and owns the bus domain, and the core builds the driver, which reaches the HAL's bus through the binding's port and the kb::iface contract.</desc>
<defs><marker id="handler-pieces-arrow-green-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="handler-pieces-arrow-magenta-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A21CAF"/></marker><marker id="handler-pieces-arrow-teal-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0B7A72"/></marker><marker id="handler-pieces-arrow-violet-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker></defs>
<rect x="0.5" y="0.5" width="655" height="1216" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">HANDLERS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">The pieces of a handler</text>
<text x="32" y="103.8" font-size="15" fill="#566070">One facade per handler, chosen by the bus's thread model. Only a facade can</text>
<text x="32" y="125.5" font-size="15" fill="#566070">run the core.</text>
<rect x="32" y="141.6" width="592" height="1" fill="#E2E7EE"/>
