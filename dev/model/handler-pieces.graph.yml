# The pieces of a handler.
kind: graph
id: handler-pieces
title: The pieces of a handler
kicker: Handlers
subtitle: One facade per handler, chosen by the bus's thread model. Only a facade can run the core.
alt: >-
  Stack in which a HAL manager calls an access facade, the facade runs the handler core with a service key and owns
  the bus domain, and the core builds the driver, which reaches the HAL's bus through the binding's port and the
  kb::iface contract.
reads: >-
  From the top. A HAL manager or application task calls an access facade with EnsureStarted, Request, Sample, Latest
  or Health; there is one facade per handler, chosen by the bus's thread model: OwnerAccess (request queue and a
  lock-free snapshot) or Guarded (handler lock, then bus lock). Only a facade can make the ServiceKey that the handler
  core needs, and the facade also owns the BusDomain of its bus, which holds one bus and its declared thread model.
  The core, HandlerCore of the handler, the driver, the snapshot, the command and the reply, holds the start-up plan
  runner (kStartupPlan), the health record and the snapshot (both seqlocks) and a liveness beat. It builds the driver
  in a std::optional; the driver reaches the bus through the binding's Port, driver hooks (I2cHooks, SpiHooks,
  UartHooks, AdcHooks, GpioHooks) over the kb::iface contract through which the HAL supplies its bus, pins and clock.
direction: TB
print: portrait
legend:
  - [magenta, product and board HAL]
  - [violet, handlers]
  - [teal, bus domain]
  - [green, drivers]
  - [blue, interfaces and contracts]
