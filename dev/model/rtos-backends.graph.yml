# The kb::rtos backends.
kind: graph
id: rtos-backends
title: "kb::rtos backends"
kicker: RTOS
subtitle: One API and one seam. Each backend owns its objects in opaque storage.
alt: >-
  The kb::rtos API reaches one backend through a single seam, none, FreeRTOS, ThreadX or host for tests, and FreeRTOS
  and ThreadX reach their kernel, which is SOUP, through boundary files and are tested on fake kernels.
reads: >-
  One API, one seam, four backends. The kb::rtos API (Mutex, RecursiveMutex, Semaphore, Queue, EventFlags, Timer,
  Thread, CriticalSection in components/lib/rtos/inc) reaches a backend through kb::rtos::backend (backend.hpp), where
  each native object lives in opaque storage sized there and every backend static_asserts that it fits. The none
  backend is for host tests and bare-metal bring-up, with one context and a deterministic fake clock; the host
  backend (std::thread) runs PC tests with real threads and is never built for a target. FreeRTOS (the ESP32 default,
  any FreeRTOS target, static API only) and ThreadX (Eclipse ThreadX targets, one boundary file) reach their kernel
  through boundary files; the kernel is SOUP, from ESP-IDF or KB_FREERTOS_INCLUDE_DIRS for FreeRTOS, and from
  KB_THREADX_INCLUDE_DIRS or third_party/threadx for ThreadX. FreeRTOS and ThreadX also run their tests on fake
  kernels (tests/fakes) with exact ticks.
