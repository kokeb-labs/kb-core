# Example board: an ESP32-C6 with SPI2 on DMA (1028-byte staging) and a continuous ADC that runs from IRAM-safe
# callbacks. It takes 2 of the 3 GDMA pairs of the part.
# `kb image check examples/boards/esp32c6-dma/board.yml --sdkconfig <sdkconfig.defaults>` checks it; without the
# sdkconfig the IRAM-safe option is reported as a warning (R13).
# SPDX-License-Identifier: MIT
# Copyright (c) 2026 The kb-core authors
board: example-c6
mcu: {family: esp32, target: esp32c6}

memory:
  regions:
    # Internal SRAM: DMA-capable, no cache between it and the DMA on this part, word aligned.
    internal: {cache: none, align: 4}

dma:
  streams:
    spi2: {driver: spi_master, host: SPI2}
    adc: {driver: adc_continuous, frame_bytes: 256, frames: 4, iram_safe: true}

buses:
  spi2: {kind: spi, model: owner, dma: true, staging_bytes: 1028, devices: [{driver: bno08x, max_frame_bytes: 1024}]}
