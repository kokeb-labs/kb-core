# Equivalent mutants of kb-core (ci-mutation.yml, input equivalents_file): one-edit mutants that cannot change any
# observable behaviour, each with the reason. A survivor is either killed by a new test or recorded here; never by
# deleting the mutant. Ids are the mutation tool's (ci-tools mutate.py), stable while the mutated line is unchanged.
