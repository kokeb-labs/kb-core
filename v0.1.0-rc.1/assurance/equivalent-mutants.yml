  # The handler core's catalogue (tools/mutants/handlers.txt).
  - id: HC-13
    reason: >-
      The start budget of EnsureInitialized() is a second, outer bound: every polled stage already fails at its
      own deadline and every sync stage ends in one step, so a run always ends before the budget expires.
      Counting the deadlines of skipped optional stages only makes the outer bound longer, which no run reaches.
