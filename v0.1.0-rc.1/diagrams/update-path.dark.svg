<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="513" viewBox="0 0 1200 513" role="img" aria-labelledby="update-path-title update-path-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="update-path-title">The update path</title>
<desc id="update-path-desc">Five steps: read the lock, catalogue and image; order kb-core, port and drivers; apply the driver gates and hold back what fails; write one row per component; write the new image, lock, CMake files, fetch script and report, then review, fetch, build and test.</desc>
<defs><marker id="fk-arrow-green-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ADE80"/></marker><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker><marker id="fk-arrow-rose-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FB7185"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="512" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">UPDATES</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">The update path</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">One pure function plans an upgrade. The kb tool and the configurator give the same bytes.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#252F3C"/>
<path d="M239.2 200.3 L261.2 200.3" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M472.4 200.3 L494.4 200.3" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M705.6 200.3 L727.6 200.3" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M938.8 200.3 L960.8 200.3" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 265.8 L600 323.8" fill="none" stroke="#FB7185" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#fk-arrow-rose-strong)"/>
<path d="M1066.4 265.8 L1066.4 323.8" fill="none" stroke="#4ADE80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-green-strong)"/>
<rect x="32" y="137.8" width="203.2" height="125" rx="10" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<rect x="32" y="145.8" width="4" height="109" rx="2" fill="#60A5FA"/>
<rect x="265.2" y="137.8" width="203.2" height="125" rx="10" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<rect x="265.2" y="145.8" width="4" height="109" rx="2" fill="#A78BFA"/>
<rect x="498.4" y="137.8" width="203.2" height="125" rx="10" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<rect x="498.4" y="145.8" width="4" height="109" rx="2" fill="#A78BFA"/>
<rect x="731.6" y="137.8" width="203.2" height="125" rx="10" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<rect x="731.6" y="145.8" width="4" height="109" rx="2" fill="#A78BFA"/>
<rect x="964.8" y="137.8" width="203.2" height="125" rx="10" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<rect x="964.8" y="145.8" width="4" height="109" rx="2" fill="#4ADE80"/>
<rect x="498.4" y="326.8" width="203.2" height="125" rx="10" fill="#321820" stroke="#FB7185" stroke-width="1.4"/>
<rect x="498.4" y="334.8" width="4" height="109" rx="2" fill="#FB7185"/>
<rect x="844.8" y="326.8" width="323.2" height="88" rx="10" fill="#2A1F14" stroke="#D6A26B" stroke-width="1.4"/>
<rect x="844.8" y="334.8" width="4" height="72" rx="2" fill="#D6A26B"/>
<rect x="32" y="326.8" width="436.4" height="107" rx="10" fill="#2A1F14" stroke="#D6A26B" stroke-width="1.4"/>
<rect x="32" y="334.8" width="4" height="91" rx="2" fill="#D6A26B"/>
<text x="52" y="164.6" font-size="15" font-weight="700" fill="#BFDBFE">1  Read</text>
<text x="52" y="189.4" font-size="13" fill="#D2DAE4">lock, catalogue and</text>
<text x="52" y="208.2" font-size="13" fill="#D2DAE4">image: the current</text>
<text x="52" y="227.1" font-size="13" fill="#D2DAE4">versions come from the</text>
<text x="52" y="245.9" font-size="13" fill="#D2DAE4">lock</text>
<text x="285.2" y="164.6" font-size="15" font-weight="700" fill="#DDD6FE">2  Order</text>
<text x="285.2" y="189.4" font-size="13" fill="#D2DAE4">kb-core, then an</text>
<text x="285.2" y="208.2" font-size="13" fill="#D2DAE4">extracted port, then each</text>
<text x="285.2" y="227.1" font-size="13" fill="#D2DAE4">driver by name</text>
<text x="518.4" y="164.6" font-size="15" font-weight="700" fill="#DDD6FE">3  Gate</text>
<text x="518.4" y="189.4" font-size="13" fill="#D2DAE4">MCU family,</text>
<text x="518.4" y="208.2" font-size="13" fill="#D2DAE4">kb_core_min, owner-task</text>
<text x="518.4" y="227.1" font-size="13" fill="#D2DAE4">rule, bus kind in use</text>
<text x="751.6" y="164.6" font-size="15" font-weight="700" fill="#DDD6FE">4  Rows</text>
<text x="751.6" y="189.4" font-size="13" fill="#D2DAE4">one per component:</text>
<text x="751.6" y="208.2" font-size="13" fill="#D2DAE4">change, breaking,</text>
<text x="751.6" y="227.1" font-size="13" fill="#D2DAE4">vulnerabilities fixed</text>
<text x="984.8" y="164.6" font-size="15" font-weight="700" fill="#BBF7D0">5  Write</text>
<text x="984.8" y="189.4" font-size="13" fill="#D2DAE4">image, lock, CMake files,</text>
<text x="984.8" y="208.2" font-size="13" fill="#D2DAE4">fetch script,</text>
<text x="984.8" y="227.1" font-size="13" fill="#D2DAE4">kb-upgrade.md</text>
<text x="518.4" y="353.6" font-size="15" font-weight="700" fill="#FECDD3">Held back</text>
<text x="518.4" y="378.4" font-size="13" fill="#D2DAE4">a newer version that fails</text>
<text x="518.4" y="397.3" font-size="13" fill="#D2DAE4">a gate is listed with the</text>
<text x="518.4" y="416.1" font-size="13" fill="#D2DAE4">code of its first failing</text>
<text x="518.4" y="435" font-size="13" fill="#D2DAE4">gate</text>
<rect x="581.3" y="284.8" width="37.3" height="20" rx="10" fill="#0E131A"/>
<text x="600" y="299.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">fails</text>
<text x="864.8" y="353.6" font-size="15" font-weight="700" fill="#F1D5B5">Then, by hand</text>
<text x="864.8" y="378.4" font-size="13" fill="#D2DAE4">review the diff, sh kb-fetch.sh, build and</text>
<text x="864.8" y="397.3" font-size="13" fill="#D2DAE4">test</text>
<text x="52" y="353.6" font-size="15" font-weight="700" fill="#F1D5B5">Entry points</text>
<text x="52" y="378.4" font-size="13" fill="#D2DAE4">kb outdated: exit 3 when a component can move</text>
<text x="52" y="397.3" font-size="13" fill="#D2DAE4">kb upgrade: writes the files</text>
<text x="52" y="416.1" font-size="13" fill="#D2DAE4">the configurator's Open an existing project view</text>
<rect x="32" y="467.2" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="54" y="478.8" font-size="12.5" fill="#9AA6B5">inputs</text>
<rect x="116.3" y="467.2" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="138.3" y="478.8" font-size="12.5" fill="#9AA6B5">plan</text>
<rect x="188.9" y="467.2" width="14" height="14" rx="4" fill="#321820" stroke="#FB7185" stroke-width="1.4"/>
<text x="210.9" y="478.8" font-size="12.5" fill="#9AA6B5">held back</text>
<rect x="295.9" y="467.2" width="14" height="14" rx="4" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<text x="317.9" y="478.8" font-size="12.5" fill="#9AA6B5">written</text>
</svg>
