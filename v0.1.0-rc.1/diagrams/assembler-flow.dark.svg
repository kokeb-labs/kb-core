<text x="52" y="164.6" font-size="15" font-weight="700" fill="#BFDBFE">driver-&lt;chip&gt; tags</text>
<text x="52" y="189.4" font-size="13" fill="#D2DAE4">driver.yml at each tag</text>
<text x="52" y="282.6" font-size="15" font-weight="700" fill="#BFDBFE">kb-core tags</text>
<text x="52" y="307.4" font-size="13" fill="#D2DAE4">platform table, pins</text>
<text x="346" y="223.6" font-size="15" font-weight="700" fill="#F1D5B5">kb catalog build</text>
<text x="346" y="248.4" font-size="13" fill="#D2DAE4">reads the tags</text>
<text x="640" y="223.6" font-size="15" font-weight="700" fill="#BBF7D0">catalog.json</text>
<text x="640" y="248.4" font-size="13" fill="#D2DAE4">every part at every version</text>
<text x="52" y="518.5" font-size="15" font-weight="700" fill="#BFDBFE">kb-image.yml</text>
<text x="52" y="543.4" font-size="13" fill="#D2DAE4">what the user selected</text>
<text x="640" y="518.5" font-size="15" font-weight="700" fill="#F1D5B5">Resolver</text>
<text x="640" y="543.4" font-size="13" fill="#D2DAE4">Python or JavaScript, one spec</text>
<text x="936" y="400.6" font-size="15" font-weight="700" fill="#BBF7D0">Project files</text>
<text x="936" y="425.4" font-size="13" fill="#D2DAE4">CMakePresets.json,</text>
<text x="936" y="444.3" font-size="13" fill="#D2DAE4">kb_image.cmake, kb-fetch.sh</text>
<text x="936" y="518.5" font-size="15" font-weight="700" fill="#BBF7D0">kb-image.lock.yml</text>
<text x="936" y="543.4" font-size="13" fill="#D2DAE4">every version, tag and SHA</text>
<text x="936" y="636.5" font-size="15" font-weight="700" fill="#F1D5B5">kb sbom</text>
<text x="936" y="661.4" font-size="13" fill="#D2DAE4">CycloneDX 1.6 and SPDX 2.3</text>
