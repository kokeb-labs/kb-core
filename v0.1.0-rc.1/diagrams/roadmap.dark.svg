<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">Phase roadmap</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">No calendar dates: a phase ends when its exit criteria are met.</text>
