<text x="52" y="164.6" font-size="15" font-weight="700" fill="#F8D27A">M0 Decisions and guardrails</text>
<text x="52" y="189.4" font-size="13" fill="#D2DAE4">ADR-0006 to ADR-0013 recorded;</text>
<text x="52" y="208.2" font-size="13" fill="#D2DAE4">include checker, poison build,</text>
<text x="52" y="227.1" font-size="13" fill="#D2DAE4">symbol lint, preflight and CI</text>
<text x="52" y="245.9" font-size="13" fill="#D2DAE4">skeleton green on empty parts.</text>
<text x="344.5" y="164.6" font-size="15" font-weight="700" fill="#F8D27A">M1 kb::utils v0.1</text>
<text x="344.5" y="189.4" font-size="13" fill="#D2DAE4">MISRA (high) with 0 findings and</text>
<text x="344.5" y="208.2" font-size="13" fill="#D2DAE4">0 deviations; coverage above the</text>
<text x="344.5" y="227.1" font-size="13" fill="#D2DAE4">high floor; mutation gate; fuzz</text>
<text x="344.5" y="245.9" font-size="13" fill="#D2DAE4">clean.</text>
<text x="637" y="164.6" font-size="15" font-weight="700" fill="#FDE68A">M2 kb::rtos v0.2</text>
<text x="637" y="189.4" font-size="13" fill="#D2DAE4">none and FreeRTOS backends;</text>
<text x="637" y="208.2" font-size="13" fill="#D2DAE4">at-least delays, bounded locks,</text>
<text x="637" y="227.1" font-size="13" fill="#D2DAE4">CRTP threads with stats;</text>
<text x="637" y="245.9" font-size="13" fill="#D2DAE4">boundary deviations approved;</text>
<text x="637" y="264.8" font-size="13" fill="#D2DAE4">TSan clean.</text>
<text x="929.5" y="164.6" font-size="15" font-weight="700" fill="#BFDBFE">M3 kb::interfaces v0.3</text>
<text x="929.5" y="189.4" font-size="13" fill="#D2DAE4">Concepts and a host port with</text>
<text x="929.5" y="208.2" font-size="13" fill="#D2DAE4">fault injection; BusDomain;</text>
<text x="929.5" y="227.1" font-size="13" fill="#D2DAE4">conformance and compile-fail</text>
<text x="929.5" y="245.9" font-size="13" fill="#D2DAE4">tests; 0 deviations.</text>
<text x="52" y="372.6" font-size="15" font-weight="700" fill="#A7F3E6">M4 ESP32 port and first</text>
<text x="52" y="392.1" font-size="15" font-weight="700" fill="#A7F3E6">bindings v0.4</text>
<text x="52" y="416.9" font-size="13" fill="#D2DAE4">Boundary files reviewed; 3 simple</text>
<text x="52" y="435.8" font-size="13" fill="#D2DAE4">drivers bound and handled;</text>
<text x="52" y="454.6" font-size="13" fill="#D2DAE4">integration, compat.yml, kb image</text>
<text x="52" y="473.5" font-size="13" fill="#D2DAE4">check; configurator P1; bench run.</text>
<text x="344.5" y="372.6" font-size="15" font-weight="700" fill="#DDD6FE">M5 Handler rollout v0.9 to</text>
<text x="344.5" y="392.1" font-size="15" font-weight="700" fill="#DDD6FE">v1.0</text>
<text x="344.5" y="416.9" font-size="13" fill="#D2DAE4">All drivers bound, simplest to</text>
<text x="344.5" y="435.8" font-size="13" fill="#D2DAE4">hardest (bno08x, se05x, tmc9660</text>
<text x="344.5" y="454.6" font-size="13" fill="#D2DAE4">last); start-up plans, both thread</text>
<text x="344.5" y="473.5" font-size="13" fill="#D2DAE4">models, health and recovery</text>
<text x="344.5" y="492.3" font-size="13" fill="#D2DAE4">tests.</text>
<text x="637" y="372.6" font-size="15" font-weight="700" fill="#F1D5B5">M6 Breadth</text>
<text x="637" y="397.4" font-size="13" fill="#D2DAE4">port-stm32, ThreadX backend,</text>
<text x="637" y="416.3" font-size="13" fill="#D2DAE4">tested version sets, SBOM, CVE</text>
<text x="637" y="435.1" font-size="13" fill="#D2DAE4">and licence evidence in the</text>
<text x="637" y="454" font-size="13" fill="#D2DAE4">configurator (P2).</text>
<text x="929.5" y="372.6" font-size="15" font-weight="700" fill="#F1D5B5">M7 Generators+</text>
<text x="929.5" y="397.4" font-size="13" fill="#D2DAE4">board.yml pin tables, project</text>
<text x="929.5" y="416.3" font-size="13" fill="#D2DAE4">archive, HIL in scheduled CI.</text>
</svg>
