<text x="52" y="164.6" font-size="15" font-weight="700" fill="#FDE68A">kb::rtos API</text>
<text x="52" y="189.4" font-size="13" fill="#D2DAE4">Mutex, RecursiveMutex, Semaphore, Queue, EventFlags, Timer, Thread, CriticalSection (components/lib/rtos/inc)</text>
<text x="52" y="273.6" font-size="15" font-weight="700" fill="#FDE68A">kb::rtos::backend</text>
<text x="52" y="298.4" font-size="13" fill="#D2DAE4">backend.hpp: the seam. Each native object lives in opaque storage sized there; every backend static_asserts it fits.</text>
<text x="52" y="402.6" font-size="15" font-weight="700" fill="#FDE68A">none</text>
<text x="52" y="427.4" font-size="13" fill="#D2DAE4">Host tests, bare-metal bring-up.</text>
<text x="52" y="446.3" font-size="13" fill="#D2DAE4">One context, a deterministic fake</text>
<text x="52" y="465.1" font-size="13" fill="#D2DAE4">clock.</text>
<text x="341" y="402.6" font-size="15" font-weight="700" fill="#FDE68A">freertos</text>
<text x="341" y="427.4" font-size="13" fill="#D2DAE4">ESP32 default, any FreeRTOS</text>
<text x="341" y="446.3" font-size="13" fill="#D2DAE4">target. Boundary files, static API</text>
<text x="341" y="465.1" font-size="13" fill="#D2DAE4">only.</text>
<text x="630" y="402.6" font-size="15" font-weight="700" fill="#FDE68A">threadx</text>
<text x="630" y="427.4" font-size="13" fill="#D2DAE4">Eclipse ThreadX targets. One</text>
<text x="630" y="446.3" font-size="13" fill="#D2DAE4">boundary file.</text>
<text x="919" y="402.6" font-size="15" font-weight="700" fill="#F1D5B5">host</text>
<text x="919" y="427.4" font-size="13" fill="#D2DAE4">PC tests with real threads</text>
<text x="919" y="446.3" font-size="13" fill="#D2DAE4">(std::thread), never built for a</text>
<text x="919" y="465.1" font-size="13" fill="#D2DAE4">target.</text>
<text x="341" y="569.5" font-size="15" font-weight="700" fill="#E8EDF3">FreeRTOS kernel</text>
<text x="341" y="594.4" font-size="13" fill="#D2DAE4">SOUP: ESP-IDF, or</text>
<text x="341" y="613.2" font-size="13" fill="#D2DAE4">KB_FREERTOS_INCLUDE_DIRS</text>
<text x="630" y="569.5" font-size="15" font-weight="700" fill="#E8EDF3">ThreadX kernel</text>
<text x="630" y="594.4" font-size="13" fill="#D2DAE4">SOUP:</text>
<text x="630" y="613.2" font-size="13" fill="#D2DAE4">KB_THREADX_INCLUDE_DIRS, or</text>
<text x="630" y="632.1" font-size="13" fill="#D2DAE4">third_party/threadx</text>
<rect x="405.9" y="502.8" width="99.1" height="20" rx="10" fill="#0E131A"/>
<text x="455.5" y="517.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">boundary files</text>
<rect x="698.4" y="502.8" width="92.3" height="20" rx="10" fill="#0E131A"/>
<text x="744.5" y="517.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">boundary file</text>
<text x="46" y="575.5" font-size="15" font-weight="700" fill="#F1D5B5">Tests</text>
<text x="46" y="593.4" font-size="13" fill="#F1D5B5">FreeRTOS and ThreadX also run</text>
<text x="46" y="612.2" font-size="13" fill="#F1D5B5">their tests on fake kernels</text>
<text x="46" y="631.1" font-size="13" fill="#F1D5B5">(tests/fakes) with exact ticks.</text>
<rect x="32" y="665.2" width="14" height="14" rx="4" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="54" y="676.8" font-size="12.5" fill="#9AA6B5">kb::rtos</text>
<rect x="125.3" y="665.2" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="147.3" y="676.8" font-size="12.5" fill="#9AA6B5">SOUP and planned</text>
<rect x="289.3" y="665.2" width="14" height="14" rx="4" fill="#2A1F14" stroke="#D6A26B" stroke-width="1.4"/>
<text x="311.3" y="676.8" font-size="12.5" fill="#9AA6B5">tests only</text>
</svg>
