<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="733" viewBox="0 0 1200 733" role="img" aria-labelledby="generator-flow-title generator-flow-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="generator-flow-title">Generators and the configurator</title>
<desc id="generator-flow-desc">Three columns. Inputs: driver.yml files, the release lock, evidence, tested version sets and later board.yml. Middle: the kb command line and the configurator site, both using one resolver. Outputs: kb-image.yml, git commands, CMake presets, evidence for the selection and later a project archive.</desc>
