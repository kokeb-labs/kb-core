<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">Generators and the configurator</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">One resolver specification, two front ends, repeatable downloads. Dashed cards come later (M6, M7).</text>
