<rect x="620" y="145.8" width="4" height="53" rx="2" fill="#C26A05"/>
<rect x="316" y="266.8" width="568" height="69" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<rect x="316" y="274.8" width="4" height="53" rx="2" fill="#7C3AED"/>
