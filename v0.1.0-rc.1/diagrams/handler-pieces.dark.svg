<rect x="0.5" y="0.5" width="1199" height="990" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HANDLERS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">The pieces of a handler</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">One facade per handler, chosen by the bus's thread model. Only a facade can run the core.</text>
