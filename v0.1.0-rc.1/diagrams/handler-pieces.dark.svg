<text x="52" y="164.6" font-size="15" font-weight="700" fill="#F5D0FE">HAL manager or application task</text>
<text x="52" y="189.4" font-size="13" fill="#D2DAE4">EnsureStarted, Request, Sample, Latest, Health</text>
<text x="68" y="330.6" font-size="15" font-weight="700" fill="#DDD6FE">OwnerAccess&lt;H&gt;</text>
<text x="68" y="355.4" font-size="13" fill="#D2DAE4">request queue, lock-free snapshot</text>
<text x="423.5" y="330.6" font-size="15" font-weight="700" fill="#DDD6FE">Guarded&lt;H&gt;</text>
<text x="423.5" y="355.4" font-size="13" fill="#D2DAE4">handler lock, then bus lock</text>
<text x="48" y="287.8" font-size="13" font-weight="700" fill="#DDD6FE">ACCESS FACADE</text>
<text x="177.5" y="287.8" font-size="12" fill="#DDD6FE">one per handler</text>
<rect x="375.6" y="224.8" width="39.8" height="20" rx="10" fill="#0E131A"/>
<text x="395.5" y="239.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">calls</text>
<text x="68" y="512.5" font-size="15" font-weight="700" fill="#DDD6FE">Start-up runner</text>
<text x="68" y="537.4" font-size="13" fill="#D2DAE4">kStartupPlan</text>
<text x="244.8" y="512.5" font-size="15" font-weight="700" fill="#DDD6FE">Health</text>
<text x="244.8" y="537.4" font-size="13" fill="#D2DAE4">record, seqlock</text>
<text x="421.5" y="512.5" font-size="15" font-weight="700" fill="#DDD6FE">Snapshot</text>
<text x="421.5" y="537.4" font-size="13" fill="#D2DAE4">seqlock</text>
<text x="598.3" y="512.5" font-size="15" font-weight="700" fill="#DDD6FE">Liveness</text>
<text x="598.3" y="537.4" font-size="13" fill="#D2DAE4">beat</text>
<text x="48" y="469.8" font-size="13" font-weight="700" fill="#DDD6FE">HANDLER CORE</text>
<text x="167.7" y="469.8" font-size="12" fill="#DDD6FE">HandlerCore&lt;Handler, Driver, Snapshot, Command, Reply&gt;</text>
<rect x="592.5" y="406.8" width="81.5" height="20" rx="10" fill="#0E131A"/>
<text x="633.3" y="421.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">ServiceKey</text>
<text x="52" y="653.5" font-size="15" font-weight="700" fill="#BBF7D0">Driver</text>
<text x="52" y="678.4" font-size="13" fill="#D2DAE4">std::optional, built by the plan</text>
<rect x="371.2" y="588.8" width="48.6" height="20" rx="10" fill="#0E131A"/>
<text x="395.5" y="603.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">builds</text>
<text x="52" y="770.5" font-size="15" font-weight="700" fill="#DDD6FE">Binding Port</text>
<text x="52" y="795.4" font-size="13" fill="#D2DAE4">driver hooks over kb::iface: I2cHooks, SpiHooks, UartHooks, AdcHooks, GpioHooks</text>
<text x="52" y="887.5" font-size="15" font-weight="700" fill="#BFDBFE">kb::iface contract</text>
<text x="52" y="912.4" font-size="13" fill="#D2DAE4">the HAL's bus, pins and clock</text>
<text x="839" y="330.6" font-size="15" font-weight="700" fill="#A7F3E6">BusDomain&lt;Bus, ThreadModel&gt;</text>
<text x="839" y="355.4" font-size="13" fill="#D2DAE4">one bus and its declared thread model</text>
<rect x="766.7" y="331.3" width="44.7" height="20" rx="10" fill="#0E131A"/>
<text x="789" y="345.6" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">owns</text>
<rect x="32" y="945.2" width="14" height="14" rx="4" fill="#2E1533" stroke="#F0ABFC" stroke-width="1.4"/>
<text x="54" y="956.8" font-size="12.5" fill="#9AA6B5">product and board HAL</text>
<rect x="224.5" y="945.2" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="246.5" y="956.8" font-size="12.5" fill="#9AA6B5">handlers</text>
<rect x="324.7" y="945.2" width="14" height="14" rx="4" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<text x="346.7" y="956.8" font-size="12.5" fill="#9AA6B5">drivers</text>
<rect x="414.1" y="945.2" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="436.1" y="956.8" font-size="12.5" fill="#9AA6B5">interfaces and contracts</text>
