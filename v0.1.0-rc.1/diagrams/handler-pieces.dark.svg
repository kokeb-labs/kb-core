<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="991" viewBox="0 0 1200 991" role="img" aria-labelledby="handler-pieces-title handler-pieces-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="handler-pieces-title">The pieces of a handler</title>
<desc id="handler-pieces-desc">Stack: a HAL manager calls an access facade, OwnerAccess or Guarded; the facade calls the handler core with a service key and owns the bus domain; the core holds the start-up runner, health, snapshot and liveness beat and builds the driver, which reaches the HAL's bus through the binding's port and the kb::iface contract.</desc>
