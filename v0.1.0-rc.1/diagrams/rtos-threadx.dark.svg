<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">The ThreadX backend</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">One boundary file between the kb::rtos seam and the kernel, three ways to get the kernel.</text>
