<text x="48" y="162.8" font-size="13" font-weight="700" fill="#334155">PRODUCT</text>
<text x="68" y="205.6" font-size="15" font-weight="700" fill="#86198F">Application tasks</text>
<text x="68" y="230.4" font-size="13" fill="#2B3442">control, protocols, safety layer</text>
<text x="48" y="336.8" font-size="13" font-weight="700" fill="#334155">BOARD HAL</text>
<text x="68" y="379.6" font-size="15" font-weight="700" fill="#0E1726">Board facade and managers</text>
<text x="68" y="404.4" font-size="13" fill="#2B3442">built on kb-hal-common</text>
<text x="486.5" y="379.6" font-size="15" font-weight="700" fill="#0E1726">Board config</text>
<text x="486.5" y="404.4" font-size="13" fill="#2B3442">bus table, thread model per bus, chip</text>
<text x="486.5" y="423.3" font-size="13" fill="#2B3442">list, pins</text>
<text x="798.2" y="379.6" font-size="15" font-weight="700" fill="#0E1726">Platform bind</text>
<text x="798.2" y="404.4" font-size="13" fill="#2B3442">builds the port objects, sets the start-up order</text>
<rect x="753.8" y="290.3" width="39.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="773.7" y="304.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">calls</text>
<text x="48" y="549.8" font-size="13" font-weight="700" fill="#7A360E">KB-CORE</text>
<text x="68" y="592.5" font-size="15" font-weight="700" fill="#5B21B6">kb::handlers</text>
<text x="68" y="617.4" font-size="13" fill="#2B3442">bindings, handler core, start-up</text>
<text x="68" y="636.2" font-size="13" fill="#2B3442">pipeline, owner and guarded</text>
<text x="68" y="655.1" font-size="13" fill="#2B3442">access</text>
<text x="348.5" y="592.5" font-size="15" font-weight="700" fill="#1E429F">kb::interfaces</text>
<text x="348.5" y="617.4" font-size="13" fill="#2B3442">contracts: C++20 concepts only,</text>
<text x="348.5" y="636.2" font-size="13" fill="#2B3442">plus the host test port</text>
<text x="629" y="592.5" font-size="15" font-weight="700" fill="#8A3C0B">kb::rtos</text>
<text x="629" y="617.4" font-size="13" fill="#2B3442">API; backends none, FreeRTOS,</text>
<text x="629" y="636.2" font-size="13" fill="#2B3442">ThreadX</text>
<text x="909.5" y="592.5" font-size="15" font-weight="700" fill="#7A360E">kb::utils</text>
<text x="909.5" y="617.4" font-size="13" fill="#2B3442">Status/Result, units, containers,</text>
<text x="909.5" y="636.2" font-size="13" fill="#2B3442">CRC, seqlock</text>
<rect x="335.9" y="493.3" width="40.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="356.4" y="507.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">uses</text>
<text x="68" y="779.5" font-size="15" font-weight="700" fill="#14532D">driver-&lt;chip&gt;</text>
<text x="68" y="804.4" font-size="13" fill="#2B3442">brand-free, own CI at level high,</text>
<text x="68" y="823.2" font-size="13" fill="#2B3442">pinned release tags</text>
<rect x="261.5" y="702.8" width="45.4" height="20" rx="10" fill="#FFFFFF"/>
<text x="284.2" y="717.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">binds</text>
<text x="328.5" y="737.8" font-size="13" font-weight="700" fill="#0B5F59">MCU PORTS</text>
<text x="348.5" y="780.5" font-size="15" font-weight="700" fill="#0B5F59">port-esp32</text>
<text x="348.5" y="805.4" font-size="13" fill="#2B3442">components/ports/esp32, own CMake project</text>
<text x="769.2" y="780.5" font-size="15" font-weight="700" fill="#0E1726">port-stm32</text>
<text x="769.2" y="805.4" font-size="13" fill="#2B3442">planned, own repository</text>
<rect x="523.8" y="703.3" width="62.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="555.2" y="717.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">satisfies</text>
<text x="52" y="931.5" font-size="15" font-weight="700" fill="#0E1726">SOUP</text>
<text x="52" y="956.4" font-size="13" fill="#2B3442">ESP-IDF, STM32 HAL, FreeRTOS, ThreadX, mbedTLS. Reached only through boundary files of the ports and the RTOS backends; never analysed, never edited.</text>
<rect x="561.2" y="853.8" width="128.4" height="20" rx="10" fill="#FFFFFF"/>
<text x="625.4" y="868.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">boundary files only</text>
<rect x="32" y="989.2" width="14" height="14" rx="4" fill="#FDF0FF" stroke="#A21CAF" stroke-width="1.4"/>
<text x="54" y="1000.8" font-size="12.5" fill="#566070">product and board HAL</text>
<rect x="224.5" y="989.2" width="14" height="14" rx="4" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="246.5" y="1000.8" font-size="12.5" fill="#566070">handlers</text>
<rect x="324.7" y="989.2" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="346.7" y="1000.8" font-size="12.5" fill="#566070">interfaces and contracts</text>
<rect x="523.2" y="989.2" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="545.2" y="1000.8" font-size="12.5" fill="#566070">kb::rtos</text>
<rect x="616.5" y="989.2" width="14" height="14" rx="4" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<text x="638.5" y="1000.8" font-size="12.5" fill="#566070">kb::utils</text>
<rect x="711.1" y="989.2" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="733.1" y="1000.8" font-size="12.5" fill="#566070">MCU ports</text>
<rect x="824.7" y="989.2" width="14" height="14" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<text x="846.7" y="1000.8" font-size="12.5" fill="#566070">drivers</text>
<rect x="914.2" y="989.2" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="936.2" y="1000.8" font-size="12.5" fill="#566070">SOUP and planned</text>
