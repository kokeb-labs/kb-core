<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1035" viewBox="0 0 1200 1035" role="img" aria-labelledby="layer-stack-title layer-stack-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="layer-stack-title">The layer stack</title>
<desc id="layer-stack-desc">Layer stack, top to bottom: the product application; the board HAL repository; kb-core with kb::handlers, kb::interfaces, kb::rtos and kb::utils, each depending on the next; below it the drivers used by handlers, the MCU ports that satisfy the interface contracts, and the vendor SOUP reached only through boundary files.</desc>
