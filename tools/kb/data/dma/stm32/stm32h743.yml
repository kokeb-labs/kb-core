# Request lines: STM32Cube HAL stm32h7xx_hal_dma.h (DMA_REQUEST_*, BDMA_REQUEST_*) at the commit pinned by the STM32
# port (stm32h7xx-hal-driver v1.11.7, 65e5c7e40456f4d76d79f972738a16cb3a17762c), restricted to the lines of RM0433
# DMAMUX1 (1-115; line 54 is reserved) and DMAMUX2 (1-17). The reference manual itself could not be fetched.
