errata:
  - id: ES0392-2.4.1
    rule: bdma_individual_flag_clear
    applies_to: [bdma]
    verified: unverified
    text: >-
      BDMA: a channel can fail to disable, and a transfer error flag can be missed, when a transfer error and a
      global flag clear coincide. Clear individual flags only (never CGIFx alone) and check TEIF before disabling.
  - id: ES0392-2.5.1
    rule: no_dmamux_sync
    applies_to: [dmamux1, dmamux2]
    verified: unverified
    text: >-
      DMAMUX: the synchronisation overrun flag SOFx may not be asserted when DMAMUX_CFR is written at the same time.
      Synchronisation and request generators are refused until a port feature handles the erratum.
