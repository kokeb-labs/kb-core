# DMA routing and reach of the STM32G474: DMA1 and DMA2 with 8 channels each, DMAMUX1 with 16 channels (DMA1 channels
# 1-8 are DMAMUX channels 0-7, DMA2 channels 1-8 are 8-15). Every request can use any channel. Field meanings:
# ../README.md.
# Request lines: STM32Cube HAL stm32g4xx_hal_dma.h (DMA_REQUEST_*) at the commit pinned by the STM32 port
# (stm32g4xx-hal-driver v1.2.7, f5929f431f9effe45fbe18f5337e4753ced9ac92), the RM0440 DMAMUX request table. A few
# lines belong to peripherals that other G4 parts have and the G474 lacks (AES_IN and AES_OUT: G483 and G484 only).
# The reference manual itself could not be fetched.
# SPDX-License-Identifier: MIT
# Copyright (c) 2026 The kb-core authors
device: STM32G474
family: g4
source:
  document: RM0440
  revision: "unchecked"
  sections: ["12 DMA", "13 DMAMUX", "2 Memory and bus architecture"]
  requests_from: stm32g4xx_hal_dma.h v1.2.7 (f5929f431f9effe45fbe18f5337e4753ced9ac92)
  memory_geometry_from: cmsis-device-g4 v1.2.6 (25664ddc3a7624ae9627ae8c4c672073dc5b2539) stm32g474xx.h
verified:
  mux: hal-header
  memories: unverified      # base and size agree with the CMSIS device header; the reach is from knowledge of RM0440
  errata: unverified        # ES0430 section numbers not checked
cores: [cm4]
nvic_priority_bits: 4
engines:
  dma1: {id: 1, master_bit: 0, units: channels, first: 1, count: 8, mux: dmamux1, mux_channel_base: 0}
  dma2: {id: 2, master_bit: 1, units: channels, first: 1, count: 8, mux: dmamux1, mux_channel_base: 8}
routing: mux
mux_groups:
  dmamux1: {channels: 16, engines: [dma1, dma2], max_request: 115, generators: 4}
