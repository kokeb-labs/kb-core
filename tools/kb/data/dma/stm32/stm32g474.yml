errata:
  - id: ES0430-DMAMUX
    rule: no_dmamux_sync
    applies_to: [dmamux1]
    verified: unverified
    text: >-
      DMAMUX: the synchronisation overrun and request generator overrun flags (SOFx, OFx) may not be asserted in some
      register write coincidences. Synchronisation and request generators are refused until a port feature handles
      the erratum. The section number in ES0430 is to be filled in at the next check.
